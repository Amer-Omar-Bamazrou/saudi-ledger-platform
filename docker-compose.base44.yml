# Base44 development compose — runs the Saudi Ledger Platform from bind-mounted
# source with live-reload on the frontend. See AGENTS.md for verification steps.
#
# Architecture: single-origin (web on :3000 proxies /api → api:3000 inside the
# compose network). Only port 3000 is exposed to the host (the preview).
#
# Services:
#   postgres  — PostgreSQL 16 + `authenticated` role for RLS
#   install   — one-shot `pnpm install --frozen-lockfile` (shared bind mount)
#   migrate   — one-shot drizzle migrations + seed (default org + admin)
#   api       — Express API (esbuild bundle, no hot reload — restart on change)
#   web       — Vite dev server on :3000 (hot reload, proxies /api → api:3000)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-init.base44.sql:/docker-entrypoint-initdb.d/01-create-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  install:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile"
    restart: "no"

  migrate:
    image: node:22-slim
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - SEED_ADMIN_EMAIL=admin@ledger.local
      - SEED_ADMIN_PASSWORD=Admin123456!
      - SEED_ADMIN_NAME=Admin
    command: sh -c "corepack enable && pnpm --filter @workspace/db run migrate && pnpm --filter @workspace/db run seed"
    restart: "no"

  api:
    image: node:22-slim
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - PORT=3000
      - NODE_ENV=development
      - CORS_ALLOWED_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX},http://localhost:3000
      - DB_APP_ROLE=authenticated
      - TRUST_PROXY_HOPS=1
    command: sh -c "corepack enable && pnpm --filter @workspace/api-server run dev"
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /app
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_PATH=/
      - API_PROXY_TARGET=http://api:3000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "corepack enable && pnpm --filter @workspace/bookkeeping run dev"
    restart: unless-stopped

volumes:
  pgdata:
