name: CI

# Runs on every pull request and every push to main.
# Required checks for merging into main (configure in branch protection):
#   - typecheck
#   - test
#   - build
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type safety across the whole monorepo ──────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # ── Tests: DB-free API tests + DB-backed isolation/rollback tests ──────────
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # C2 — the storage suite gates on the PRESENCE of SUPABASE_URL +
      # SUPABASE_SERVICE_ROLE_KEY (their absence is deliberately how it skips),
      # so supplying them is what turns the suite on. The KEY is not set here:
      # it is MINTED in the storage step from the same secret the container
      # gets, because a hardcoded JWT and the container's AUTH_JWT_SECRET are
      # two facts that must agree — and when they silently disagreed, every
      # storage call failed with `invalid signature`.
      SUPABASE_URL: http://localhost:5001
      STORAGE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── ZATCA SDK: the ONLY authoritative check that our UBL is valid ──────
      # M12.2 generates UBL 2.1 XML. Its correctness is proven by running
      # ZATCA's own Compliance & Enablement Toolbox (XSD + EN 16931 + 55 BR-KSA
      # schematron rules), which needs Java. Without this, `ubl-zatca-validator`
      # skips and CI would look green while proving nothing about the highest
      # consequence code in the platform — exactly the M11.4 storage-coverage
      # gap, repeated. So it runs here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The SDK is a ~40 MB download from ZATCA's SharePoint. Cache it on the
      # pinned checksum so a normal run does not hit their host at all.
      - name: Cache ZATCA SDK
        id: zatca-sdk-cache
        uses: actions/cache@v4
        with:
          path: docs/zatca/sdk
          key: zatca-sdk-1a7df6d91fd34968ad59a97087f637f56504fdf92c42050916b838be20fc5ae3

      # SKIP LOUDLY, never fail the build: SharePoint is a third-party host we
      # do not control, and an outage there must not red-build unrelated work.
      # The test file prints a prominent skip banner when the SDK is absent, so
      # a fetch failure is visible in the log rather than silently "passing".
      # Invoked via `bash` rather than `./…` on purpose: a lost executable bit
      # is otherwise a silent `Permission denied` that skips the validator while
      # CI stays green. (It bit exactly once — the scripts were committed 100644.
      # The bit is now set too; this is belt and braces.)
      - name: Fetch ZATCA SDK
        if: steps.zatca-sdk-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash ./docs/zatca/fetch-sdk.sh

      - name: Report ZATCA SDK availability
        run: |
          if [ -f docs/zatca/sdk/extracted/zatca-envoice-sdk-203/Apps/cli-3.0.8-jar-with-dependencies.jar ]; then
            echo "::notice title=ZATCA SDK::present — UBL validator tests will RUN"
          else
            echo "::warning title=ZATCA SDK::MISSING — UBL validator tests will SKIP. This run does NOT prove our UBL is valid."
          fi

      # The RLS isolation/rollback tests drop to the non-owner `authenticated`
      # role (a Supabase built-in) via SET LOCAL ROLE, and migration 0004 grants
      # privileges to it. A vanilla postgres:16 container has no such role, so
      # create it and make `postgres` a member before applying migrations. The
      # service container is fresh per run, so no idempotency guard is needed.
      # `authenticated` is ours (RLS tests SET LOCAL ROLE to it, migration 0004
      # grants to it). `anon` and `service_role` exist only because the storage
      # container's own migrations name them in `REVOKE ... FROM anon,
      # authenticated` — without them storage-api dies at boot with
      # `role "anon" does not exist`, which is exactly how the first C2 run
      # failed. They are created NOLOGIN and granted nothing; they exist to be
      # revoked from.
      - name: Bootstrap non-owner roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
            END \$\$;
            GRANT authenticated TO postgres;
            -- storage-api serves every request as \`service_role\`, which in a
            -- real Supabase stack bypasses RLS. Without this, creating the
            -- bucket fails with 'new row violates row-level security policy'.
            ALTER ROLE service_role BYPASSRLS;"

      # ── C2: object storage, so the document path is actually EXERCISED ──────
      # Was the M11.4 coverage gap: `documents.test.ts` skips unless SUPABASE_URL
      # and SUPABASE_SERVICE_ROLE_KEY are set, so CI proved nothing about upload,
      # download, sanitization or tenant-prefixed paths.
      #
      # 🔴 A STEP, not a `services:` entry — and that is the whole fix. A service
      # container starts BEFORE the first step runs, so it hit Postgres while the
      # roles its migrations revoke from did not yet exist. Nothing a later step
      # does can be early enough. Starting it here orders it after the bootstrap.
      #
      # 🔴 nginx is not decoration either: `lib/storage.ts` addresses
      # `/storage/v1/object/...` because that is the path Kong exposes in a real
      # Supabase stack. A bare storage-api serves those routes at the ROOT and
      # would 404 every call. Rewriting the prefix here keeps the test exercising
      # the SAME URLs production uses — a lib change to suit CI would have made
      # the suite prove the wrong thing.
      - name: Start object storage (storage-api + path-rewriting proxy)
        run: |
          set -euo pipefail

          # Mint the service-role JWT from the SAME secret the container gets,
          # so the key and the verifier cannot drift apart.
          KEY=$(node -e "
            const c=require('crypto');
            const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
            const h=b64({alg:'HS256',typ:'JWT'});
            const p=b64({role:'service_role',iss:'supabase-demo',iat:1641769200,exp:1957345600});
            const s=c.createHmac('sha256',process.env.STORAGE_JWT_SECRET).update(h+'.'+p).digest('base64url');
            console.log(h+'.'+p+'.'+s);
          ")
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

          docker run -d --name storage --network host \
            -e ANON_KEY="$KEY" -e SERVICE_KEY="$KEY" \
            -e AUTH_JWT_SECRET="$STORAGE_JWT_SECRET" \
            -e PGRST_JWT_SECRET="$STORAGE_JWT_SECRET" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e POSTGREST_URL='http://localhost:3999' \
            -e FILE_SIZE_LIMIT=52428800 \
            -e STORAGE_BACKEND=file \
            -e FILE_STORAGE_BACKEND_PATH=/var/lib/storage \
            -e TENANT_ID=ci -e REGION=ci -e GLOBAL_S3_BUCKET=ci \
            supabase/storage-api:v1.11.13

          printf 'server { listen 5001; location /storage/v1/ { proxy_pass http://127.0.0.1:5000/; } }\n' > /tmp/storage-proxy.conf
          docker run -d --name storage-proxy --network host \
            -v /tmp/storage-proxy.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.27-alpine

          # Fail LOUDLY and print the container log. A storage container that
          # never came up must not degrade into "suite skipped, CI green" —
          # that silent-skip posture is the gap C2 exists to close.
          up=""
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5001/storage/v1/status >/dev/null 2>&1; then
              up="yes"; echo "::notice title=Storage::up after ${i}s"; break
            fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error title=Storage::storage-api never became healthy"
            docker logs storage; exit 1
          fi

          # 🔴 These grants come AFTER the container, not before: the `storage`
          # schema is created by storage-api's OWN migrations at boot, so there
          # is nothing to grant on until it has started. Without them every
          # request fails as `relation "buckets" does not exist` — Postgres
          # hides relations in a schema the role has no USAGE on, so a missing
          # grant is reported as a missing TABLE. That misreading cost the
          # longest part of this diagnosis.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            GRANT USAGE ON SCHEMA storage TO anon, authenticated, service_role;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA storage TO service_role;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA storage TO service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA storage GRANT ALL ON TABLES TO service_role;"

          # Prove the round-trip BEFORE the suite runs, so a broken container is
          # a clear infrastructure error here rather than six confusing
          # assertion failures later.
          curl -fsS -X POST http://localhost:5001/storage/v1/bucket \
            -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"id":"ci-smoke","name":"ci-smoke","public":false}' >/dev/null
          echo hello > /tmp/smoke.txt
          curl -fsS -X POST "http://localhost:5001/storage/v1/object/ci-smoke/smoke.txt" \
            -H "Authorization: Bearer $KEY" -H 'content-type: text/plain' \
            --data-binary @/tmp/smoke.txt >/dev/null
          test "$(curl -fsS "http://localhost:5001/storage/v1/object/ci-smoke/smoke.txt" -H "Authorization: Bearer $KEY")" = "hello"
          echo "::notice title=Storage::round-trip verified — document tests will RUN"

      - name: Apply migrations
        run: pnpm --filter @workspace/db run migrate

      - name: API tests (DB-free)
        run: pnpm --filter @workspace/api-server run test

      - name: DB tests (cross-tenant RLS isolation + transaction rollback)
        run: pnpm --filter @workspace/db run test

      # A1: the ZATCA TLV codec is SHARED by the server (issuing our invoices)
      # and the browser (reading a supplier's). It carries thirteen documented
      # divergences that were wrong twice before live responses settled them —
      # one implementation, and it must stay covered.
      - name: ZATCA TLV codec tests
        run: pnpm --filter @workspace/zatca-tlv run test

      # A1: `receiptParser` held ~60 assertions in a hand-rolled script that NO
      # RUNNER EXECUTED. The OCR bake-off measures this parser, so it has to be
      # guarded before it is measured. Pure functions only — no jsdom, no
      # component testing (see apps/web/vitest.config.ts).
      - name: Web unit tests (receipt parser)
        run: pnpm --filter @workspace/bookkeeping run test

  # ── P5: the browser suite — the only layer that has ever caught this class ──
  # Every other job here runs BELOW the layer that breaks. The scoreboard in
  # CLAUDE.md §5: a browser found the blank AP-aging page, swallowed refusals,
  # a GL showing SAR 0.00, an uneditable bill, AUD-13's zero-value tax invoice
  # and a statement link that dropped its customer; 1,179 unit tests found none
  # of them.
  #
  # 🔴 NOT a required check on day one, deliberately. A new browser suite's
  # first weeks are when its flakes surface, and a flaky REQUIRED check teaches
  # people to re-run rather than to read — which is the exact failure P5 exists
  # to prevent, imported into the guard itself. Promote it to required in branch
  # protection once it has been green across a stretch of real PRs. Until then
  # it reports, loudly, and blocks nothing.
  e2e:
    name: e2e (browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PORT: "3000"
      SESSION_SECRET: e2e-session-secret-at-least-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      BASE_PATH: /
      # A throwaway tenant's fixture password, not a secret — the suite creates
      # the account it logs into, and CI must reproduce the run exactly.
      E2E_PASSWORD: e2e-smoke-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same non-owner roles the `test` job creates: migration 0004 grants to
      # `authenticated`, and the app's per-request transactions drop to it.
      - name: Bootstrap non-owner roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            END \$\$;
            GRANT authenticated TO postgres;"

      - name: Apply migrations
        run: pnpm --filter @workspace/db run migrate

      # Cache the browser binary on the resolved Playwright version, so a normal
      # run does not re-download ~150 MB. Keyed on the lockfile so a version
      # bump invalidates it rather than silently running the old browser.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` on a miss only: it installs system libraries too, which is
      # what a bare ubuntu runner lacks. On a cache hit the binary is present and
      # the deps are already part of the image layer.
      - name: Install Playwright browser
        run: pnpm --filter @workspace/bookkeeping exec playwright install --with-deps chromium

      # Playwright starts BOTH servers itself (see playwright.config.ts), so the
      # local run and this run are the same run. A CI-only start sequence would
      # make "works locally" and "works in CI" two different claims.
      - name: Browser suite
        run: pnpm --filter @workspace/bookkeeping run test:e2e

      # With retries at zero, the trace from the single failure is the whole
      # diagnosis. Keep it.
      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # ── Production build of every app/package ──────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    # The web build (vite.config.ts) requires PORT + BASE_PATH at config load.
    env:
      NODE_ENV: production
      PORT: "3000"
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
