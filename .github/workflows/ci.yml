name: CI

# Runs on every pull request and every push to main.
# Required checks for merging into main (configure in branch protection):
#   - typecheck
#   - test
#   - build
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type safety across the whole monorepo ──────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # ── Tests: DB-free API tests + DB-backed isolation/rollback tests ──────────
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── ZATCA SDK: the ONLY authoritative check that our UBL is valid ──────
      # M12.2 generates UBL 2.1 XML. Its correctness is proven by running
      # ZATCA's own Compliance & Enablement Toolbox (XSD + EN 16931 + 55 BR-KSA
      # schematron rules), which needs Java. Without this, `ubl-zatca-validator`
      # skips and CI would look green while proving nothing about the highest
      # consequence code in the platform — exactly the M11.4 storage-coverage
      # gap, repeated. So it runs here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The SDK is a ~40 MB download from ZATCA's SharePoint. Cache it on the
      # pinned checksum so a normal run does not hit their host at all.
      - name: Cache ZATCA SDK
        id: zatca-sdk-cache
        uses: actions/cache@v4
        with:
          path: docs/zatca/sdk
          key: zatca-sdk-1a7df6d91fd34968ad59a97087f637f56504fdf92c42050916b838be20fc5ae3

      # SKIP LOUDLY, never fail the build: SharePoint is a third-party host we
      # do not control, and an outage there must not red-build unrelated work.
      # The test file prints a prominent skip banner when the SDK is absent, so
      # a fetch failure is visible in the log rather than silently "passing".
      - name: Fetch ZATCA SDK
        if: steps.zatca-sdk-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: ./docs/zatca/fetch-sdk.sh

      - name: Report ZATCA SDK availability
        run: |
          if [ -f docs/zatca/sdk/extracted/zatca-envoice-sdk-203/Apps/cli-3.0.8-jar-with-dependencies.jar ]; then
            echo "::notice title=ZATCA SDK::present — UBL validator tests will RUN"
          else
            echo "::warning title=ZATCA SDK::MISSING — UBL validator tests will SKIP. This run does NOT prove our UBL is valid."
          fi

      # The RLS isolation/rollback tests drop to the non-owner `authenticated`
      # role (a Supabase built-in) via SET LOCAL ROLE, and migration 0004 grants
      # privileges to it. A vanilla postgres:16 container has no such role, so
      # create it and make `postgres` a member before applying migrations. The
      # service container is fresh per run, so no idempotency guard is needed.
      - name: Bootstrap non-owner role (authenticated)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN; GRANT authenticated TO postgres;"

      - name: Apply migrations
        run: pnpm --filter @workspace/db run migrate

      - name: API tests (DB-free)
        run: pnpm --filter @workspace/api-server run test

      - name: DB tests (cross-tenant RLS isolation + transaction rollback)
        run: pnpm --filter @workspace/db run test

  # ── Production build of every app/package ──────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    # The web build (vite.config.ts) requires PORT + BASE_PATH at config load.
    env:
      NODE_ENV: production
      PORT: "3000"
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
