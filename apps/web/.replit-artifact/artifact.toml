kind = "web"
previewPath = "/"
title = "Saudi Bookkeeping Engine"
version = "1.0.0"
id = "artifacts/bookkeeping"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21462

[services.development]
run = "pnpm --filter @workspace/bookkeeping run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bookkeeping", "run", "build" ]
serve = "static"
publicDir = "artifacts/bookkeeping/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21462"
BASE_PATH = "/"
