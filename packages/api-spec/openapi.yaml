openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Saudi Bookkeeping Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Transaction management
  - name: categories
    description: Category management
  - name: categorize
    description: Categorization engine
  - name: summary
    description: Financial summaries and reports
  - name: journal_entries
    description: Journal entries and the draft/approval workflow
  - name: bills
    description: Vendor bills (AP) and the draft/approval workflow
  - name: invoices
    description: Customer invoices (AR, ZATCA) and the draft/approval workflow
  - name: payroll
    description: Payroll runs and the draft/approval workflow

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      parameters:
        - name: category_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: is_zakat_relevant
          in: query
          schema:
            type: ["boolean", "null"]
        - name: is_manually_overridden
          in: query
          schema:
            type: ["boolean", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: [debit, credit, null]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"

    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a single transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/upload:
    post:
      operationId: uploadTransactions
      tags: [transactions]
      summary: Upload transactions from CSV or JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpload"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction (manual override)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categorize:
    post:
      operationId: runCategorization
      tags: [categorize]
      summary: Run the categorization engine on uncategorized transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategorizationRequest"
      responses:
        "200":
          description: Categorization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizationResult"

  /companies/current:
    get:
      operationId: getCurrentCompany
      tags: [companies]
      summary: Get the active company's profile (legal identity + address)
      responses:
        "200":
          description: The active company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCurrentCompany
      tags: [companies]
      summary: Update the active company's profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyInput"
      responses:
        "200":
          description: The updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /summary:
    get:
      operationId: getSummary
      tags: [summary]
      summary: Get full financial summary
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  /summary/vat:
    get:
      operationId: getVatSummary
      tags: [summary]
      summary: Get VAT summary
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: VAT summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VatSummary"

  /summary/zakat:
    get:
      operationId: getZakatSummary
      tags: [summary]
      summary: Get Zakat-eligible asset summary
      responses:
        "200":
          description: Zakat summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZakatSummary"

  /summary/by-category:
    get:
      operationId: getSummaryByCategory
      tags: [summary]
      summary: Get spending and income totals grouped by category
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Per-category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

  /journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [journal_entries]
      summary: Approve a draft journal entry (posts it to the general ledger)
      description: >
        Draft/approval workflow (M10.2). Approving a draft (pending) journal
        entry fires its activation path — the period-lock check and the
        post-to-GL transition — so it becomes active in the ledger. Only an
        approver (admin/accountant) may call this; a bookkeeper is denied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (posted) journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The journal entry is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /journal-entries/{id}/reject:
    post:
      operationId: rejectJournalEntry
      tags: [journal_entries]
      summary: Reject a pending draft journal entry (hard-deletes it)
      description: >
        Draft/approval workflow (M10.2). Rejecting a pending draft hard-deletes
        it — there is no archive of rejected drafts. Only a pending draft can be
        rejected; a posted/reversed entry must be reversed instead. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The draft was rejected and removed
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a pending draft can be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/submit:
    post:
      operationId: submitBill
      tags: [bills]
      summary: Submit a draft bill into the approval queue
      description: >
        Draft/approval workflow (M10.3). Moves an editable draft bill to
        `submitted` (awaiting approval); the bill is locked to the enterer until
        approved or sent back. This is the bookkeeper's own action (create-level
        authorization), not an approver action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft bill can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/send-back:
    post:
      operationId: sendBackBill
      tags: [bills]
      summary: Send a submitted bill back to the enterer for correction
      description: >
        Draft/approval workflow (M10.3). Returns a `submitted` bill to `draft`
        with an optional reviewer note (shown to the enterer while editing). The
        enterer corrects and resubmits. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The bill, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted bill can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [bills]
      summary: Approve a bill (posts it to the general ledger)
      description: >
        Draft/approval workflow (M10.3). Approving a bill fires its activation:
        totals reconciliation, ZATCA vendor-VAT validation (both overridable with
        `force`), the period-lock check, and the Dr Purchases/Input VAT / Cr
        Accounts Payable posting. Only then does the bill affect AP/expense/VAT.
        May be approved straight from draft (self-approve) or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillApproveInput"
      responses:
        "200":
          description: The approved (posted) bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Business-rule rejection (zero total, totals mismatch, invalid VAT number)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The bill is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/reject:
    post:
      operationId: rejectBill
      tags: [bills]
      summary: Reject a non-approved bill (hard-deletes it)
      description: >
        Draft/approval workflow (M10.3). Hard-deletes a draft or submitted bill —
        no archive of rejected records. An approved bill cannot be rejected (it
        must be reversed). Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The bill was rejected and removed
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An approved bill cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/submit:
    post:
      operationId: submitInvoice
      tags: [invoices]
      summary: Submit a draft invoice into the approval queue
      description: >
        Draft/approval workflow (M10.4). Moves an editable draft invoice to
        `submitted` (awaiting approval); locked to the enterer until approved or
        sent back. Bookkeeper (create-level) action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft invoice can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/send-back:
    post:
      operationId: sendBackInvoice
      tags: [invoices]
      summary: Send a submitted invoice back to the enterer for correction
      description: >
        Draft/approval workflow (M10.4). Returns a `submitted` invoice to `draft`
        with an optional reviewer note. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The invoice, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted invoice can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/approve:
    post:
      operationId: approveInvoice
      tags: [invoices]
      summary: Approve (issue) an invoice — builds the ZATCA hash chain and posts AR
      description: >
        Draft/approval workflow (M10.4). Approving an invoice issues it: it is
        recognized in AR/revenue/VAT, and its ZATCA hash-chain link + QR are
        minted HERE (not at create), so a rejected/deleted draft never consumes a
        sequence number. May be approved straight from draft (self-approve on
        create, done automatically for approvers) or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (issued) invoice, with ZATCA hash + QR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The invoice is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/reject:
    post:
      operationId: rejectInvoice
      tags: [invoices]
      summary: Reject a non-approved invoice (hard-deletes it)
      description: >
        Draft/approval workflow (M10.4). Hard-deletes a draft or submitted invoice
        — no archive. Because a draft carries no hash-chain link, deleting it
        leaves no gap in the sequence. An issued invoice cannot be rejected (it
        must be reversed with a credit note). Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The invoice was rejected and removed
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An issued invoice cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/submit:
    post:
      operationId: submitPayrollRun
      tags: [payroll]
      summary: Submit a draft payroll run into the approval queue
      description: >
        Draft/approval workflow (M10.5). Moves a draft run to `submitted`
        (awaiting approval). Bookkeeper (create-level) action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft run can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/send-back:
    post:
      operationId: sendBackPayrollRun
      tags: [payroll]
      summary: Send a submitted payroll run back to the enterer for correction
      description: >
        Draft/approval workflow (M10.5). Returns a `submitted` run to `draft` with
        an optional reviewer note. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The payroll run, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted run can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/approve:
    post:
      operationId: approvePayrollRun
      tags: [payroll]
      summary: Approve a payroll run (posts the payroll GL entry)
      description: >
        Draft/approval workflow (M10.5). Approving a run posts its GL entry (Dr
        Salaries + Employer GOSI / Cr Net Pay + GOSI Payable) — the only ledger
        effect a run has. May be approved from draft or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (posted) payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The payroll run is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/reject:
    post:
      operationId: rejectPayrollRun
      tags: [payroll]
      summary: Reject a non-approved payroll run (hard-deletes it)
      description: >
        Draft/approval workflow (M10.5). Hard-deletes a draft or submitted run —
        no archive. An approved run cannot be rejected. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The payroll run was rejected and removed
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An approved run cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Company:
      type: object
      description: >
        A company's legal identity. `vatNumber` and `name` are the SELLER identity
        stamped onto every issued e-invoice (ZATCA QR tags 1-2 and the invoice
        hash), so they are not cosmetic settings.
      required:
        [
          id,
          name,
          nameAr,
          crNumber,
          vatNumber,
          fiscalYearStart,
          buildingNumber,
          street,
          district,
          city,
          postalCode,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        crNumber:
          type: ["string", "null"]
        vatNumber:
          type: ["string", "null"]
        fiscalYearStart:
          type: integer
        buildingNumber:
          type: ["string", "null"]
        street:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]

    UpdateCompanyInput:
      type: object
      description: >
        Partial update. Any omitted field is left unchanged; send an empty string
        to clear an optional field.
      properties:
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        crNumber:
          type: ["string", "null"]
        vatNumber:
          type: ["string", "null"]
        fiscalYearStart:
          type: integer
          minimum: 1
          maximum: 12
        buildingNumber:
          type: ["string", "null"]
        street:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]

    Category:
      type: object
      required: [id, name, nameAr, type, vatApplicable, zakatRelevant]
      properties:
        id:
          type: integer
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, asset, liability, equity]
        vatApplicable:
          type: boolean
        zakatRelevant:
          type: boolean
        description:
          type: ["string", "null"]

    CategoryInput:
      type: object
      required: [name, nameAr, type, vatApplicable, zakatRelevant]
      properties:
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, asset, liability, equity]
        vatApplicable:
