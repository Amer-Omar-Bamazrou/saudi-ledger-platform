    Customer:
      type: object
      required: [id, name, nameAr, taxNumber, crNumber, nationalId, phone, email, address, city, country,
                 buildingNumber, street, district, postalCode, additionalNumber, province, currency,
                 creditLimit, paymentTermsDays, notes, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        taxNumber: { type: ["string", "null"] }
        crNumber: { type: ["string", "null"] }
        nationalId: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        buildingNumber: { type: ["string", "null"] }
        street: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        additionalNumber: { type: ["string", "null"] }
        province: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        creditLimit:
          type: ["number", "null"]
          description: Null means no limit is set. Stored as text; presented as a number on every read path.
        paymentTermsDays: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string }

    CustomerPosition:
      description: >-
        Phase E — a customer's position as three NON-NEGATIVE components, each from its own subledger and GL account, and a derived net.
        `receivable` (Accounts Receivable) is Σ over issued invoices/debit notes of total − paid − credited; `creditBalance` (Customer Credits)
        is Σ issued credit notes − active applications − credit-note refunds; `depositBalance` (Customer Deposits) is Σ receipts − active
        allocations − deposit refunds. `netPosition` = receivable − creditBalance − depositBalance (positive: the customer owes us; negative:
        we owe the customer). A liability is never expressed as a negative receivable.
      type: object
      required: [receivable, creditBalance, depositBalance, netPosition]
      properties:
        receivable: { type: number, minimum: 0 }
        creditBalance: { type: number, minimum: 0 }
        depositBalance: { type: number, minimum: 0 }
        netPosition: { type: number }

    CustomerTotals:
      description: "`balance` IS `netPosition` — kept under its historical name for net-exposure readers; the components are beside it."
      allOf:
        - { $ref: "#/components/schemas/PartyTotals" }
        - { $ref: "#/components/schemas/CustomerPosition" }

    CustomerWithBalance:
      description: "`balance` IS `netPosition` (see CustomerPosition)."
      allOf:
        - { $ref: "#/components/schemas/Customer" }
        - { $ref: "#/components/schemas/PartyTotals" }
        - { $ref: "#/components/schemas/CustomerPosition" }

    CustomerStatementLine:
      type: object
      required: [seq, date, kind, documentNumber, reference, description, amount, receivableDelta, creditDelta, depositDelta,
                 receivable, creditBalance, depositBalance, netPosition, invoiceId, paymentId, creditNoteId, allocationId, refundId, journalEntryId]
      properties:
        seq: { type: integer }
        date: { type: string }
        kind: { type: string, enum: [invoice, debit_note, credit_note, advance_invoice, advance_credit_note, bad_debt_write_off, recovery_invoice, receipt, allocation, credit_application, unallocation, refund] }
        documentNumber: { type: string }
        reference: { type: ["string", "null"] }
        description: { type: string }
        amount: { type: number }
        receivableDelta: { type: number }
        creditDelta: { type: number }
        depositDelta: { type: number }
        receivable: { type: number, description: Running Accounts Receivable after this line }
        creditBalance: { type: number, description: Running Customer Credits after this line }
        depositBalance: { type: number, description: Running Customer Deposits after this line }
        netPosition: { type: number, description: Derived — receivable − creditBalance − depositBalance }
        invoiceId: { type: ["integer", "null"] }
        paymentId: { type: ["integer", "null"] }
        creditNoteId: { type: ["integer", "null"] }
        allocationId: { type: ["integer", "null"] }
        refundId: { type: ["integer", "null"] }
        journalEntryId: { type: ["integer", "null"] }

    CustomerStatement:
      type: object
      required: [customerId, customerName, customerNameAr, period, opening, lines, closing, current, subledger, reconciled, eventCount]
      properties:
        customerId: { type: integer }
        customerName: { type: string }
        customerNameAr: { type: ["string", "null"] }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: ["string", "null"] }
            to: { type: ["string", "null"] }
        opening: { $ref: "#/components/schemas/CustomerPosition" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CustomerStatementLine" }
        closing: { $ref: "#/components/schemas/CustomerPosition" }
        current:
          allOf:
            - { $ref: "#/components/schemas/CustomerPosition" }
          description: The position after EVERY event, ignoring the window — what the events say the customer's position is today.
        subledger:
          allOf:
            - { $ref: "#/components/schemas/CustomerPosition" }
          description: The same position read from the subledger caches and active-allocation sets.
        reconciled: { type: boolean, description: "`current` equals `subledger` on all three components (to the halala)." }
        eventCount: { type: integer }

    CustomerDetail:
      allOf:
        - { $ref: "#/components/schemas/CustomerWithBalance" }
        - type: object
          required: [invoiceCount]
          properties:
            invoiceCount:
              type: integer
              description: ISSUED invoices only — drafts and submitted documents do not count.

    CustomerInputFields:
      description: The allow-listed, user-settable customer fields. Empty strings are accepted and stored as null by the write boundary.
      type: object
      properties:
        name: { type: string, minLength: 1 }
        nameAr: { type: ["string", "null"] }
        taxNumber: { type: ["string", "null"] }
        crNumber: { type: ["string", "null"] }
        nationalId: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        buildingNumber: { type: ["string", "null"] }
        street: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        additionalNumber: { type: ["string", "null"] }
        province: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        creditLimit:
          type: ["number", "null"]
          minimum: 0
        paymentTermsDays: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        isActive: { type: boolean }

    CreateCustomerInput:
      type: object
