  /approvals/pending:
    get:
      operationId: listPendingApprovals
      tags: [approvals]
      summary: Every document waiting for approval, across all four draftable entities
      description: |
        🔴 UNBOUNDED, DELIBERATELY (owner decision, 2026-09-02). The page this
        replaced fetched the default page (50) of each list and filtered
        client-side, so pending drafts older than the newest 50 documents were
        invisible — "nothing pending" while money waited. The pending set is
        bounded by what approvers have not yet acted on, not by data volume; if
        it is ever large, that is itself the fact the queue exists to show.
        A cap returning through this endpoint would be the same defect wearing
        the fix. Amounts come from the same aggregates the ledger uses (a
        journal entry's from its line sums — never a second computation).
      responses:
        "200":
          description: Pending documents, newest first within each entity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalPendingRow" }

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: A PAGE of invoices, with totals for the whole filtered set
      description: |
        🔴 Offset pagination, and the `totals` are computed in SQL over every
        matching row — never over the page. A page-scoped money total is a
        number nobody asked for, and the alternative to it is not a smaller
        figure but a confidently wrong one (B-6).

        Cursor pagination is the upgrade path if volume ever arrives; offset is
        deliberate while it has not.
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: customer_id, schema: { type: integer } }
        - { in: query, name: date_from, schema: { type: string }, description: Inclusive YYYY-MM-DD lower bound on the invoice date }
        - { in: query, name: date_to, schema: { type: string }, description: Inclusive YYYY-MM-DD upper bound on the invoice date }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page, plus set-wide totals
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invoice" }
                  page:
                    type: object
                    required: [limit, offset, total]
                    properties:
                      limit: { type: integer }
                      offset: { type: integer }
                      total:
                        type: integer
                        description: Rows matching the filter, not rows on this page.
                  totals:
                    type: object
                    required: [outstanding, collected, overdue]
                    properties:
                      outstanding: { type: number }
                      collected: { type: number }
                      overdue: { type: integer }

    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a DRAFT invoice (nothing is issued until approval)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceInput" }
      responses:
        "201":
          description: The draft, with its lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: Body failed validation, or `invoice_has_no_lines` / `note_fields_on_invoice`
        "423":
          description: The date falls in a closed period

  # ── Invoices & bills — detail and write paths, brought into the contract
  #    2026-09-01 (batch 3). Shapes from the presenters; bodies validated in the
  #    controllers with the generated Zod; proven on real rows — INCLUDING the
  #    approval response, whose ICV/hash/QR fields are asserted PRESENT after a
  #    real approval — by tests/document-contract-conformance.test.ts.

  /invoices/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: One invoice with its lines
      responses:
        "200":
          description: The invoice, lines included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404":
          description: Not found
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Edit a DRAFT invoice — header fields and, when given, its whole line set
      description: |
        Drafts only (409 otherwise — an issued invoice is corrected by a credit
        note). When `items` is present it REPLACES the line set and the totals
        are recomputed from the lines, exactly as on create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvoiceInput" }
      responses:
        "200":
          description: The updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: Body failed validation
        "409":
          description: Not a draft
        "423":
          description: The date falls in a closed period
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete a DRAFT invoice
      responses:
        "204":
          description: Deleted
        "409":
          description: Not a draft

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: "D-4 — customer payments, newest first"
      parameters:
        - { in: query, name: customer_id, required: false, schema: { type: integer } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Payments with their allocations and unapplied remainders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerPayment" }
    post:
      operationId: receivePayment
      tags: [payments]
      summary: "D-4 — record a customer receipt: Dr bank / Cr AR for the allocated part, Cr Customer deposits for the rest"
      description: >
        One payment, one journal entry, zero or more allocations. Allocations are
        never inferred: none ⇒ the whole amount is a deposit for the customer;
        some ⇒ the rest is. An allocation beyond an invoice's outstanding
        (total − paid − credited) is refused; the receipt itself is never refused
        for being larger than the invoices — the excess is the customer's
        deposit by the caller's explicit allocation. `idempotencyKey` (unique
        per company) makes a repeated request return the first payment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceivePaymentInput" }
      responses:
        "201":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPayment" }
        "400":
          description: Not a positive amount, or a malformed allocation
        "409":
          description: Allocation beyond an invoice's outstanding; a note or unissued invoice as target; an idempotency key reused for a different payment
        "422":
          description: "`bank_account_required`, `bank_account_inactive`, `reference_not_found`, `allocation_exceeds_payment`, `allocation_party_mismatch`, `customer_required_for_unapplied`"

  /payments/refunds:
    get:
      operationId: listRefunds
      tags: [payments]
      summary: "Phase C — customer refunds, newest first"
      parameters:
        - { in: query, name: customer_id, required: false, schema: { type: integer } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Refunds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerRefund" }
    post:
      operationId: refundCustomer
      tags: [payments]
      summary: "Phase C — refund a customer's deposit (from a named receipt) or credit-note balance (from a named issued note): Dr the origin's liability / Cr bank"
      description: >
        Settles an existing credit; never reverses the receipt or the note. The
        origin is explicit and the source is a specific record. Refused when the
        amount exceeds the source's refundable balance, when the note is not
        issued (no tax effect exists yet), when the source is another
        customer's, or when the bank is missing/inactive/another tenant's. No
        VAT is posted or altered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundCustomerInput" }
      responses:
        "201":
          description: The refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRefund" }
        "400":
          description: Missing reason, non-positive amount, or malformed origin/source
        "409":
          description: "`credit_note_not_issued`; an idempotency key reused for a different refund"
        "422":
          description: "`refund_exceeds_balance`, `refund_source_mismatch`, `reference_not_found`, `bank_account_required`, `bank_account_inactive`"

  /payments/refunds/{id}:
    get:
      operationId: getRefund
      tags: [payments]
      summary: One refund
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRefund" }
        "404":
          description: Not found

  /payments/allocations/{id}:
    get:
      operationId: getAllocation
      tags: [payments]
      summary: "Phase A — one allocation with its correction, if any"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The allocation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentAllocationDetail" }
        "404":
          description: Not found

  /payments/allocations/{id}/unallocate:
    post:
      operationId: unallocate
      tags: [payments]
      summary: "Phase A — correct an allocation with a superseding record: Dr AR / Cr Customer deposits (or credit balances); the original allocation stays visible and untouched"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnallocateInput" }
      responses:
        "200":
          description: The allocation, now reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentAllocationDetail" }
        "400":
          description: Missing reason
        "404":
          description: Not found
        "409":
          description: "`allocation_already_corrected` (one correction per allocation — concurrent attempts get this); `credit_note_original_application_immutable`"
        "422":
          description: "`customer_required_for_unapplied`"
        "423":
          description: "`period_closed` — corrections are dated today; a closed current month refuses"

  /payments/matching:
    get:
      operationId: classifyStatementRows
      tags: [payments]
      summary: "Phase D — classify statement rows against receipts/refunds: MATCHED, DETERMINISTIC, AMBIGUOUS, UNMATCHED, INCONSISTENT. Pure read."
      parameters:
        - { in: query, name: bank_account_id, required: false, schema: { type: integer } }
        - { in: query, name: date_from, required: false, schema: { type: string } }
        - { in: query, name: date_to, required: false, schema: { type: string } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: One classification per statement row
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatementRowClassification" }

  /payments/matching/apply:
    post:
      operationId: applyDeterministicMatches
      tags: [payments]
      summary: "Phase D — record the DETERMINISTIC matches (same bank, direction, exact amount, identifying reference resolving uniquely, date in window, one candidate, one-to-one). Nothing is posted."
      parameters:
        - { in: query, name: bank_account_id, required: false, schema: { type: integer } }
        - { in: query, name: date_from, required: false, schema: { type: string } }
        - { in: query, name: date_to, required: false, schema: { type: string } }
      responses:
        "200":
          description: What was recorded and what remains for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchingApplyResult" }
        "409":
          description: A row or counterpart was matched concurrently — re-run

  /payments/matching/override:
    post:
      operationId: overrideMatch
      tags: [payments]
      summary: "Phase D — the human's match: records actor, reason, the statement row, the counterpart and the evidence (including any amount difference). Bank and direction are identity and cannot be overridden."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchOverrideInput" }
      responses:
        "201":
          description: The match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementMatch" }
        "400":
          description: Missing reason, or not exactly one counterpart
        "409":
          description: The row or the counterpart already has an active match; the row was settled; the receipt was created from another row
        "422":
          description: "`match_bank_mismatch`, `match_direction_mismatch`, `reference_not_found`, `bank_account_required`"

  /payments/matching/{id}:
    get:
      operationId: getMatch
      tags: [payments]
      summary: One match with its reversal, if any
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementMatch" }
        "404":
          description: Not found

  /payments/matching/{id}/unmatch:
    post:
      operationId: unmatch
      tags: [payments]
      summary: "Phase D — supersede a match with a reversal record; the match row stays visible"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnmatchInput" }
      responses:
        "200":
          description: The match, now reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementMatch" }
        "404":
          description: Not found
        "409":
          description: "`match_already_reversed`"

  /payments/deposit-review:
    get:
      operationId: getDepositReview
      tags: [payments]
      summary: "AP-1 — the deposits held, and which of them may owe VAT (a reader; nothing posts)"
      description: >
        Every live receipt received on or before the frame date whose unapplied
        remainder is still positive NOW, with its current classification and a
        server-decided review state. A taxable advance is a VAT tax point at
        receipt (GCC VAT Agreement Art. 23(1)) that requires an advance tax
        invoice by the 15th of the following month (IR Art. 53(1)); the return's
        boxes read documents only, so this list is where an un-invoiced advance
        becomes visible. `needsReview` is a who-finds-out figure, never a box.
        The frame is stated on the response (`asOf`): the remainder is as of
        now, the receipt date is the filter.
      parameters:
        - { in: query, name: period_to, required: false, description: "YYYY-MM — receipts up to the end of that month", schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
        - { in: query, name: as_of, required: false, description: "YYYY-MM-DD — wins over period_to", schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" } }
        - { in: query, name: customer_id, required: false, schema: { type: integer } }
      responses:
        "200":
          description: The review list and its totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositReview" }

  /payments/{id}/classify:
    post:
      operationId: classifyPayment
      tags: [payments]
      summary: "AP-1 — say what a deposit is: advance / erroneous / security_deposit / unknown (a dated record; nothing posts)"
      description: >
        A NEW classification record each time (the receipt is append-only and
        the history stays readable); the newest is current. Informational in
        AP-1: no VAT is posted, altered or decided from it. Refused for a
        receipt with no customer, a migrated opening deposit (its VAT position
        is the migration's record), a reversed opening deposit, or a receipt
        that was fully allocated when recorded (never a deposit).
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassifyPaymentInput" }
      responses:
        "200":
          description: The payment with its current classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPayment" }
        "400":
          description: Not one of the four classifications, or a VAT category outside S / Z / E
        "404":
          description: Not found
        "409":
          description: "`opening_deposit_classified_by_migration`, `opening_item_reversed`, `no_deposit_to_classify`"
        "422":
          description: "`classification_requires_customer`, `vat_category_requires_advance`"

  /payments/{id}/advance-invoices:
    post:
      operationId: createAdvanceInvoice
      tags: [payments]
      summary: "AP-2 — issue a DRAFT advance tax invoice (ZATCA type 386) for part or all of a receipt's deposit classified as an advance"
      description: >
        A tax invoice for consideration RECEIVED before a taxable supply (GCC
        VAT Agreement Art. 23(1); IR Art. 53(1)(a)(2)). Created FROM the
        receipt whose deposit it declares VAT for, never from nothing; the
        amount is VAT-INCLUSIVE and at most the receipt's un-invoiced
        remainder; the line is the split at the deposit's classified VAT
        category (S at the standard rate; Z / E at 0 with an exemption
        reason). A DRAFT — approve it (`POST /invoices/{id}/approve`) to mint
        the ICV, the hash, the QR, the e-invoice and the entry
        `Dr Customer deposits [VAT] / Cr VAT Payable` (accountant A2). The
        accounting date defaults to the receipt date (the tax point) when its
        month is open, else today; never before the receipt, never into a
        closed month. Approver-level.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdvanceInvoiceInput" }
      responses:
        "201":
          description: The draft advance tax invoice (document_type advance_invoice)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: No positive amount
        "404":
          description: Not found
        "409":
          description: "`advance_invoice_requires_advance_classification` (erroneous / security_deposit / unknown — accountant A1), `opening_deposit_not_advance_invoiced` (Z1), `opening_item_reversed`"
        "422":
          description: "`classification_requires_customer`, `advance_vat_category_required`, `advance_exemption_reason_required`, `advance_invoice_exceeds_uninvoiced`, `advance_invoice_before_receipt`, `advance_amount_does_not_split`"
        "423":
          description: The date falls in a closed month

  /payments/{id}/classifications:
    get:
      operationId: listPaymentClassifications
      tags: [payments]
      summary: "AP-1 — every classification a receipt has carried, oldest first"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentClassification" }
        "404":
          description: Not found

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: One payment with its allocations
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPayment" }
        "404":
          description: Not found

  /payments/{id}/allocate:
    post:
      operationId: allocatePayment
      tags: [payments]
      summary: "D-4 — allocate a payment's unapplied remainder to invoices (posts Dr Customer deposits / Cr AR)"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocatePaymentInput" }
      responses:
        "200":
          description: The payment after the allocation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPayment" }
        "404":
          description: Not found
        "409":
          description: Beyond an invoice's outstanding, already allocated to one of these invoices, or not a receipt
        "422":
          description: "`allocation_exceeds_payment`, `allocation_party_mismatch`, `reference_not_found`"

  /payments/credit-notes/{id}/apply:
    post:
      operationId: applyCreditNote
      tags: [payments]
      summary: "D-4 — apply an issued credit note's unconsumed balance to invoices of the same customer (posts Dr Customer credit balances / Cr AR; the note itself is untouched)"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer }, description: "The credit note" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyCreditNoteInput" }
      responses:
        "200":
          description: The note's applications after this one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditNoteApplications" }
        "409":
          description: Not a credit note, not issued, already applied to one of these invoices, or an allocation beyond an invoice's outstanding
        "422":
          description: "`allocation_exceeds_credit`, `allocation_party_mismatch`, `credit_note_no_customer`, `reference_not_found`"

  /payments/credit-notes/{id}/applications:
    get:
      operationId: listCreditNoteApplications
      tags: [payments]
      summary: "D-4 — a credit note's applications and remaining balance"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Applications, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditNoteApplications" }
        "404":
          description: Not a credit note

  # ── Batch 1C — migration of an existing business (2026-09-18) ──────────────
  # Decision record: docs/product/batch-1c-migration-opening-balances-decision-pack.md §15.
  # Admin-only throughout (pack §D-1 §11). A batch is staged, validated,
  # committed in ONE transaction, and immutable afterwards.
  /migration/batches:
    get:
      operationId: listMigrationBatches
      tags: [migration]
      summary: "Batch 1C — this company's migration batches, newest first"
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MigrationBatch" }
    post:
      operationId: createMigrationBatch
      tags: [migration]
      summary: "Batch 1C — start a migration: name the source system and the cutover date; the opening date is DEFINED as cutover − 1"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMigrationBatchInput" }
      responses:
        "201":
          description: The draft batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationBatch" }
        "400":
          description: Malformed date or missing source system
        "409":
          description: "`migration_already_committed` — this company already has a live migration; reverse it first"

  /migration/batches/{id}:
    get:
      operationId: getMigrationBatch
      tags: [migration]
      summary: One batch with its staging counts, validation and reconciliation
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationBatchDetail" }
        "404":
          description: Not found
    patch:
      operationId: updateMigrationBatch
      tags: [migration]
      summary: "Update a draft batch's notes, source version, or the last filed VAT return's closing position (R9). Refused once committed."
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMigrationBatchInput" }
      responses:
        "200":
          description: The batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationBatch" }
        "400":
          description: Malformed VAT position
        "409":
          description: "`migration_batch_immutable`"

  /migration/batches/{id}/discard:
    post:
      operationId: discardMigrationBatch
      tags: [migration]
      summary: "Discard a batch that has not been committed (staging rows are kept for the audit trail; nothing was ever posted)"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The batch, now discarded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationBatch" }
        "409":
          description: "`migration_batch_immutable` — a committed batch cannot be discarded; reverse it"

  /migration/batches/{id}/chart:
    get:
      operationId: getMigrationChart
      tags: [migration]
      summary: "The staged chart rows with their mapping decisions, the deterministic suggestion per row (from the file's role hint only — never a name guess), and the mapping summary"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Chart rows and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationChart" }
    put:
      operationId: importMigrationChart
      tags: [migration]
      summary: "Replace the batch's staged chart with the source system's chart of accounts and closing balances (one row per old account). Refused once the batch is committed."
      description: >
        Every row keeps the old code, name, type, parent and Dr/Cr balance verbatim.
        A row's TYPE must be one of asset / liability / equity / income / expense as
        the file states it — nothing is guessed from a name. Duplicate codes in one
        file are refused. Replacing the chart resets every mapping decision.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportMigrationChartInput" }
      responses:
        "200":
          description: The imported rows and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationChart" }
        "400":
          description: Malformed rows (duplicate code, unknown type, negative balance, non-SAR)
        "409":
          description: "`migration_batch_immutable`"

  /migration/batches/{id}/chart/{rowId}:
    patch:
      operationId: decideMigrationChartRow
      tags: [migration]
      summary: "Record the mapping decision for one old account: map_to_system, map_to_bank, create, merge_into, or skip (zero balance only, reason required)"
      description: >
        Refused: mapping to the non-posting CASH header;
        map_to_bank to a bank that is not this company's or is inactive; merge_into a
        system account or a header; skip with a non-zero balance; a receivable/payable
        role hint mapped anywhere but AR/AP; a group row with its own balance.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: rowId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationChartDecisionInput" }
      responses:
        "200":
          description: The row with its decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationChartRow" }
        "404":
          description: Row not in this batch
        "409":
          description: "`migration_batch_immutable`"
        "422":
          description: "`mapping_target_refused`, `skip_requires_zero_balance`, `reference_not_found`"

  # ── Batch 1C Phase 2 — parties, open items, advances, the opening position, validation ──
  /migration/batches/{id}/parties:
    get:
      operationId: getMigrationParties
      tags: [migration]
      summary: "The staged customers and suppliers with their create / use_existing decisions and the likely duplicates found among existing records"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Parties and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationParties" }
    put:
      operationId: importMigrationParties
      tags: [migration]
      summary: "Replace the batch's staged parties (one row per old customer / supplier, keyed by the old system's id). Refused once committed."
      description: >
        Every party keeps its source id — the identity every open item and
        advance refers to. Import sets `create` where no existing record looks
        like the party; where one does (same VAT number, or the same name) the
        decision is left EMPTY and blocks validation until the operator chooses
        create or use_existing. Replacing the parties resets every decision;
        open items and advances that name a party no longer staged are reported
        as problems, not deleted.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportMigrationPartiesInput" }
      responses:
        "200":
          description: The imported parties and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationParties" }
        "400":
          description: Malformed rows (duplicate source id, unknown party type, blank name)
        "409":
          description: "`migration_batch_immutable`"

  /migration/batches/{id}/parties/{rowId}:
    patch:
      operationId: decideMigrationParty
      tags: [migration]
      summary: "Decide one staged party: create a new record, or use an existing customer / supplier of this organisation"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: rowId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationPartyDecisionInput" }
      responses:
        "200":
          description: The party with its decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationParty" }
        "404":
          description: Row not in this batch
        "409":
          description: "`migration_batch_immutable`"
        "422":
          description: "`reference_not_found` (the existing record is not this organisation's, or is of the other party type), `party_already_used` (another staged party already uses it)"

  /migration/batches/{id}/open-items:
    get:
      operationId: getMigrationOpenItems
      tags: [migration]
      summary: "The staged historical AR / AP open items — the old system's OPEN documents at cut-off, verbatim — with per-party totals"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Open items and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationOpenItems" }
    put:
      operationId: importMigrationOpenItems
      tags: [migration]
      summary: "Replace the batch's staged open items. These are OPENING ITEMS, never tax invoices: no VAT event, no ICV, no hash, no QR, no ZATCA document (accountant decision A1)."
      description: >
        One row per open document of the previous system: its original number,
        issue date, due date, original amount, the amount still outstanding at
        cut-off, and the party's source id. Where the old system tracked only
        a balance for a party, ONE row with `compositionUnknown: true` carries
        that balance — invoice-level history is never fabricated. Historical VAT
        facts (rate, amount, the return period they were reported in) are kept
        as data for reconciliation and for the future Art. 40(10)–(11) engine;
        nothing here posts VAT.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportMigrationOpenItemsInput" }
      responses:
        "200":
          description: The imported items and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationOpenItems" }
        "400":
          description: Malformed rows (duplicate source id, unknown item type, bad dates, outstanding > original, non-positive amounts, non-SAR)
        "409":
          description: "`migration_batch_immutable`"

  /migration/batches/{id}/advances:
    get:
      operationId: getMigrationAdvances
      tags: [migration]
      summary: "The staged customer advances held at cut-off — each becomes a CUSTOMER_DEPOSITS balance carrying its old advance-invoice reference and VAT position"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Advances and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationAdvances" }
    put:
      operationId: importMigrationAdvances
      tags: [migration]
      summary: "Replace the batch's staged customer advances. Migration triggers no VAT: the advance's VAT was accounted for at receipt by the old system (pack §15.2 D)."
      description: >
        `vatPosition: invoiced` requires the old advance tax invoice's number and
        date and the VAT category and rate it was taxed at — a later invoice
        adjusts through PrepaidAmount by reference to them. `unknown` records the
        cash amount only and FAILS CLOSED downstream (no PrepaidAmount is ever
        computed for it until an accountant classifies it). The bank the money
        arrived in is named by the old chart's code: the advance's cash is
        INSIDE that bank's opening balance and posts no cash line of its own.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportMigrationAdvancesInput" }
      responses:
        "200":
          description: The imported advances and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationAdvances" }
        "400":
          description: Malformed rows (duplicate source id, non-positive amount, invoiced without its reference, VAT amount above the advance)
        "409":
          description: "`migration_batch_immutable`"

  /migration/batches/{id}/opening-position:
    get:
      operationId: getMigrationOpeningPosition
      tags: [migration]
      summary: "The opening position the staged content implies, by target account — what the opening journal will post — with the AR / AP / deposit subledgers derived from the items and the control checks between them. Computed; nothing is written."
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The opening position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationOpeningPosition" }

  /migration/batches/{id}/validate:
    post:
      operationId: validateMigrationBatch
      tags: [migration]
      summary: "Run every pre-commit check on the staged content with ZERO ledger writes; store the result and the content hash. All pass → status validated; any failure → the batch stays draft with the failures recorded."
      description: >
        The checks anticipate the reconciliation gates of pack §15.6 on the
        STAGED content (the gates themselves run against the posted journal at
        commit): the chart is fully mapped and balances; AR and AP control
        balances equal the open-item subledgers, per party and in total (R2,
        R3); every bank row lands on a D-3 leaf with statement evidence and
        agrees with the bank's typed opening balance where one was typed (R4);
        the VAT balances equal the last filed return's closing position as
        supplied (R9); customer deposits equal the staged advances and each
        carries its VAT position (R10); every party is decided; no opening item
        collides with an existing document number; the fiscal year is declared
        and the P&L rows are consistent with the cutover's place in it (A2).
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationValidation" }
        "409":
          description: "`migration_batch_immutable`, `migration_batch_discarded`"

  # ── Batch 1C Phase 3 — commit, reversal. (No OBE clearing exists: an unbalanced position is refused — accountant A5, 2026-09-20.) ──
  /migration/batches/{id}/commit:
    post:
      operationId: commitMigrationBatch
      tags: [migration]
      summary: "COMMIT a validated batch in ONE transaction: parties → master data with source identity; created accounts; opening invoices / bills (amount-only, never issued); THE OPENING JOURNAL through the posting seam (dated cutover − 1, source = opening); deposits; bank opening state; the opening month locked; R1–R10 against the posted ledger (all blocking — R6 proves every line lands on a NAMED account; an unbalanced position is refused with `migration_unbalanced`) — any failure rolls everything back. Idempotent: a committed batch returns as it is."
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The committed batch with its reconciliation (R1–R10)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationBatchDetail" }
        "409":
          description: "`migration_not_validated`, `migration_content_changed` (validate again), `migration_validation_failed`, `migration_unbalanced` (the position does not balance on named accounts — classify the difference), `migration_already_committed`, `migration_reconciliation_failed` (nothing committed), `migration_batch_reversed`, `migration_batch_discarded`"
        "422":
          description: "`source_identity_conflict` — an existing record chosen for use_existing already represents another source party"
        "423":
          description: "`period_locked` — the opening month is closed"

  /migration/batches/{id}/reversal-preview:
    get:
      operationId: getMigrationReversalPreview
      tags: [migration]
      summary: "What a reversal would undo, and what BLOCKS it today (a receipt allocated to an opening invoice, a credit note against one, a paid opening bill, a deposit allocated or refunded, a month closed by someone else). Computed; nothing is written."
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationReversalPreview" }
        "409":
          description: "`migration_not_committed`"

  /migration/batches/{id}/reverse:
    post:
      operationId: reverseMigrationBatch
      tags: [migration]
      summary: "REVERSE a committed migration (Policy C, accountant A4): the migration's own lock on the opening month is lifted; the opening journal is mirrored through the posting seam (dated the opening date, source = opening_reversal, reversal_of set) and marked reversed; the opening invoices, bills and deposits are MARKED reversed — never deleted — and every receivable/payable/deposit reader excludes them; banks return to display-only; customers, vendors and created accounts STAY with their source identity. The next batch the company creates is the REPLACEMENT: its items get NEW numbers OPEN-<batch>-<seq> with provenance to the reversed rows. Refused while anything has touched what the commit created."
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseMigrationBatchInput" }
      responses:
        "200":
          description: The reversed batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationReversed" }
        "409":
          description: "`migration_not_committed`"
        "422":
          description: "`migration_reversal_blocked` — the blockers are named; unwind them first, or post dated correction journals instead"

  /migration/open-items/{itemId}/correct:
    post:
      operationId: correctMigratedOpenItem
      tags: [migration]
      summary: "2026-09-22 (accountant answer 5, inside A4): correct a COMMITTED migrated item's amount — 100,000 → 90,000 — with retained earnings on the other side"
      description: >
        The original ledger row STAYS (marked reversed by its own batch, carrying
        the correction entry, frozen); a REPLACEMENT row with a new
        OPEN-<batch>-<seq> number and the corrected amount links back to it;
        ONE entry dated the correction date in an open month — a receivable
        decrease: Dr Retained earnings / Cr AR (customer); an increase the
        reverse; payables mirror. Never an OBE plug, never an edit, never a
        delete. Refused by name when the item has been acted on since the
        migration (opening_item_partly_settled — the accountant's open question,
        Batch 1C pack §16.12.5), when the batch is not committed, when the
        item's migration was reversed, or when the date precedes the opening.
      parameters:
        - { in: path, name: itemId, required: true, schema: { type: integer }, description: "The STAGING row (migration_open_items.id) — the migrated document's identity across corrections." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectMigratedOpenItemInput" }
      responses:
        "200":
          description: The original, the replacement and the entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigratedOpenItemCorrection" }
        "404":
          description: Not found
  /migration/open-items/{itemId}/identity:
    put:
      operationId: recordMigratedOpenItemIdentity
      tags: [migration]
      summary: "2026-09-22 (accountant answer 3): record, ONCE, the previous solution's e-invoicing identity of a migrated receivable the migration did not carry"
      description: >
        cleared / reported (with the previous solution's UUID) or
        pre_einvoicing — the facts a credit note through Fatoora needs to name
        the original. Set once on the live ledger row; a trigger refuses any
        later change (opening_identity_already_recorded). Never guessed.
      parameters:
        - { in: path, name: itemId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordMigratedOpenItemIdentityInput" }
      responses:
        "200":
          description: The identity as recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigratedOpenItemIdentity" }
        "404":
          description: Not found
  /invoices/{id}/bad-debt-relief:
    post:
      operationId: writeOffBadDebt
      tags: [invoices]
      summary: "2026-09-22: write off an issued invoice's unpaid consideration as a bad debt and claim the Art. 40(7) VAT relief"
      description: >
        ONE act, because the relief presupposes the write-off (Art. 40(7)(d)).
        Refused by name unless every condition holds: an issued tax invoice or
        debit note with a customer (bad_debt_not_issued, bad_debt_requires_customer),
        not a migrated opening item (opening_item_relief_is_migration_fact, the
        previous system's fact), not already written off, twelve months since
        the supply (bad_debt_relief_too_early, with the earliest date), a
        certificate reference, and legal-procedure evidence above SAR 100,000
        (bad_debt_legal_procedures_required). Posts, dated claimedOn in an open
        month: Dr Bad debts (net), Dr VAT Payable (the relief) / Cr AR (the
        unpaid consideration); the invoice stays issued with writtenOffAmount
        and badDebtRelief set; the return shows the relief in box 7 for that
        period.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteOffBadDebtInput" }
      responses:
        "200":
          description: The invoice with the relief recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404":
          description: Not found
  /invoices/{id}/bad-debt-recoveries:
    post:
      operationId: createBadDebtRecovery
      tags: [invoices]
      summary: "2026-09-22: the Art. 40(9) document, a DRAFT tax invoice (388) for consideration received on a receivable whose VAT was relieved"
      description: >
        "A new Tax invoice must be issued to reflect the additional amount
        received" (IR Art. 40(9)): a NEW ZATCA document, document_type
        recovery_invoice, dated at the tax point (the receipt's date), its
        supply date (KSA-5) the same, its IssueDate the real issuance; it names
        the receivable it recovers (recoversInvoiceId, also the document's
        billing reference) and the receipt (recoveryPaymentId). A DRAFT:
        approve it to issue it (ICV, hash, QR, e-invoice) and post Dr Bad
        debts / Cr VAT Payable for the VAT payable again, plus, for a
        receivable written off here, the receipt's application (Dr the
        receipt's liability / Cr Bad debts) with an allocation receipt to
        document. A receipt dated into a closed month is refused with the
        Art. 63 explanation (advance_tax_point_period_locked).
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer }, description: "The written-off (or migrated, relief-claimed) receivable." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBadDebtRecoveryInput" }
      responses:
        "201":
          description: The draft recovery invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404":
          description: Not found
  /invoices/{id}/advance-credit-notes:
    post:
      operationId: createAdvanceCreditNote
      tags: [invoices]
      summary: "AP-3 — a DRAFT credit note against an ADVANCE tax invoice (type 386): cancel part or all of an advance before its supply"
      description: >
        The controlled path for an invoiced advance (ordinary credit notes
        against a 386 are refused — 409 note_original_is_advance_invoice). A
        ZATCA 381 whose billing reference is the 386 (BR-KSA-56) with a stated
        reason (BR-KSA-17), for a VAT-inclusive amount at most the 386's OPEN
        balance (issued − applied on final invoices − already credited); its
        line is the 386's category and rate. A DRAFT — approve it
        (`POST /invoices/{noteId}/approve`) to issue it (ICV, hash, QR,
        e-invoice) and post `Dr VAT Payable / Cr Customer deposits` for the
        credited VAT (accountant A2's shape reversed — pack §6 E5). The
        receipt's un-invoiced remainder then RISES by the credited amount,
        which is what unlocks the ordinary deposit refund
        (`POST /payments/refunds`, origin deposit) for exactly that part. The
        386, the receipt and the note are never edited.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer }, description: "The advance tax invoice (386)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdvanceCreditNoteInput" }
      responses:
        "201":
          description: The draft credit note (document_type advance_credit_note, originalInvoiceId = the 386)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: "No positive amount; `note_reason_required`"
        "404":
          description: Not found
        "409":
          description: "`advance_credit_note_original_not_advance`, `note_original_not_issued`, `advance_credit_note_exceeds_open`"
        "422":
          description: "`advance_credit_note_before_advance`, `advance_amount_does_not_split`"
        "423":
          description: The date falls in a closed month

  /invoices/{id}/pay:
    post:
      operationId: payInvoice
      tags: [invoices]
      summary: Record a payment against an issued invoice
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "200":
          description: The invoice after the payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: Not a positive amount
        "409":
          description: Not approved, already paid, or more than the outstanding balance

  /invoices/{id}/payments:
    get:
      operationId: listInvoicePayments
      tags: [invoices]
      summary: The dated payment history (B4) — a `backfilled` row is an aggregate of pre-B4 payments
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Payments, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }

  /invoices/{id}/document:
    get:
      operationId: getInvoiceDocument
      tags: [invoices]
      summary: "L1 — the rendered PDF/A-3 document. lang=ar (default) is THE tax invoice; lang=en is a labelled translation and says so on its face."
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: lang, required: false, schema: { type: string, enum: [ar, en], default: ar } }
      responses:
        "200":
          description: "The PDF (application/pdf, PDF/A-3B; the signed ZATCA XML is attached when the invoice has one)."
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "409":
          description: "Draft/submitted — only an issued document renders (no QR, no legal existence yet)."
        "503":
          description: "pdf_renderer_unavailable — the Chromium executable is missing; the message names the install step."

  /bills/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getBill
      tags: [bills]
      summary: One bill with its lines
      responses:
        "200":
          description: The bill, lines included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "404":
          description: Not found
    patch:
      operationId: updateBill
      tags: [bills]
      summary: Edit a DRAFT bill (header fields)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBillInput" }
      responses:
        "200":
          description: The updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "400":
          description: Body failed validation
        "409":
          description: Not a draft
    delete:
      operationId: deleteBill
      tags: [bills]
      summary: Delete a DRAFT bill
      responses:
        "204":
          description: Deleted
        "409":
          description: Not a draft

  /bills/{id}/post:
    post:
      operationId: postBill
      tags: [bills]
      summary: Approve and post a bill to the GL (alias of approve, carrying the debit account)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillApproveInput" }
      responses:
        "200":
          description: The posted bill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "409":
          description: Already posted, or totals mismatch without `force`
        "423":
          description: The accounting period is locked

  /bills/{id}/pay:
    post:
      operationId: payBill
      tags: [bills]
      summary: Record a payment against a posted bill
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "200":
          description: The bill after the payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "400":
          description: Not a positive amount
        "409":
          description: Not posted, already paid, or more than the outstanding balance

  /bills/{id}/payments:
    get:
      operationId: listBillPayments
      tags: [bills]
      summary: The dated payment history (B4)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Payments, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }

  /invoices/{id}/submit:
    post:
      operationId: submitInvoice
      tags: [invoices]
      summary: Submit a draft invoice into the approval queue
      description: >
        Draft/approval workflow (M10.4). Moves an editable draft invoice to
        `submitted` (awaiting approval); locked to the enterer until approved or
        sent back. Bookkeeper (create-level) action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft invoice can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/send-back:
    post:
      operationId: sendBackInvoice
      tags: [invoices]
      summary: Send a submitted invoice back to the enterer for correction
      description: >
        Draft/approval workflow (M10.4). Returns a `submitted` invoice to `draft`
        with an optional reviewer note. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The invoice, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted invoice can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/approve:
    post:
      operationId: approveInvoice
      tags: [invoices]
      summary: Approve (issue) an invoice — builds the ZATCA hash chain and posts AR
      description: >
        Draft/approval workflow (M10.4). Approving an invoice issues it: it is
        recognized in AR/revenue/VAT, and its ZATCA hash-chain link + QR are
        minted HERE (not at create), so a rejected/deleted draft never consumes a
        sequence number. May be approved straight from draft (self-approve on
        create, done automatically for approvers) or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (issued) invoice, with ZATCA hash + QR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The invoice is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/reject:
    post:
      operationId: rejectInvoice
      tags: [invoices]
      summary: Reject a non-approved invoice (hard-deletes it)
      description: >
        Draft/approval workflow (M10.4). Hard-deletes a draft or submitted invoice
        — no archive. Because a draft carries no hash-chain link, deleting it
        leaves no gap in the sequence. An issued invoice cannot be rejected (it
        must be reversed with a credit note). Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The invoice was rejected and removed
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An issued invoice cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/submit:
    post:
      operationId: submitPayrollRun
      tags: [payroll]
      summary: Submit a draft payroll run into the approval queue
      description: >
        Draft/approval workflow (M10.5). Moves a draft run to `submitted`
        (awaiting approval). Bookkeeper (create-level) action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft run can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/send-back:
    post:
      operationId: sendBackPayrollRun
      tags: [payroll]
      summary: Send a submitted payroll run back to the enterer for correction
      description: >
        Draft/approval workflow (M10.5). Returns a `submitted` run to `draft` with
        an optional reviewer note. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The payroll run, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted run can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/approve:
    post:
      operationId: approvePayrollRun
      tags: [payroll]
      summary: Approve a payroll run (posts the payroll GL entry)
      description: >
        Draft/approval workflow (M10.5). Approving a run posts its GL entry (Dr
        Salaries + Employer GOSI / Cr Net Pay + GOSI Payable) — the only ledger
        effect a run has. May be approved from draft or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (posted) payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The payroll run is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/reject:
    post:
      operationId: rejectPayrollRun
      tags: [payroll]
      summary: Reject a non-approved payroll run (hard-deletes it)
      description: >
        Draft/approval workflow (M10.5). Hard-deletes a draft or submitted run —
        no archive. An approved run cannot be rejected. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The payroll run was rejected and removed
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An approved run cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DiscardResult:
      type: object
      properties:
        status:
          type: string
        imageDeleted:
          type: boolean
          description: >
            False means the bytes are still in storage and the capture's row is
            retained so they remain findable and retryable. Never reported as
            true unless the backend confirmed the deletion.
      required:
        - status
        - imageDeleted

    DeploymentBanner:
      type: object
      description: >
        `demoMode: false` on a normal deployment, and the frontend renders
        nothing. Both languages are returned together because the banner is a
        claim about the DEPLOYMENT, not a UI string — it must read identically
        whichever language the viewer has selected.
      properties:
        demoMode:
          type: boolean
        messageEn:
          type: ["string", "null"]
        messageAr:
          type: ["string", "null"]
        lastResetAt:
          type: ["string", "null"]
          format: date-time
          description: >
            When the weekly wipe last SUCCEEDED. Null means it has not run since
            this deployment started. The banner shows it because "data is wiped
            weekly" is a promise, and an unverifiable promise about data
            deletion is the kind of claim that should not be made at all.
        nextResetAt:
          type: ["string", "null"]
          format: date-time
      required:
        - demoMode

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ZatcaPrerequisite:
      type: object
      required: [key, label, satisfied, hint]
      properties:
        key: { type: string }
        label: { type: string }
        satisfied: { type: boolean }
        hint: { type: string }

    ZatcaOnboardingStatus:
      type: object
      required: [environment, prerequisites, ready, certificate]
      properties:
        environment: { type: string, enum: [sandbox, simulation, production] }
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/ZatcaPrerequisite"
        ready: { type: boolean }
        certificate:
          type: ["object", "null"]
          required: [status, notAfter, daysUntilExpiry, egsSerialNumber]
          properties:
            status: { type: string }
            notAfter: { type: ["string", "null"] }
            daysUntilExpiry: { type: ["integer", "null"] }
            egsSerialNumber: { type: ["string", "null"] }

    ZatcaOnboardInput:
      type: object
      required: [otp]
      properties:
        otp:
          type: string
          description: >-
            One-time password generated by the tenant in the Fatoora portal.
            Used once and never stored. NOTE: the ZATCA sandbox accepts ANY
            value, so a successful sandbox run proves nothing about this path.

    ZatcaComplianceDocumentResult:
      type: object
      required: [label, passed, errors, warnings]
      properties:
        label: { type: string }
        passed: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }

    ZatcaOnboardResult:
      type: object
      required: [complianceDocuments, activated]
      properties:
        complianceDocuments:
          type: array
          items:
            $ref: "#/components/schemas/ZatcaComplianceDocumentResult"
        activated: { type: boolean }

    CompanyLogoState:
      type: object
      required: [hasLogo]
      properties:
        hasLogo:
          type: boolean

    Company:
      type: object
      description: >
        A company's legal identity. `vatNumber` and `name` are the SELLER identity
        stamped onto every issued e-invoice (ZATCA QR tags 1-2 and the invoice
        hash), so they are not cosmetic settings.
      required:
        [
          id,
          name,
          nameAr,
          crNumber,
          vatNumber,
          fiscalYearStart,
          fiscalCalendar,
          ownershipType,
          buildingNumber,
          street,
          district,
          city,
          postalCode,
          hasLogo,
        ]
      properties:
        id:
          type: string
        hasLogo:
          type: boolean
          description: >
            L1 level-1 branding: whether a logo is stored for this company.
            Absent logo = the invoice header carries the registered name alone
            (no fallback mark, by decision — design-invoice-document.md §2).
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        crNumber:
          type: ["string", "null"]
        vatNumber:
          type: ["string", "null"]
        fiscalYearStart:
          type: ["integer", "null"]
          description: >
            Month the fiscal year starts, 1-12 IN `fiscalCalendar` (gregorian
            1 = January; hijri 1 = Muharram — read the two together). 🔴 NULL
            means NOT DECLARED, a first-class state (M20.0): there is no
            default, because the old NOT NULL DEFAULT 1 recorded every
            untouched company as having chosen January. Reports fall back to a
            rolling last-12-months while null, and say so.
          minimum: 1
          maximum: 12
        fiscalCalendar:
          type: string
          enum: [gregorian, hijri]
          description: >
            Which calendar the fiscal year is expressed in (M17.2). `hijri`
            means the Umm al-Qura (Saudi civil) calendar specifically.
        ownershipType:
          type: ["string", "null"]
          enum: [SAUDI_GCC, FOREIGN, MIXED, null]
          description: >
            Ownership structure (M17.1). NULL means NOT DECLARED and is a
            first-class state — there is no default, because defaulting would
            have the platform assert the tenant ownership nobody supplied, and
            that assertion decides whether a Zakat surface is shown. Zakat v1
            covers SAUDI_GCC only; FOREIGN/MIXED are directed to a tax advisor.
        buildingNumber:
          type: ["string", "null"]
        street:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]

    UpdateCompanyInput:
      type: object
      description: >
        Partial update. Any omitted field is left unchanged; send an empty string
        to clear an optional field.
      properties:
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        crNumber:
          type: ["string", "null"]
        vatNumber:
          type: ["string", "null"]
        fiscalYearStart:
          type: ["integer", "null"]
          description: null withdraws the declaration (M20.0).
          minimum: 1
          maximum: 12
        fiscalCalendar:
          type: string
          enum: [gregorian, hijri]
        ownershipType:
          type: ["string", "null"]
          enum: [SAUDI_GCC, FOREIGN, MIXED, null]
        buildingNumber:
          type: ["string", "null"]
        street:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]

    FiscalPeriod:
      type: object
      description: >
        One fiscal year resolved to concrete dates (M17.2). `label` is the year
        the period STARTS in, in the company's own calendar — a display
        convention, not a fact, which is why `startDate`, `endDate` and
        `endYear` are all returned and the UI shows the range beside the label.
      required: [label, endYear, calendar, startDate, endDate, days]
      properties:
        label:
          type: integer
          description: Year the period starts in, in the company's own calendar (AH for hijri).
        endYear:
          type: integer
          description: Year the period ends in — so a consumer may label by either end.
        calendar:
          type: string
          enum: [gregorian, hijri]
        startDate:
          type: string
          description: Inclusive, YYYY-MM-DD (Gregorian, the platform's storage format).
        endDate:
          type: string
          description: Inclusive — the day before the next fiscal year begins.
        days:
          type: integer
          description: >
            Inclusive day count: 365/366 Gregorian, 354/355 Hijri. Computed from
            the real boundaries, never assumed. It is the input to the Gregorian
            Zakat rate adjustment — but the RATE is not computed here, because
            its divisor is unverified (advisor Block C, question C3).

    FiscalYears:
      type: object
      required: [declared, calendar, fiscalYearStart, current, periods]
      properties:
        declared:
          type: boolean
          description: >
            M20.0 — false means the tenant has never said when their fiscal
            year starts. `current` is null and `periods` is empty, so a
            consumer cannot receive a resolved January year that looks like an
            answer nobody gave. Reports use a rolling last-12-months in this
            state, and say so (F11/F13).
        calendar:
          type: string
          enum: [gregorian, hijri]
        fiscalYearStart:
          type: ["integer", "null"]
          minimum: 1
          maximum: 12
        current:
          oneOf:
            - $ref: "#/components/schemas/FiscalPeriod"
            - type: "null"
        periods:
          type: array
          description: A window around the current period, newest first.
          items:
            $ref: "#/components/schemas/FiscalPeriod"

    BudgetLine:
      type: object
      required: [id, period, budgetedAmount, actualAmount, variance, variancePct]
      properties:
        id: { type: integer }
        name: { type: ["string", "null"] }
        nameAr: { type: ["string", "null"] }
        period: { type: string, description: "YYYY — annual only." }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        categoryNameAr: { type: ["string", "null"] }
        categoryType: { type: ["string", "null"] }
        budgetedAmount: { type: number }
        actualAmount:
          type: number
          description: >
            Signed by account type (M19.0). May be NEGATIVE when refunds exceed
            spend — a real state, reported rather than clamped to zero.
        variance: { type: number }
        variancePct: { type: number }

    TrendPoint:
      type: object
      required: [period, currentAssets, quickAssets, currentLiabilities, workingCapital,
                 currentRatio, quickRatio, debtToEquity, netWorth, claimable, blockers]
      properties:
        period: { type: string }
        currentAssets: { type: number }
        quickAssets: { type: number }
        currentLiabilities: { type: number }
        workingCapital: { type: number }
        currentRatio: { type: ["number", "null"] }
        quickRatio: { type: ["number", "null"] }
        debtToEquity: { type: ["number", "null"] }
        netWorth: { type: number }
        claimable:
          type: boolean
          description: >
            False means this point must NOT be drawn as an ordinary segment. The
            line breaks, visibly, rather than running through a month we cannot
            stand behind.
        blockers:
          type: array
          items:
            type: object
            required: [code, amount]
            properties:
              code: { type: string, enum: [suspense_balance, unclassified_accounts, undeclared_transfers] }
              amount: { type: number }
              count: { type: ["integer", "null"] }

    BridgePoint:
      type: object
      required: [period, opening, invoiced, collected, credited, other, closing]
      properties:
        period: { type: string }
        opening: { type: number }
        invoiced:
          type: number
          description: >
            Debits to AR — invoices AND debit notes. A debit note posts like an
            invoice; it does not reverse.
        collected:
          type: number
          description: Credits to AR settled in cash.
        credited:
          type: number
          description: Credits to AR that reversed revenue — credit notes.
        other:
          type: number
          description: >
            Credits to AR that were neither. A write-off or an offset is not a
            payment and not a credit note; reporting it separately is the
            difference between a bridge that understands the movement and one
            that mislabels it. Normally zero.
        closing:
          type: number
          description: Equals the balance-sheet AR figure for the same date.

    CashReconciliation:
      type: object
      required: [from, to, bankMovement, ledgerCash, gap, items, unexplained, undeclaredTransfers, points]
      properties:
        from: { type: string }
        to: { type: string }
        bankMovement:
          type: number
          description: Every accepted transaction, all kinds — what the bank shows.
        ledgerCash:
          type: number
          description: Movement on cash-classified GL accounts — what the books say.
        gap:
          type: number
          description: bankMovement − ledgerCash. Zero when the two stores agree.
        items:
          type: array
          description: >
            Each entry is a NAMED reason the two differ, and they sum to the gap
            exactly. A gap merely displayed is a discrepancy; a gap itemised is
            a reconciliation.
          items:
            type: object
            required: [code, amount]
            properties:
              code:
                type: string
                description: >
                  A — GL owns cash (2026-08-17): transfers now POST, so the
                  three transfer codes are gone. What remains is deliberate
                  (settlements post via the pay path), historical
                  (unposted_legacy — locked-period skips, should stay zero),
                  or ledger-side (document payments with no bank row).
                enum:
                  - settlements
                  - unposted_legacy
                  - ledger_only
              amount: { type: number }
        unexplained:
          type: number
          description: >
            🔴 Must be 0. Non-zero means a difference exists that no named cause
            accounts for — returned rather than asserted so the page can say so
            instead of presenting a reconciliation that does not reconcile.
        undeclaredTransfers:
          type: number
          description: >
            Transfer movement nobody has classified (B5). No longer a GAP
            component — an undeclared transfer posts, into Transfer suspense —
            but still a question only the tenant can answer, surfaced so the
            page can ask for the declaration. The same money the Finance Hub's
            liquidity claim is withheld over.
        points:
          type: array
          items:
            $ref: "#/components/schemas/CashPoint"

    CashPoint:
      type: object
      required: [period, bankMovement, ledgerCash, gap]
      properties:
        period: { type: string }
        bankMovement: { type: number }
        ledgerCash: { type: number }
        gap: { type: number }

    Decomposition:
      type: object
      required: [dimension, current, prior, change, contributors, concentration]
      properties:
        dimension: { type: string, enum: [category, customer, vendor] }
        current:
          type: object
          required: [from, to, total]
          properties:
            from: { type: string }
            to: { type: string }
            total: { type: number }
        prior:
          type: object
          required: [from, to, total]
          properties:
            from: { type: string }
            to: { type: string }
            total: { type: number }
        change: { type: number }
        contributors:
          type: array
          items:
            type: object
            required: [id, name, nameAr, current, prior, change, shareOfChange]
            properties:
              id: { type: string }
              name: { type: string }
              nameAr: { type: string }
              current: { type: number }
              prior: { type: number }
              change: { type: number }
              shareOfChange:
                type: ["number", "null"]
                description: >
                  NULL when the NET change is about zero. Offsetting movements
                  are real, and a share of "nothing changed" is undefined rather
                  than infinite. The movers stay ranked.
        concentration:
          type: ["object", "null"]
          required: [count, share]
          properties:
            count: { type: integer }
            share: { type: number }

    Liquidity:
      type: object
      description: >
        🔴 `claimable` is the field that matters. When false the UI must NOT
        state the plain-language claim ("you can cover your short-term debts
        1.8x over") — the figures are still returned so the breakdown and the
        blocker can be shown, but the CLAIM is withheld. `observations` are
        RULES OF THUMB, never compliance: no severity above "watch" exists.
      required:
        [asOf, currentAssets, quickAssets, currentLiabilities, workingCapital,
         currentRatio, quickRatio, claimable, blockers, observations]
      properties:
        asOf:
          type: string
        currentAssets:
          type: number
        quickAssets:
          type: number
          description: Cash + quick — the acid-test numerator.
        currentLiabilities:
          type: number
        workingCapital:
          type: number
        currentRatio:
          type: ["number", "null"]
          description: NULL when there are no current liabilities — undefined, not zero.
        quickRatio:
          type: ["number", "null"]
        claimable:
          type: boolean
        blockers:
          type: array
          items:
            type: object
            required: [code, amount]
            properties:
              code:
                type: string
                description: >
                  undeclared_transfers (A, 2026-08-17) — money in Transfer
                  suspense: cash whose destination nobody has declared, which
                  is exactly the case the withholding exists for.
                enum: [suspense_balance, unclassified_accounts, undeclared_transfers]
              amount:
                type: number
              count:
                type: ["integer", "null"]
        observations:
          type: array
          items:
            type: object
            required: [code, severity, ratio]
            properties:
              code:
                type: string
              severity:
                type: string
                enum: [watch]
              ratio:
                type: number

    TaxCompliance:
      type: object
      required: [vat, zatca]
      properties:
        vat:
          type: object
          required: [periodFrom, periodTo, periodBasis, filingFrequencyKnown, netVatDue, payable, refund]
          properties:
            periodFrom: { type: string }
            periodTo: { type: string }
            periodBasis:
              type: string
              enum: [calendar_quarter]
            filingFrequencyKnown:
              type: boolean
              description: >
                Always false today. KSA VAT is filed monthly or quarterly by
                turnover and nothing records which applies, so the UI must state
                the period it used rather than imply a filing obligation.
            netVatDue: { type: number }
            payable: { type: number }
            refund: { type: number }
        zatca:
          type: ["object", "null"]
          required: [environment, connected, certificateStatus, daysUntilExpiry]
          properties:
            environment: { type: string }
            connected: { type: boolean }
            certificateStatus: { type: ["string", "null"] }
            daysUntilExpiry: { type: ["integer", "null"] }

    BooksStatus:
      type: object
      required: [unreviewedCount, needsAttentionCount]
      properties:
        unreviewedCount:
          type: integer
        needsAttentionCount:
          type: integer

    PeriodLock:
      type: object
      required: [id, period, lockedAt, lockedBy, notes]
      properties:
        id:
          type: integer
        period:
          type: string
          description: The closed month, `YYYY-MM`.
        lockedAt:
          type: string
        lockedBy:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    PeriodLockInput:
      type: object
      required: [period]
      properties:
        period:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: The month to close, `YYYY-MM` (e.g. 2026-06).
        notes:
          type: ["string", "null"]

    Category:
      type: object
      required: [id, name, nameAr, type, vatApplicable]
      properties:
        id:
          type: integer
        systemCode:
          type: ["string", "null"]
          description: >
            The account's system role (AR, AP, VAT_OUTPUT, …) when it is a
            system account; null for ordinary accounts. Exposed (N3) so the
            manual-JE form can require a party on control-account lines. The
            Categories UI still cannot EDIT system accounts — that trap (§5)
            is about write routes, which do not exist.
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, asset, liability, equity]
        vatApplicable:
          type: boolean
        liquidityClass:
          type: ["string", "null"]
          enum: [cash, quick, current, non_current, null]
          description: >
            M18.1 — where a BALANCE-SHEET account sits on the liquidity scale,
            for the Finance Hub. Current assets are everything but
            `non_current`; quick assets are `cash` + `quick`. NULL on an asset
            or liability means UNCLASSIFIED and is surfaced as such, never
            silently treated as current. Always NULL on income/expense/equity
            accounts, where the distinction is meaningless.
        parentId:
          type: ["integer", "null"]
          description: >
            D-3: the header this account sits under. Only bank GL leaves carry
            one today (their parent is "Cash and Bank"); every other account
            is null. Not a general chart hierarchy.
        bankAccountId:
          type: ["integer", "null"]
          description: >
            D-3: set on a bank's own GL cash account — the explicit,
            rename-proof relationship to the application bank account.
        isPosting:
          type: boolean
          description: >
            D-3: false on a HEADER account ("Cash and Bank"), which accepts no
            postings — a cash line names a bank account and posts to that
            bank's leaf. Pickers exclude non-posting accounts.
        description:
          type: ["string", "null"]

    CategoryInput:
      type: object
      required: [name, nameAr, type, vatApplicable]
      properties:
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, asset, liability, equity]
        vatApplicable:
          type: boolean
        liquidityClass:
          type: ["string", "null"]
          enum: [cash, quick, current, non_current, null]
          description: >
            Only meaningful when `type` is `asset` or `liability`; the server
            rejects it on any other account type (and a DB CHECK backs that up).
        description:
          type: ["string", "null"]

    Transaction:
      type: object
      required:
        - id
        - date
        - description
        - amount
        - currency
        - type
        - isManuallyOverridden
        - createdAt
      properties:
        id:
          type: integer
        date:
          type: string
        description:
          type: string
        descriptionAr:
          type: ["string", "null"]
        amount:
          type: number
        currency:
          type: string
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        categoryNameAr:
          type: ["string", "null"]
        vatAmount:
          type: ["number", "null"]
        vatRate:
          type: ["number", "null"]
        confidenceScore:
          type: ["number", "null"]
        isManuallyOverridden:
          type: boolean
        source:
          type: ["string", "null"]
        reviewStatus:
          type: string
          enum: [pending_review, accepted]
        kind:
          description: |
            M16.2 — operating (real income/expense; the only kind tax figures
            read), transfer (money between the business's own pockets), or
            settlement (M16.3: settles an existing invoice/bill).
          type: string
          enum: [operating, transfer, settlement]
        taxTreatment:
          description: "VAT treatment: S/Z/E/O; null = unknown (and only unknown)."
          type: ["string", "null"]
          enum: [S, Z, E, O, null]
        vatBasis:
          description: |
            Flaw #6 — whether VAT was actually CHARGED on this payment, which
            is a different fact from what the supply IS (taxTreatment).
            `reverse_charge`: a foreign supplier charges no KSA VAT and the
            buyer self-accounts. `supplier_unregistered`: a supplier below the
            VAT threshold charges none. VAT is extracted only when
            taxTreatment='S' AND vatBasis='charged'.
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        bankAccountId:
          type: ["integer", "null"]
        transferDirection:
          description: |
            B5 — where a transfer went: `own_account`, `external`, or `null` for
            NOT DECLARED. Null is a real state, not a default: only the person
            who entered the row knows, and the cash reconciliation reports
            undeclared transfers as unknown rather than assuming either way.
          type: ["string", "null"]
          enum: [own_account, external, null]
        counterpartyBankAccountId:
          type: ["integer", "null"]
        settlesInvoiceId:
          description: "M16.3: the invoice this credit settled (kind=settlement)."
          type: ["integer", "null"]
        settlesBillId:
          description: "M16.3: the bill this debit paid (kind=settlement)."
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PendingReviewCounts:
      type: object
      required: [total, needsAttention, ready]
      properties:
        total:
          type: integer
          description: Every row awaiting review, counted in SQL over the whole set.
        needsAttention:
          type: integer
          description: Rows a human must look at (uncategorised non-transfer, or low confidence and not manually overridden).
        ready:
          type: integer
          description: |
            `total - needsAttention` — exactly the set bulk accept will act on
            and POST to the ledger. Computed server-side so no client can derive
            it from a page.

    PendingReviewTransaction:
      type: object
      required: [id, date, description, amount, type, needsAttention, kind]
      properties:
        id: { type: integer }
        date: { type: string }
        description: { type: string }
        descriptionAr: { type: ["string", "null"] }
        amount: { type: number }
        type: { type: string, enum: [debit, credit] }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        confidenceScore: { type: ["number", "null"] }
        vatAmount: { type: ["number", "null"] }
        kind: { type: string, enum: [operating, transfer, settlement] }
        taxTreatment: { type: ["string", "null"], enum: [S, Z, E, O, null] }
        vatBasis:
          description: "Flaw #6 — whether VAT was actually charged (see Transaction.vatBasis)."
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        treatmentAssumed:
          description: |
            M16.3.1 — true when the row's treatment came from a category
            default that has NOT been verified against KSA VAT rules (only
            BANK_CHARGES and INSURANCE have been — queue C9 tracks the rest).
            The UI shows these as "assumed" with an override; a user must
            never read a confident 'S' off a guess.
          type: boolean
        needsAttention:
          description: |
            True for rows a human MUST look at (uncategorized non-transfer, or
            low-confidence). The server enforces this: bulk accept never takes
            a needsAttention row — accepting one requires naming its id.
          type: boolean
        suggestion:
          description: |
            M16.3 — an exact-match settlement SUGGESTION, never an action. The
            UI pre-selects it; only POST /transactions/{id}/settle applies it,
            and only when a human clicks. Null when no unambiguous match
            exists (unmatched rows stay plain transactions).
          oneOf:
            - $ref: "#/components/schemas/SettlementSuggestion"
            - type: "null"

    SettlementSuggestion:
      type: object
      required: [documentKind, documentId, documentNumber, outstanding, matchedBy, partial]
      properties:
        documentKind:
          type: string
          enum: [invoice, bill]
        documentId: { type: integer }
        documentNumber: { type: string }
        counterpartyName: { type: ["string", "null"] }
        outstanding:
          description: The document's outstanding balance (total - paid).
          type: number
        matchedBy:
          description: |
            "number" — the document number appears in the bank-line description;
            "amount" — the amount equals exactly ONE open document's outstanding
            balance. v1 is exact-match only (design Q3a).
          type: string
          enum: [number, amount]
        partial:
          description: |
            True when the amount is LESS than the outstanding balance and the
            description references the document number (Q3b: description-
            referenced partials suggested; amount-only partials never).
          type: boolean

    SettleTransactionInput:
      type: object
      description: Exactly one of invoiceId / billId must be set.
      properties:
        invoiceId:
          type: ["integer", "null"]
        billId:
          type: ["integer", "null"]

    AcceptPendingInput:
      type: object
      properties:
        ids:
          type: ["array", "null"]
          items: { type: integer }

    # 2026-09-16: acceptance and posting are ONE act, and the response says
    # which rows it happened to. `accepted` counts rows that accepted AND
    # posted; `rejected` names rows the period lock refused — put back to
    # review, no entry. Before this, a refused row committed as accepted and
    # the request said 200 with a list nothing read (findings file, "BULK
    # ACCEPT INTO A CLOSED MONTH").
    AcceptPendingResult:
      type: object
      required: [accepted, posted, rejected]
      properties:
        accepted: { type: integer }
        posted: { type: integer }
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/AcceptPendingRejection"

    AcceptPendingRejection:
      type: object
      required: [id, date, reason, code, period, lockedAt]
      properties:
        id: { type: integer }
        date: { type: ["string", "null"] }
        reason: { type: string }
        code: { type: string, enum: [period_closed, bank_account_required] }
        period: { type: ["string", "null"], description: "YYYY-MM — the closed month" }
        lockedAt: { type: ["string", "null"], description: "YYYY-MM-DD — when it was closed" }

    TransactionList:
      type: object
      required: [transactions, total, offset, limit]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    # M15: real constraints. `date: string` / `amount: number` accepted
    # date="banana" and amount=-431.25, leaving Postgres as the only guard —
    # the client-side parser was the sole real validation, which a direct API
    # call bypasses entirely.
    TransactionInput:
      type: object
      required: [date, description, amount, currency, type]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        description:
          type: string
          minLength: 1
          maxLength: 500
        descriptionAr:
          type: ["string", "null"]
          maxLength: 500
        amount:
          # Positive by contract: direction lives in `type`, not in the sign.
          # Signed bank exports are normalised CLIENT-side (statementParser)
          # before they reach this schema.
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999
        currency:
          type: string
          minLength: 3
          maxLength: 3
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: ["integer", "null"]
        vatAmount:
          type: ["number", "null"]
          minimum: 0
        vatRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        notes:
          type: ["string", "null"]
          maxLength: 1000
        source:
          type: ["string", "null"]
        bankAccountId:
          description: >
            D-3: the bank account this movement belongs to. REQUIRED on
            `POST /transactions` (a single manual row is accepted and posted on
            creation, and its cash leg posts to this bank's GL account — a row
            without one is refused with 422 `bank_account_required`). Ignored
            on upload rows, where the statement's `bankAccountId` applies.
          type: ["integer", "null"]

    TransactionUpdate:
      type: object
      properties:
        categoryId:
          type: ["integer", "null"]
        bankAccountId:
          description: >
            D-3: record WHICH bank account the row belongs to. Settable only
            while the row has none (a bank is a fact about the movement, not a
            classification to revise); a posted row whose history still sits
            on the "Cash and Bank" header is left for the cut-over to remap,
            a row already posted to a bank's GL account is reversed and
            re-posted to the named bank.
          type: integer
        # Same bounds as TransactionCreate — the two paths must not disagree
        # about the invariant (audit 2026-08-20, MED). The invariant itself
        # lives in a DB CHECK (migration 0056); these bounds are the contract
        # stating it to clients.
        vatAmount:
          type: ["number", "null"]
          minimum: 0
        vatRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        taxTreatment:
          description: |
            M16.3.1 — per-row VAT-treatment override (the export-sale case, or
            correcting an assumed default). Setting a non-'S' value clears the
            row's VAT (Z/E/O rows carry zero VAT and say why); setting 'S' on a
            row with no VAT extracts it from the gross amount at 15%. null
            returns the row to honest-unknown.
          type: ["string", "null"]
          enum: [S, Z, E, O, null]
        vatBasis:
          description: |
            Flaw #6 — the human's answer to "did this payment actually carry
            VAT?". Anything other than `charged` clears the row's VAT; setting
            `charged` on a standard-rated row re-extracts it from the gross.
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        transferDirection:
          description: |
            B5 — where a transfer went. `own_account` = between accounts of this
            business (business cash unchanged, so the ledger is right to be
            silent); `external` = it left the business (cash fell, and the
            ledger is understating it). `null` means NOT DECLARED — never
            "external". Only a transfer may carry it.
          type: ["string", "null"]
          enum: [own_account, external, null]
        counterpartyBankAccountId:
          description: |
            The destination account, when it is one this product tracks.
            Optional even for `own_account` — the other account may not be in
            the system, and requiring it would block the tenant from declaring
            the fact that matters.
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]

    TransactionUpload:
      type: object
      required: [rows, bankAccountId]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TransactionInput"
        autoCategrize:
          type: ["boolean", "null"]
        bankAccountId:
          description: |
            M16.2 — which bank account this statement belongs to. Scopes
            duplicate detection to the account and is the foundation for
            transfer-leg pairing. Validated against the tenant's own accounts.
            🔴 REQUIRED since D-3 (2026-09-16): an accepted row's cash leg
            posts to this bank's own GL account, and a row with no bank cannot
            be accepted. A missing id is a 422 `bank_account_required`.
          type: integer

    UploadResult:
      type: object
      required: [inserted, categorized, errors]
      properties:
        inserted:
          type: integer
        categorized:
          type: integer
        # M15: rows skipped because an IDENTICAL row (date+description+amount+
        # type) already exists — re-uploading a statement must not double every
        # tax figure. Reported, never silent.
        duplicatesSkipped:
          type: integer
        # 🔴 Audit finding #10: the COUNT alone conflated two different events —
        # "you re-uploaded a statement" (housekeeping) and "your business
        # genuinely paid the same amount twice today" (lost money, invisible).
        # The skipped rows are returned so the second case can be seen and
        # re-entered.
        duplicates:
          type: array
          items:
            type: object
            required: [date, description, amount]
            properties:
              date: { type: string }
              description: { type: string }
              amount: { type: number }
        errors:
          type: array
          items:
            type: string

    CategorizationRequest:
      type: object
      properties:
        transactionIds:
          type: ["array", "null"]
          items:
            type: integer
        overrideExisting:
          type: ["boolean", "null"]

    CategorizationResult:
      type: object
      required: [processed, categorized, skipped]
      properties:
        processed:
          type: integer
        categorized:
          type: integer
        skipped:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/CategorizationResultItem"

    CategorizationResultItem:
      type: object
      required: [transactionId, categoryId, categoryName, confidence]
      properties:
        transactionId:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
        confidence:
          type: number
        matchedRule:
          type: ["string", "null"]

    FinancialSummary:
      type: object
      required:
        - totalIncome
        - totalExpenses
        - netPosition
        - totalVatCollected
        - totalVatPaid
        - netVat
        - transactionCount
        - uncategorizedCount
      properties:
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netPosition:
          type: number
        totalVatCollected:
          type: number
        totalVatPaid:
          type: number
        netVat:
          type: number
        transactionCount:
          type: integer
        uncategorizedCount:
          type: integer

    VatReturn:
      type: object
      required:
        [period, depositReview, salesSection, purchasesSection, netVatDue, vatPayable, vatRefund, invoiceCount, billCount]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string }
            to: { type: string }
        depositReview:
          type: object
          description: "AP-1 — deposits held at the end of the window that may carry VAT the boxes do not show (the list: GET /payments/deposit-review). A who-finds-out figure beside the return, never a box."
          required: [asOf, needsReviewCount, needsReviewAmount, overdueCount]
          properties:
            asOf: { type: string }
            needsReviewCount: { type: integer }
            needsReviewAmount: { type: number }
            overdueCount: { type: integer }
        salesSection:
          $ref: "#/components/schemas/VatReturnSalesSection"
        purchasesSection:
          $ref: "#/components/schemas/VatReturnPurchasesSection"
        netVatDue:
          type: number
        vatPayable:
          type: number
        vatRefund:
          type: number
        invoiceCount:
          type: integer
        billCount:
          type: integer

    VatReturnSalesSection:
      type: object
      required:
        [
          box1_standardRatedDomesticSales,
          box2_zeroRatedDomesticSales,
          box3_exemptSales,
          box4_exportSales,
          box5_totalSales,
          box6_vatOnStandardRatedSales,
          box7_vatAdjustments,
          box8_totalOutputVat,
        ]
      properties:
        box1_standardRatedDomesticSales: { type: number }
        box2_zeroRatedDomesticSales: { type: number }
        box3_exemptSales: { type: number }
        box4_exportSales: { type: number }
        box5_totalSales: { type: number }
        box6_vatOnStandardRatedSales: { type: number }
        box7_vatAdjustments:
          type: number
          description: 2026-09-22 — the output-VAT adjustments of the period. Today the bad-debt reliefs (IR Art. 40(7)) claimed in the period, as a NEGATIVE figure; box 8 = box 6 + box 7.
        box8_totalOutputVat: { type: number }
        badDebtReliefs:
          type: array
          description: The Art. 40(7) reliefs claimed in this period (the components of box 7), one per written-off invoice.
          items:
            $ref: "#/components/schemas/VatReturnBadDebtRelief"

    VatReturnBadDebtRelief:
      type: object
      required: [invoiceId, invoiceNumber, claimedOn, writtenOffAmount, reliefVat]
      properties:
        invoiceId: { type: integer }
        invoiceNumber: { type: string }
        claimedOn: { type: string, format: date }
        writtenOffAmount: { type: number }
        reliefVat: { type: number }

    VatReturnPurchasesSection:
      type: object
      required:
        [
          box9_standardRatedPurchases,
          box10_zeroRatedPurchases,
          box11_exemptPurchases,
          box12_totalPurchases,
          box13_recoverableInputVat,
          box14_inputVatAdjustments,
          box15_totalInputVat,
        ]
      properties:
        box9_standardRatedPurchases: { type: number }
        box10_zeroRatedPurchases: { type: number }
        box11_exemptPurchases: { type: number }
        box12_totalPurchases: { type: number }
        box13_recoverableInputVat: { type: number }
        box14_inputVatAdjustments: { type: number }
        box15_totalInputVat: { type: number }

    VatSummary:
      type: object
      required: [vatCollected, vatPaid, vatBlocked, netVatPosition, vatRate, transactions]
      properties:
        vatCollected:
          type: number
        vatPaid:
          type: number
          description: >
            The recoverable-input-VAT ESTIMATE. Excludes VAT paid on Art.
            50-blocked expenditure classes (entertainment, catering) — that
            amount is `vatBlocked`, not silently dropped (C9).
        vatBlocked:
          type: number
          description: >
            VAT actually paid on expenditure whose input VAT is not
            deductible (VAT Implementing Regulations Art. 50 — e.g. catering,
            entertainment). A real cost, never a recoverable amount.
        netVatPosition:
          type: number
        vatRate:
          type: number
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/VatTransaction"

    VatTransaction:
      type: object
      required: [id, date, description, amount, vatAmount, type]
      properties:
        id:
          type: integer
        date:
          type: string
        description:
          type: string
        amount:
          type: number
        vatAmount:
          type: number
        type:
          type: string

    CategoryBreakdown:
      type: object
      required: [categoryId, categoryName, categoryNameAr, type, total, count, vatTotal]
      properties:
        categoryId:
          type: integer
        categoryName:
          type: string
        categoryNameAr:
          type: string
        type:
          type: string
        total:
          type: number
        count:
          type: integer
        vatTotal:
          type: number

    JournalEntryLine:
      type: object
      required: [id, journalEntryId, accountName, debitAmount, creditAmount]
      properties:
        id:
          type: integer
        journalEntryId:
          type: integer
        accountId:
          type: ["integer", "null"]
        accountName:
          type: string
        description:
          type: ["string", "null"]
        debitAmount:
          type: number
        creditAmount:
          type: number
        partyType:
          type: ["string", "null"]
          enum: [customer, vendor, null]
          description: N3 — who this control-account line is with; null on non-AR/AP lines and on pre-N3 rows.
        customerId:
          type: ["integer", "null"]
        vendorId:
          type: ["integer", "null"]

    JournalEntry:
      type: object
      required:
        - id
        - entryNumber
        - date
        - description
        - status
        - createdAt
        - totalDebit
        - totalCredit
        - lines
      properties:
        id:
          type: integer
        entryNumber:
          type: string
        date:
          type: string
        description:
          type: string
        reference:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, posted, reversed]
        reversalOf:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        postedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        totalDebit:
          type: number
        totalCredit:
          type: number
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntryLine"

    BillItem:
      type: object
      required: [id, billId, description, quantity, unitPrice, vatAmount, total]
      properties:
        id:
          type: integer
        billId:
          type: integer
        productId:
          type: ["integer", "null"]
        description:
          type: string
        descriptionAr:
          type: ["string", "null"]
        quantity:
          type: number
        unitPrice:
          type: number
        vatRate:
          type: number
        vatAmount:
          type: number
        total:
          type: number

    Bill:
      type: object
      required:
        - id
        - billNumber
        - date
        - status
        - subtotal
        - vatAmount
        - total
        - paidAmount
        - createdAt
        - items
      properties:
        id:
          type: integer
        billNumber:
          type: string
        isOpening: { type: boolean, description: "Batch 1C: an opening payable migrated at cut-off (see Invoice.isOpening)." }
        reversedAt: { type: ["string", "null"], description: "Policy C: set when the migration that created this opening item was reversed (see Invoice.reversedAt)." }
        reversedByMigrationBatchId: { type: ["integer", "null"] }
        replacesBillId: { type: ["integer", "null"], description: "Policy C: the reversed opening bill this replacement item stands in for (provenance)." }
        vendorReference:
          type: ["string", "null"]
        date:
          type: string
        dueDate:
          type: ["string", "null"]
        vendorId:
          type: ["integer", "null"]
        vendorName:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, submitted, received, approved, paid, overdue]
        subtotal:
          type: number
        vatAmount:
          type: number
        total:
          type: number
        currency:
          type: ["string", "null"]
        paidAmount:
          type: number
        paidAt:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
        expenseAccountId:
          type: ["integer", "null"]
          description: The expense account chosen at entry; the account the bill posts to on approval when the approve/post body names none.
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BillItem"

    BillApproveInput:
      type: object
      description: >
        Optional post options when approving a bill. The expense account is
        resolved BY ID from the tenant's own chart; a supplied id or name that
        resolves to nothing is refused (422 `expense_account_unresolved`) —
        never silently posted elsewhere. With neither supplied, the line posts
        to the PURCHASES system account under that account's real name.
      properties:
        debitAccountId:
          type: ["integer", "null"]
          description: >
            The id of an EXPENSE account in this tenant's chart of accounts
            (GET /categories, type = expense). The line is stored under that
            account's name.
        debitAccount:
          type: ["string", "null"]
          description: >
            Legacy — an account NAME, matched case-insensitively against the
            tenant's chart. Refused if it matches nothing. Prefer
            `debitAccountId`.
        force:
          type: ["boolean", "null"]
          description: Override totals-mismatch and invalid-VAT-number rejections.
        captureId:
          type: ["string", "null"]
          description: >
            A1 — the staged captured document this bill was posted from. Links
            the bill to its source photograph atomically with the posting; the
            promotion job then moves the bytes into the immutable archive.

    QuotationItem:
      type: object
      required: [id, description, quantity, unitPrice]
      properties:
        id: { type: integer }
        productId: { type: integer, nullable: true }
        description: { type: string }
        descriptionAr: { type: ["string", "null"] }
        quantity: { type: number }
        unitPrice:
          type: number
          description: >
            The QUOTED price. Conversion copies this value and never re-reads
            the product's current price.
        vatRate: { type: number }
        vatAmount: { type: number }
        discount: { type: number }
        total: { type: number }
        taxCategoryCode:
          type: string
          nullable: true
          description: >
            S/Z/E/O. NULL for a 0% line - zero-rated, exempt and out-of-scope
            are different tax facts an amount cannot distinguish. A quotation
            never fails closed on this; the tax gate is at invoice creation.
        unitCode: { type: string }
        convertedQuantity:
          type: number
          description: How much of this line has become an invoice (M21.2).
        remainingQuantity: { type: number }

    Quotation:
      type: object
      required: [id, quotationNumber, date, validUntil, customerId, customerName, status, outcome, conversionState, expired, subtotal, vatAmount, discount, total, currency, notes, termsAndConditions, reviewNote, createdAt]
      properties:
        id: { type: integer }
        quotationNumber: { type: string }
        date: { type: string }
        validUntil: { type: string, nullable: true }
        customerId: { type: integer, nullable: true }
        customerName: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, submitted, approved]
          description: The APPROVAL axis only.
        outcome:
          type: string
          nullable: true
          enum: [declined, closed]
          description: >
            A terminal act by the TENANT. NULL means live, and NULL is a
            first-class state - the platform never decides a remainder is dead.
        conversionState:
          type: string
          enum: [open, partially_converted, converted]
          description: >
            DERIVED from line quantities, never stored. Kept separate from
            status because a quotation can be approved AND partly converted at
            the same time.
        expired:
          type: boolean
          description: >
            validUntil has passed. A fact to warn on, NOT a block - a customer
            accepting a lapsed quotation is a commercial decision.
        subtotal: { type: number }
        vatAmount: { type: number }
        discount: { type: number }
        total: { type: number }
        currency: { type: string }
        notes: { type: string, nullable: true }
        termsAndConditions: { type: string, nullable: true }
        reviewNote: { type: string, nullable: true }
        createdAt: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotationItem"

    CreateQuotationInput:
      type: object
      required: [items]
      properties:
        date: { type: string }
        validUntil: { type: string }
        customerId: { type: integer }
        currency: { type: string }
        discount: { type: number }
        notes: { type: string }
        termsAndConditions: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuotationLineInput"

    UpdateQuotationInput:
      type: object
      properties:
        date: { type: string }
        validUntil: { type: string }
        customerId: { type: integer }
        currency: { type: string }
        discount: { type: number }
        notes: { type: string }
        termsAndConditions: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotationLineInput"

    ConvertQuotationLine:
      type: object
      required: [quotationItemId, quantity]
      properties:
        quotationItemId: { type: integer }
        quantity:
          type: number
          description: Must be greater than zero and at most what remains.

    ConvertQuotationInput:
      type: object
      properties:
        lines:
          type: array
          description: >
            Omit entirely to convert everything still outstanding. Supplying an
            empty array is an error rather than a no-op.
          items:
            $ref: "#/components/schemas/ConvertQuotationLine"
        date:
          type: string
          description: The accounting date of the invoice built. Defaults to today.
        dueDate: { type: string }
        convertedOn:
          type: string
          description: The date the customer ACCEPTED, which may precede the invoice date. Defaults to the invoice date.
        invoiceNumber:
          type: string
          description: Optional override; otherwise allocated server-side.
        notes: { type: string }

    QuotationConversion:
      type: object
      properties:
        id: { type: integer }
        convertedOn: { type: string }
        invoiceId: { type: integer }
        invoiceNumber: { type: string, nullable: true }
        invoiceStatus: { type: string, nullable: true }
        invoiceTotal: { type: number, nullable: true }

    QuotationConversionResult:
      type: object
      properties:
        conversion:
          type: object
          properties:
            id: { type: integer }
            convertedOn: { type: string }
        invoice:
          $ref: "#/components/schemas/Invoice"

    PurchaseOrderPriceVariance:
      type: object
      description: >
        One event where the supplier's price differed from the ordered price.
        Reported as a neutral fact with BOTH figures - never as a status
        colour, because whether a variance is acceptable is a judgment.
      properties:
        orderedUnitPrice: { type: number }
        billedUnitPrice: { type: number }
        quantity: { type: number }
        billedOn: { type: string }
        difference:
          type: number
          description: billed minus ordered, per unit. Positive = charged more.

    PurchaseOrderItem:
      type: object
      required: [id, description, quantity, unitPrice]
      properties:
        id: { type: integer }
        productId: { type: integer, nullable: true }
        description: { type: string }
        descriptionAr: { type: ["string", "null"] }
        quantity: { type: number }
        unitPrice:
          type: number
          description: >
            The price we ORDERED at. Unlike a quotation, this does not bind the
            supplier - their bill may say something else, and that difference
            is recorded rather than refused.
        vatRate: { type: number }
        vatAmount: { type: number }
        total: { type: number }
        unitCode: { type: string }
        billedQuantity:
          type: number
          description: >
            How much of this line the supplier has BILLED. NOT how much
            arrived - there is no goods-receipt concept.
        unbilledQuantity:
          type: number
          description: quantity minus billedQuantity. Un-billed, not "outstanding".
        priceVariances:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderPriceVariance"

    PurchaseOrder:
      type: object
      required: [id, orderNumber, date, validUntil, vendorId, vendorName, status, outcome, billingState, expired, subtotal, vatAmount, total, currency, notes, reviewNote, createdAt]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        date: { type: string }
        validUntil: { type: string, nullable: true }
        vendorId: { type: integer, nullable: true }
        vendorName: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, submitted, approved]
          description: The APPROVAL axis only.
        outcome:
          type: string
          nullable: true
          enum: [cancelled, closed]
          description: >
            A terminal act by the TENANT. `cancelled` (we withdrew it), never
            "declined" - we cannot know whether a supplier refused. NULL means
            live, and NULL is a first-class state.
        billingState:
          type: string
          enum: [open, partially_billed, fully_billed]
          description: >
            DERIVED from line quantities, never stored. BILLING, not delivery.
        expired: { type: boolean }
        subtotal: { type: number }
        vatAmount: { type: number }
        total: { type: number }
        currency: { type: string }
        notes: { type: string, nullable: true }
        reviewNote: { type: string, nullable: true }
        createdAt: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"

    CreatePurchaseOrderInput:
      type: object
      required: [items]
      properties:
        date: { type: string }
        validUntil: { type: string }
        vendorId: { type: integer }
        currency: { type: string }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseOrderLineInput"

    ConvertPurchaseOrderLine:
      type: object
      required: [purchaseOrderItemId, quantity]
      properties:
        purchaseOrderItemId: { type: integer }
        quantity: { type: number }
        unitPrice:
          type: number
          description: >
            What the supplier ACTUALLY charged. Omit to accept the ordered
            price. A different figure is not an error.

    UnorderedBillLine:
      type: object
      required: [description, quantity, unitPrice]
      description: >
        A line on the supplier's bill that was never on the order - freight, a
        surcharge, a substituted part. Allowed, and identifiable afterwards
        because it has no conversion row against any order line.
      properties:
        description: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        vatRate: { type: number }

    ConvertPurchaseOrderInput:
      type: object
      properties:
        lines:
          type: array
          description: Omit entirely to bill everything not yet billed.
          items:
            $ref: "#/components/schemas/ConvertPurchaseOrderLine"
        unorderedLines:
          type: array
          items:
            $ref: "#/components/schemas/UnorderedBillLine"
        date: { type: string }
        dueDate: { type: string }
        vendorReference:
          type: string
          description: The supplier's own bill number. Wins over an allocated one.
        billNumber: { type: string }
        notes: { type: string }
        allowOverBilling:
          type: boolean
          description: >
            Record a bill for MORE than the order allows. Refused by default -
            that is the case where the supplier may be wrong and a human should
            look - but possible, because refusing outright would mean refusing
            to record a real liability.

    PurchaseOrderConversion:
      type: object
      properties:
        id: { type: integer }
        billedOn: { type: string }
        billId: { type: integer }
        billNumber: { type: string, nullable: true }
        billStatus: { type: string, nullable: true }
        billTotal: { type: number, nullable: true }

    PurchaseOrderConversionResult:
      type: object
      properties:
        conversion:
          type: object
          properties:
            id: { type: integer }
            billedOn: { type: string }
        bill:
          $ref: "#/components/schemas/Bill"

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        userId: { type: integer, nullable: true }
        actorName:
          type: string
          nullable: true
          description: >
            Resolved through the identity layer, scoped to THIS org's
            memberships - a userId with no membership here stays null (the UI
            shows "User #id"), never a name from another tenant.
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        beforeState: { nullable: true }
        afterState: { nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string }

    AuditLogPage:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"

    Finding:
      type: object
      required: [id, kind, refKey, facts, status, firstSeenAt, lastSeenAt]
      properties:
        id: { type: integer }
        companyId: { type: ["string", "null"] }
        kind:
          type: string
          description: >
            duplicate_bill | duplicate_transaction | invoice_number_gap |
            overdue_receivable | overdue_payable | stale_draft |
            undeclared_transfer | unposted_transaction. Free-form by design -
            the vocabulary is service-owned and grows with the checks.
        refKey: { type: string }
        facts:
          type: object
          additionalProperties: true
          description: Per-kind numbers and names the UI renders. No severity anywhere - a finding is a kind plus facts, rendered in words.
        status: { type: string, enum: [open, acknowledged, resolved] }
        firstSeenAt: { type: string }
        lastSeenAt: { type: string }
        acknowledgedAt: { type: ["string", "null"] }
        acknowledgedBy: { type: ["integer", "null"] }
        acknowledgedByName: { type: ["string", "null"] }
        resolvedAt: { type: ["string", "null"] }
        explanation:
          type: ["object", "null"]
          description: >
            AI-3b - model phrasing OF the facts, verified to introduce
            nothing the facts do not carry, returned only while current
            against the facts. NULL is the deterministic floor (model
            unavailable, output rejected, low-context refusal, or facts
            refreshed since generation).
          properties:
            en: { type: string }
            ar: { type: string }
            generatedAt: { type: string }

    FindingsPage:
      type: object
      required: [findings, counts]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        counts:
          type: object
          required: [open, acknowledged, resolved]
          properties:
            open: { type: integer }
            acknowledged: { type: integer }
            resolved: { type: integer }

    AskInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }

    AskResult:
      type: object
      required: [refused, refusalReason, toolUsed, answer]
      properties:
        refused: { type: boolean }
        refusalReason: { type: ["string", "null"] }
        toolUsed: { type: ["string", "null"] }
        answer:
          type: ["object", "null"]
          properties:
            en: { type: string }
            ar: { type: string }

    GroundedAnswersPage:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [id, question, refused, createdAt]
            properties:
              id: { type: integer }
              question: { type: string }
              toolUsed: { type: ["string", "null"] }
              answer:
                type: ["object", "null"]
                properties:
                  en: { type: string }
                  ar: { type: string }
              refused: { type: boolean }
              refusalReason: { type: ["string", "null"] }
              createdAt: { type: string }

    FindingsScheduleInput:
      type: object
      required: [cadence]
      properties:
        cadence: { type: string, enum: [quarterly, monthly] }

    FindingsStatus:
      type: object
      required: [cadence, lastScheduledRun, escalated]
      properties:
        cadence: { type: string, enum: [quarterly, monthly] }
        lastScheduledRun:
          type: ["object", "null"]
          properties:
            periodKey: { type: ["string", "null"] }
            ranAt: { type: string }
            openAfter: { type: integer }
            emailedAt: { type: ["string", "null"] }
            emailedCount: { type: ["integer", "null"] }
            viewedAt: { type: ["string", "null"] }
        escalated:
          type: boolean
          description: >
            True when the last scheduled run has open findings nobody viewed
            for longer than the escalation interval. Renders as the
            persistent Dashboard marker; opening the Findings page is the
            dismissal.

    FindingsRunResult:
      type: object
      required: [created, reopened, refreshed, resolved, open]
      properties:
        created: { type: integer }
        reopened: { type: integer }
        refreshed: { type: integer }
        resolved: { type: integer }
        open: { type: integer, description: Total open after the run. }

    RecurringRule:
      type: object
      required: [id, entity, frequency, dayOfMonth, startsOn, nextRunOn, status, autoIssue]
      properties:
        id: { type: string }
        entity: { type: string, enum: [invoice, bill] }
        template:
          type: ["object", "null"]
          additionalProperties: true
        frequency: { type: string, enum: [monthly, quarterly, yearly] }
        dayOfMonth: { type: integer }
        startsOn: { type: string }
        endsOn: { type: ["string", "null"] }
        nextRunOn: { type: string }
        autoIssue: { type: boolean }
        status: { type: string, enum: [active, paused] }
        createdAt: { type: ["string", "null"] }
        # ── Rule health (A3 follow-up, 2026-08-23) ──────────────────────────
        # One failure and a streak are different signals: one failed run is a
        # blip; N consecutive means a customer has not been billed for N
        # periods and nobody noticed. The list carries both so the UI can say
        # which — "last run: failed" alone hides the answer.
        lastOutcome: { type: ["string", "null"], description: "generated | failed | null (never run)" }
        lastScheduledFor: { type: ["string", "null"] }
        lastErrorCode: { type: ["string", "null"] }
        lastErrorDetail: { type: ["string", "null"] }
        consecutiveFailures: { type: integer }
        lastSuccessOn: { type: ["string", "null"] }

    CreateRecurringRuleInput:
      type: object
      required: [entity, template, frequency, dayOfMonth, startsOn]
      properties:
        entity: { type: string, enum: [invoice, bill] }
        template:
          type: object
          additionalProperties: true
          description: The document body this rule repeats (an invoice/bill create payload).
        frequency: { type: string, enum: [monthly, quarterly, yearly] }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        startsOn: { type: string }
        endsOn: { type: ["string", "null"] }
        autoIssue:
          type: ["boolean", "null"]
          description: v1 refuses true — a rule creates drafts only.

    RecurringRun:
      type: object
      required: [id, scheduledFor, outcome]
      properties:
        id: { type: string }
        scheduledFor: { type: string }
        outcome:
          description: "generated (a draft exists) | failed. Failure detail in errorCode."
          type: string
        documentId: { type: ["integer", "null"] }
        errorCode: { type: ["string", "null"] }
        errorDetail: { type: ["string", "null"] }
        ranAt: { type: ["string", "null"] }

    CaptureUpload:
      # `format: binary` deliberately omitted: the generated zod package is
      # Node-side (no File/Blob types). Fields: document (the image file,
      # required), source (qr|ocr|manual), qrPayload (base64 TLV), extraction +
      # fieldSources (JSON-encoded strings). The UI sends FormData via
      # apiFetch, not a generated hook.
      type: object
      additionalProperties: true

    CaptureResult:
      type: object
      required: [captureId, signatureStatus]
      properties:
        captureId: { type: string }
        signatureStatus:
          description: "ZATCA QR signature verdict: verified | failed | unsigned | not_applicable."
          type: string
        signatureDetail: { type: ["string", "null"] }
        signatureFailed: { type: boolean }

    CapturedDocument:
      type: object
      required: [id, status, source]
      properties:
        id: { type: string }
        status: { type: string }
        source: { type: string, enum: [qr, ocr, manual] }
        extraction:
          description: The parsed fields as uploaded — the review page resumes from this.
          type: ["object", "null"]
          additionalProperties: true
        fieldSources:
          type: ["object", "null"]
          additionalProperties: true
        signatureStatus: { type: ["string", "null"] }

    SendBackInput:
      type: object
      description: Optional reviewer note when sending a submitted record back.
      properties:
        note:
          type: ["string", "null"]

    InvoiceItem:
      type: object
      required: [id, invoiceId, description, quantity, unitPrice, vatAmount, total]
      properties:
        id:
          type: integer
        invoiceId:
          type: integer
        productId:
          type: ["integer", "null"]
        description:
          type: string
        descriptionAr:
          type: ["string", "null"]
        quantity:
          type: number
        unitPrice:
          type: number
        vatRate:
          type: number
        vatAmount:
          type: number
        discount:
          type: number
        total:
          type: number

    Invoice:
      type: object
      required: [id, invoiceNumber, date, dueDate, customerId, customerName, status, subtotal, vatAmount, discount, total, currency, paidAmount, creditedAmount, paidAt, reviewNote, notes, invoiceHash, previousHash, qrCode, documentType, originalInvoiceId, noteReason, icv, zatcaUuid, advancePaymentId, prepayments, prepaidAmount, amountDue, writtenOffAmount, badDebtRelief, recoversInvoiceId, recoveryPaymentId]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        isOpening: { type: boolean, description: "Batch 1C: an opening receivable migrated at cut-off (amount-only; no VAT, ICV, hash or QR). Its number is the previous system's for a first migration, or OPEN-<batch>-<seq> for a replacement." }
        reversedAt: { type: ["string", "null"], description: "Policy C: set when the migration that created this opening item was reversed. The row is history — frozen, excluded from every receivable figure and from the live list, readable by id. NULL otherwise." }
        reversedByMigrationBatchId: { type: ["integer", "null"] }
        replacesInvoiceId: { type: ["integer", "null"], description: "Policy C: the reversed opening invoice this replacement item stands in for (provenance)." }
        date:
          type: string
        dueDate:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, submitted, sent, paid, overdue, cancelled]
        subtotal:
          type: number
        vatAmount:
          type: number
        discount:
          type: number
        total:
          type: number
        currency:
          type: ["string", "null"]
        paidAmount:
          type: number
        creditedAmount:
          type: number
          description: "D-4 — the part settled by credit notes (Σ credit-note allocations to this invoice). Outstanding = total − paidAmount − creditedAmount."
        paidAt:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        invoiceHash:
          type: ["string", "null"]
          description: ZATCA hash-chain link; null until the invoice is approved.
        previousHash:
          type: ["string", "null"]
        qrCode:
          type: ["string", "null"]
          description: ZATCA Phase-1 QR (base64 TLV); null until approved.
        documentType:
          type: string
          enum: [invoice, credit_note, debit_note, advance_invoice, advance_credit_note, recovery_invoice]
          description: "invoice (388) | credit_note (381) | debit_note (383) | advance_invoice (386, AP-2 — the advance tax invoice for a deposit; NOT a receivable) | advance_credit_note (381, AP-3 — the credit note against a 386; returns the advance's VAT to the deposit, is never a credit balance) | recovery_invoice (388, 2026-09-22 — the Art. 40(9) tax invoice for consideration received after bad-debt relief; NOT a receivable) — amounts are stored POSITIVE; direction lives here (documentSign)."
        originalInvoiceId:
          type: ["integer", "null"]
          description: For a credit/debit note, the invoice it adjusts.
        noteReason:
          type: ["string", "null"]
        icv:
          type: ["integer", "null"]
          description: ZATCA invoice counter value; null until approved.
        zatcaUuid:
          type: ["string", "null"]
        advancePaymentId:
          type: ["integer", "null"]
          description: "AP-2: on an advance tax invoice, the receipt (payment id) whose deposit it declares VAT for; null otherwise."
        openingEinvoicingStatus: { type: ["string", "null"], enum: [cleared, reported, pre_einvoicing, null], description: "2026-09-22, opening items only: the previous solution's e-invoicing status of the document; null = not stated (a credit note against it is refused until recorded)." }
        openingSourceUuid: { type: ["string", "null"], description: "2026-09-22, opening items only: the previous solution's document UUID." }
        openingCorrectionJournalEntryId: { type: ["integer", "null"], description: "2026-09-22: on a reversed ORIGINAL corrected item-by-item (A4 + answer 5), the correction entry whose other side is retained earnings." }
        writtenOffAmount:
          type: number
          description: "2026-09-22: the unpaid consideration written off as a bad debt (Art. 40(7)(d)); every outstanding figure subtracts it. 0 when none."
        badDebtRelief:
          description: "2026-09-22: the Art. 40(7) relief on this invoice as a STRUCTURED fact — null when none. source recorded = written off here (its own entry, in this platform's return, box 7); migrated = claimed in the previous system (Batch 1C), the item open at its outstanding amount here."
          oneOf:
            - { $ref: "#/components/schemas/BadDebtRelief" }
            - { type: "null" }
        recoversInvoiceId:
          type: ["integer", "null"]
          description: "On a recovery_invoice: the receivable it recovers (Art. 40(9)); null otherwise."
        recoveryPaymentId:
          type: ["integer", "null"]
          description: "On a recovery_invoice: the receipt whose money it declares; its date is the document's date (the tax point) and supply date."
        prepayments:
          type: array
          description: "AP-2: the advance tax invoices this FINAL invoice adjusts (XML Standard ¶9.5 — one row per 386; allocationId set once issued). Empty on a note, an advance invoice, or an invoice adjusting nothing."
          items: { $ref: "#/components/schemas/InvoicePrepayment" }
        prepaidAmount:
          type: number
          description: "BT-113 — Σ prepayments.amount (VAT inclusive). Computed from adjusted advance tax invoices only, never from paidAmount."
        amountDue:
          type: number
          description: "total − prepaidAmount: what the customer still owes at issue (BT-115). The outstanding after cash is total − paidAmount − creditedAmount as before (the folded advance sits in paidAmount once issued)."
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"

    InvoicePrepayment:
      type: object
      description: "AP-2 — one advance tax invoice (386) adjusted on a final invoice: the VAT-inclusive amount and its KSA-31…34 split copied from the 386."
      required: [id, advanceInvoiceId, advanceInvoiceNumber, advanceInvoiceDate, amount, taxableAmount, taxAmount, taxCategoryCode, vatRate, allocationId]
      properties:
        id: { type: integer }
        advanceInvoiceId: { type: integer }
        advanceInvoiceNumber: { type: string }
        advanceInvoiceDate: { type: string }
        amount: { type: number, description: "VAT inclusive — the part of the 386 this invoice adjusts." }
        taxableAmount: { type: number, description: "KSA-31." }
        taxAmount: { type: number, description: "KSA-32." }
        taxCategoryCode: { type: string, enum: [S, Z, E], description: "KSA-33." }
        vatRate: { type: number, description: "KSA-34 — the advance invoice's rate." }
        allocationId: { type: ["integer", "null"], description: "The receipt → invoice allocation folded into the issue entry; null while a draft." }

    PrepaymentInput:
      type: object
      required: [advanceInvoiceId]
      properties:
        advanceInvoiceId: { type: integer, description: "An ISSUED advance tax invoice of this customer with an open balance." }
        amount: { type: ["number", "null"], minimum: 0, description: "VAT-inclusive part to adjust; omitted or null = the whole open balance. Σ over the invoice ≤ its total (over-advance default: limit to the invoice — Guideline §8(g))." }

    BadDebtRelief:
      type: object
      required: [claimedOn, vatAmount, returnPeriod, certificateRef, legalRef, source, journalEntryId]
      properties:
        claimedOn: { type: ["string", "null"], description: "YYYY-MM-DD. The date the Art. 40(7) conditions were met; the return period the relief belongs to. Null on a migrated relief whose date the previous system did not record." }
        vatAmount: { type: ["number", "null"], description: "The Output Tax relieved (the VAT share of the unpaid consideration). Null on a migrated relief whose amount was not recorded." }
        returnPeriod: { type: ["string", "null"], description: "YYYY-MM of the return the relief was (or is to be) claimed in." }
        certificateRef: { type: ["string", "null"], description: "The certified accountant's write-off certificate (Art. 40(7)(d))." }
        legalRef: { type: ["string", "null"], description: "Evidence of legal procedures when the unpaid amount exceeds SAR 100,000 (Art. 40(7)(e))." }
        source: { type: string, enum: [recorded, migrated] }
        journalEntryId: { type: ["integer", "null"], description: "The write-off entry (recorded only)." }

    WriteOffBadDebtInput:
      type: object
      required: [certificateRef]
      properties:
        claimedOn: { type: ["string", "null"], description: "YYYY-MM-DD. Default today. At least twelve months after the supply (Art. 40(7)(c)); an open month." }
        certificateRef: { type: string, minLength: 1, maxLength: 200, description: "The certified accountant's certificate that the unpaid consideration is written off (Art. 40(7)(d))." }
        legalRef: { type: ["string", "null"], maxLength: 500, description: "Required above SAR 100,000 unpaid (Art. 40(7)(e))." }
        returnPeriod: { type: ["string", "null"], description: "YYYY-MM; default claimedOn's month." }
        note: { type: ["string", "null"], maxLength: 500 }
        idempotencyKey: { type: ["string", "null"], maxLength: 120 }

    CreateBadDebtRecoveryInput:
      type: object
      required: [paymentId, amount]
      properties:
        paymentId: { type: integer, description: "The receipt whose money recovers the written-off receivable. Its date is the document's date and supply date (the tax point: the period in which the payment occurs, Art. 40(9))." }
        amount: { type: number, minimum: 0, description: "VAT inclusive; at most the receipt's unapplied balance and the amount written off and not yet declared (recorded), or the receipt's allocation to the item not yet declared (migrated)." }
        vatRate: { type: ["number", "null"], minimum: 0, maximum: 100, description: "Only for a MIGRATED opening item whose migration recorded no rate: the rate the original tax invoice carried (5 before 1 July 2020, 15 after). Never defaulted; a receivable issued here states its own rate." }
        notes: { type: ["string", "null"] }
        idempotencyKey: { type: ["string", "null"], maxLength: 120 }

    CreateAdvanceCreditNoteInput:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: number, minimum: 0, description: "VAT inclusive; at most the 386's open balance." }
        reason: { type: string, minLength: 1, maxLength: 500, description: "Why the advance is cancelled (KSA-10, BR-KSA-17)." }
        date: { type: ["string", "null"], description: "Accounting date (YYYY-MM-DD). Default today; never before the 386." }
        notes: { type: ["string", "null"] }
        idempotencyKey: { type: ["string", "null"], maxLength: 120 }

    CreateAdvanceInvoiceInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 0, description: "VAT inclusive; at most the receipt's un-invoiced remainder." }
        date: { type: ["string", "null"], description: "2026-09-22: IGNORED unless equal to the receipt date. An advance tax invoice is dated at its TAX POINT, the receipt date, always (accountant 1(a)); a locked receipt month is refused (423 advance_tax_point_period_locked, naming the Art. 63 remedy). Its IssueDate is the issuance instant, recorded separately." }
        description: { type: ["string", "null"], maxLength: 500 }
        descriptionAr: { type: ["string", "null"], maxLength: 500 }
        taxExemptionReasonCode: { type: ["string", "null"], description: "Required (code or text) when the deposit's VAT category is Z or E." }
        taxExemptionReasonText: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        idempotencyKey: { type: ["string", "null"], maxLength: 120 }

    OpenAdvanceInvoice:
      type: object
      description: "AP-2 — an issued advance tax invoice with a balance a final invoice may still adjust."
      required: [id, invoiceNumber, date, issuedAt, paymentId, receiptDate, total, subtotal, vatAmount, adjustedAmount, creditedAmount, openAmount]
      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        date: { type: string }
        issuedAt: { type: ["string", "null"] }
        paymentId: { type: integer }
        receiptDate: { type: string }
        total: { type: number, description: "VAT inclusive." }
        subtotal: { type: number }
        vatAmount: { type: number }
        adjustedAmount: { type: number, description: "Σ adjusted by issued final invoices." }
        creditedAmount: { type: number, description: "AP-3 — Σ issued credit notes against it." }
        openAmount: { type: number, description: "total − adjustedAmount − creditedAmount." }

    ReceiptAdvanceInvoice:
      type: object
      description: "AP-2 — an advance tax invoice (any status) issued from a receipt, as the receipt card lists it, with its credit notes (AP-3) beneath."
      required: [id, invoiceNumber, status, date, total, subtotal, vatAmount, vatCategory, adjustedAmount, creditedAmount, openAmount, creditNotes]
      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        status: { type: string }
        date: { type: string }
        total: { type: number }
        subtotal: { type: number }
        vatAmount: { type: number }
        vatCategory: { type: ["string", "null"] }
        adjustedAmount: { type: number }
        creditedAmount: { type: number, description: "AP-3 — Σ issued credit notes against this advance." }
        openAmount: { type: number, description: "0 while a draft; total − adjusted − credited once issued." }
        creditNotes:
          type: array
          items: { $ref: "#/components/schemas/AdvanceCreditNoteSummary" }

    AdvanceCreditNoteSummary:
      type: object
      description: "AP-3 — a credit note (any status) against an advance tax invoice: the provenance chain receipt → 386 → note → refund."
      required: [id, invoiceNumber, status, date, total, vatAmount, noteReason]
      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        status: { type: string }
        date: { type: string }
        total: { type: number }
        vatAmount: { type: number }
        noteReason: { type: ["string", "null"] }

    PayrollRun:
      type: object
      required: [id, period, status, totalBasicSalary, totalAllowances, totalGosiEmployee, totalGosiEmployer, totalDeductions, totalNetPay, processedAt, reviewNote, notes, createdAt]
      properties:
        id:
          type: integer
        period:
          type: string
        status:
          type: string
          enum: [draft, submitted, approved, paid]
        totalBasicSalary:
          type: number
        totalAllowances:
          type: number
        totalGosiEmployee:
          type: number
        totalGosiEmployer:
          type: number
        totalDeductions:
          type: number
        totalNetPay:
          type: number
        processedAt:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Report schemas (2026-09-01) — shaped from reports.service.ts, verified
    #    against real rows by tests/report-contract-conformance.test.ts ────────

    TrialBalanceRow:
      type: object
      required: [name, nameAr, accountId, type, debit, credit, balance]
      properties:
        name: { type: string }
        nameAr: { type: string }
        accountId: { type: ["integer", "null"] }
        type: { type: string }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number }

    TrialBalanceReport:
      type: object
      required: [accounts, totalDebit, totalCredit, balanced]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/TrialBalanceRow" }
        totalDebit: { type: number }
        totalCredit: { type: number }
        balanced: { type: boolean }

    ReportKeyedAmount:
      description: A named amount keyed by account id where one exists — the key is what period comparisons join on.
      type: object
      required: [key, name, nameAr, amount]
      properties:
        key: { type: string }
        name: { type: string }
        nameAr: { type: string }
        amount: { type: number }

    IncomeStatementReport:
      type: object
      required: [revenue, expenses, totalRevenue, totalExpenses, grossProfit, netIncome, netIncomeMargin, source]
      properties:
        revenue:
          type: array
          items: { $ref: "#/components/schemas/ReportKeyedAmount" }
        expenses:
          type: array
          items: { $ref: "#/components/schemas/ReportKeyedAmount" }
        totalRevenue: { type: number }
        totalExpenses: { type: number }
        grossProfit: { type: number }
        netIncome: { type: number }
        netIncomeMargin: { type: number }
        source:
          type: string
          enum: [journal_entries, transactions]

    BalanceSheetItem:
      type: object
      required: [key, name, nameAr, amount, liquidityClass]
      properties:
        key: { type: string }
        name: { type: string }
        nameAr: { type: string }
        amount: { type: number }
        liquidityClass: { type: ["string", "null"] }

    BalanceSheetBucket:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BalanceSheetItem" }
        total: { type: number }

    BalanceSheetReport:
      type: object
      required: [asOf, assets, liabilities, equity, totalLiabilitiesAndEquity, balanced, warning]
      properties:
        asOf: { type: string }
        assets:
          type: object
          required: [items, accountsReceivable, total, current, nonCurrent, unclassified, quickTotal, suspenseBalance, transferSuspenseBalance]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/BalanceSheetItem" }
            accountsReceivable: { type: number }
            total: { type: number }
            current: { $ref: "#/components/schemas/BalanceSheetBucket" }
            nonCurrent: { $ref: "#/components/schemas/BalanceSheetBucket" }
            unclassified: { $ref: "#/components/schemas/BalanceSheetBucket" }
            quickTotal: { type: number }
            suspenseBalance: { type: number }
            transferSuspenseBalance: { type: number }
        liabilities:
          type: object
          required: [items, accountsPayable, total, current, nonCurrent, unclassified]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/BalanceSheetItem" }
            accountsPayable: { type: number }
            total: { type: number }
            current: { $ref: "#/components/schemas/BalanceSheetBucket" }
            nonCurrent: { $ref: "#/components/schemas/BalanceSheetBucket" }
            unclassified: { $ref: "#/components/schemas/BalanceSheetBucket" }
        equity:
          type: object
          required: [items, retainedEarnings, total]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ReportKeyedAmount" }
