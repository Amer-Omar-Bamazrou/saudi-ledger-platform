        name: { type: string, minLength: 1 }
        nameAr: { type: ["string", "null"] }
        taxNumber: { type: ["string", "null"] }
        crNumber: { type: ["string", "null"] }
        nationalId: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
