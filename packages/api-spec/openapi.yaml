  # ── Journal entries, payroll, employees, assets — brought into the contract
  #    2026-09-01 (batch 4). Shapes from the presenters; proven on real rows by
  #    tests/ledger-contract-conformance.test.ts.

  /journal-entries:
    get:
      operationId: listJournalEntries
      tags: [journal-entries]
      summary: A PAGE of journal entries with each entry's own debit/credit totals
      description: |
        Each row carries ITS OWN `totalDebit`/`totalCredit`, aggregated from its
        lines. There is deliberately no set-wide money total: an entry's debits
        equal its credits, so a cross-entry sum is a number with no meaning.
        List rows carry `lines: []`; fetch `/journal-entries/{id}` for lines.
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JournalEntry" }
                  page: { $ref: "#/components/schemas/PageInfo" }
    post:
      operationId: createJournalEntry
      tags: [journal-entries]
      summary: Create a DRAFT journal entry — lines must balance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateJournalEntryInput" }
      responses:
        "201":
          description: The draft, with its lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "400":
          description: Body failed validation, or the lines do not balance
        "423":
          description: The date falls in a closed period

  /journal-entries/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getJournalEntry
      tags: [journal-entries]
      summary: One journal entry with its lines
      responses:
        "200":
          description: The entry, lines included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "404":
          description: Not found
    delete:
      operationId: deleteJournalEntry
      tags: [journal-entries]
      summary: Delete a DRAFT journal entry
      responses:
        "204":
          description: Deleted
        "409":
          description: Not a draft

  /journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [journal-entries]
      summary: Post a draft to the GL (alias of approve)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The posted entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "409":
          description: Already posted
        "423":
          description: The accounting period is locked

  /journal-entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags: [journal-entries]
      summary: Reverse a posted entry with a mirror entry in the current open period
      description: The original keeps `status = reversed` and STAYS IN THE BOOKS (§4); the mirror is a new posted entry.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The reversal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryReversal" }
        "409":
          description: Not posted, or already reversed

  /payroll:
    get:
      operationId: listPayrollRuns
      tags: [payroll]
      summary: Every payroll run, newest first, with its employee count and gross
      responses:
        "200":
          description: All runs (not paged)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PayrollRunListItem" }
    post:
      operationId: createPayrollRun
      tags: [payroll]
      summary: Create a DRAFT run for a period from every active employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePayrollRunInput" }
      responses:
        "201":
          description: The draft run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollRun" }
        "400":
          description: Body failed validation, or no active employees

  /payroll/{id}:
    get:
      operationId: getPayrollRun
      tags: [payroll]
      summary: One run with its per-employee items
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The run, items included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollRunDetail" }
        "404":
          description: Not found

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: A PAGE of employees with derived gross and GOSI, plus set-wide totals
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: department, schema: { type: string } }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page, plus totals over every matching employee
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Employee" }
                  page: { $ref: "#/components/schemas/PageInfo" }
                  totals: { $ref: "#/components/schemas/EmployeeTotals" }
    post:
      operationId: createEmployee
      tags: [employees]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEmployeeInput" }
      responses:
        "201":
          description: The employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "400":
          description: Body failed validation

  /employees/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getEmployee
      tags: [employees]
      responses:
        "200":
          description: The employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEmployeeInput" }
      responses:
        "200":
          description: The employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "400":
          description: Body failed validation
    delete:
      operationId: deleteEmployee
      tags: [employees]
      responses:
        "204":
          description: Deleted

  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: A PAGE of fixed assets with derived depreciation figures, plus set-wide totals
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page, plus totals over every asset
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AssetListItem" }
                  page: { $ref: "#/components/schemas/PageInfo" }
                  totals: { $ref: "#/components/schemas/AssetTotals" }
    post:
      operationId: createAsset
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssetInput" }
      responses:
        "201":
          description: The asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400":
          description: Body failed validation

  /assets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getAsset
      tags: [assets]
      summary: One asset with its depreciation history
      responses:
        "200":
          description: The asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "404":
          description: Not found

  /assets/{id}/depreciate:
    post:
      operationId: depreciateAsset
      tags: [assets]
      summary: Record one month of straight-line depreciation
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepreciateInput" }
      responses:
        "200":
          description: The depreciation entry recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepreciationEntry" }
        "400":
          description: Not active, or fully depreciated

  /journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [journal_entries]
      summary: Approve a draft journal entry (posts it to the general ledger)
      description: >
        Draft/approval workflow (M10.2). Approving a draft (pending) journal
        entry fires its activation path — the period-lock check and the
        post-to-GL transition — so it becomes active in the ledger. Only an
        approver (admin/accountant) may call this; a bookkeeper is denied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (posted) journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The journal entry is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /journal-entries/{id}/reject:
    post:
      operationId: rejectJournalEntry
      tags: [journal_entries]
      summary: Reject a pending draft journal entry (hard-deletes it)
      description: >
        Draft/approval workflow (M10.2). Rejecting a pending draft hard-deletes
        it — there is no archive of rejected drafts. Only a pending draft can be
        rejected; a posted/reversed entry must be reversed instead. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The draft was rejected and removed
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a pending draft can be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/submit:
    post:
      operationId: submitBill
      tags: [bills]
      summary: Submit a draft bill into the approval queue
      description: >
        Draft/approval workflow (M10.3). Moves an editable draft bill to
        `submitted` (awaiting approval); the bill is locked to the enterer until
        approved or sent back. This is the bookkeeper's own action (create-level
        authorization), not an approver action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft bill can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/send-back:
    post:
      operationId: sendBackBill
      tags: [bills]
      summary: Send a submitted bill back to the enterer for correction
      description: >
        Draft/approval workflow (M10.3). Returns a `submitted` bill to `draft`
        with an optional reviewer note (shown to the enterer while editing). The
        enterer corrects and resubmits. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The bill, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted bill can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [bills]
      summary: Approve a bill (posts it to the general ledger)
      description: >
        Draft/approval workflow (M10.3). Approving a bill fires its activation:
        totals reconciliation, ZATCA vendor-VAT validation (both overridable with
        `force`), the period-lock check, and the Dr Purchases/Input VAT / Cr
        Accounts Payable posting. Only then does the bill affect AP/expense/VAT.
        May be approved straight from draft (self-approve) or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillApproveInput"
      responses:
        "200":
          description: The approved (posted) bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Business-rule rejection (zero total, totals mismatch, invalid VAT number)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The bill is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/reject:
    post:
      operationId: rejectBill
      tags: [bills]
      summary: Reject a non-approved bill (hard-deletes it)
      description: >
        Draft/approval workflow (M10.3). Hard-deletes a draft or submitted bill —
        no archive of rejected records. An approved bill cannot be rejected (it
        must be reversed). Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The bill was rejected and removed
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An approved bill cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Customers & vendors — brought into the contract 2026-09-01 (batch 2) ────
  # Shapes are written from customers.service.ts / vendors.service.ts, verified
  # on real rows by tests/party-contract-conformance.test.ts. Bodies are
  # validated in the controllers with the generated Zod schemas, so a declared
  # constraint here is an enforced one.

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: A PAGE of customers, each with its receivable balance, plus set-wide totals
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: is_active, schema: { type: boolean } }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page, plus totals over every matching customer (never over the page)
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items:
                    type: array
