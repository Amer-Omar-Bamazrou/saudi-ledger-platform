      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        customerName: { type: string }
        customerNameAr: { type: string }
        dueDate: { type: ["string", "null"] }
        outstanding: { type: number }
        daysPastDue: { type: integer }

    ArAgingReport:
      description: >-
        Phase E — the buckets carry ONLY real receivable exposure (every item ≥ 0, Σ = GL Accounts Receivable). What we owe customers is
        shown beside them, never folded into a bucket, and the net is derived.
      type: object
      required: [buckets, total, liabilities, netCustomerPosition, items]
      properties:
        buckets: { $ref: "#/components/schemas/AgingBuckets" }
        total: { type: number, minimum: 0 }
        liabilities:
          type: object
          required: [customerCredits, customerDeposits]
          properties:
            customerCredits: { type: number, minimum: 0, description: Σ unapplied credit-note balances (GL Customer credit balances). }
            customerDeposits: { type: number, minimum: 0, description: Σ unapplied receipts (GL Customer deposits). }
        netCustomerPosition: { type: number, description: total − customerCredits − customerDeposits. }
        items:
          type: array
          items: { $ref: "#/components/schemas/ArAgingItem" }

