openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Saudi Bookkeeping Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Transaction management
  - name: categories
    description: Category management
  - name: categorize
    description: Categorization engine
  - name: summary
    description: Financial summaries and reports
  - name: journal_entries
    description: Journal entries and the draft/approval workflow
  - name: bills
    description: Vendor bills (AP) and the draft/approval workflow
  - name: invoices
    description: Customer invoices (AR, ZATCA) and the draft/approval workflow
  - name: payroll
    description: Payroll runs and the draft/approval workflow
  - name: period_locks
    description: Closing and reopening accounting periods
  - name: finance_hub
    description: The Finance Hub control surface
  - name: analytics
    description: Trends and decomposition
  - name: budgets
    description: Annual budget vs actual

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /deployment:
    get:
      operationId: getDeploymentBanner
      tags: [health]
      summary: What kind of deployment is this
      description: >
        PUBLIC and unauthenticated on purpose: the demo banner has to appear on
        the LOGIN page, before anyone has a session. Server-driven so the claim
        cannot drift from the deployment that makes it — a banner compiled into
        the frontend would keep saying "demo" on a build promoted elsewhere.
      responses:
        "200":
          description: Deployment descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBanner"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      parameters:
        - name: category_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: is_manually_overridden
          in: query
          schema:
            type: ["boolean", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: [debit, credit, null]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"

    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a single transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/review:
    get:
      operationId: getPendingReviewTransactions
      tags: [transactions]
      summary: Pending imported transactions — the holding-area review surface (M15)
      responses:
        "200":
          description: Pending rows, flagged where a human must look
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingReviewTransaction"

  /transactions/review/counts:
    get:
      operationId: getPendingReviewCounts
      tags: [transactions]
      summary: How many rows are pending review, in total — counted in SQL, never off the page
      description: |
        `GET /transactions/review` returns a CAPPED page (200 rows) because it
        feeds a screen. Any count taken from that page saturates at the cap, so
        a tenant with 5,000 pending rows was told 200 — and the bulk-accept
        button, which acts on EVERY safe pending row and posts them to the
        ledger, was labelled with that capped number. This endpoint is the true
        total, so a label can state the real blast radius of the act.
      responses:
        "200":
          description: True totals over every pending row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingReviewCounts"

  /transactions/review/accept:
    post:
      operationId: acceptPendingTransactions
      tags: [transactions]
      summary: Accept pending transactions (bulk-safe subset, or named ids)
      description: |
        With `ids`: deliberate, named acceptance of any pending rows. Without:
        bulk mode — the server restricts it to rows safe to accept unread
        (categorized or confidently-classified transfers at/above the
        confidence threshold, or manually categorized). needsAttention rows are
        NEVER swept in by bulk mode.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptPendingInput"
      responses:
        "200":
          description: How many rows were accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptPendingResult"

  /transactions/{id}/settle:
    post:
      operationId: settleTransaction
      tags: [transactions]
      summary: >
        Accept a pending transaction as the SETTLEMENT of an existing invoice or
        bill (M16.3). One act — accepting the match IS the review: the row
        leaves the holding area AND the payment is recorded through the
        existing pay path (Dr Cash / Cr AR, or Dr AP / Cr Cash). Never
        automatic — a human names the document, however exact the match.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleTransactionInput"
      responses:
        "200":
          description: The settled transaction (kind=settlement, linked, accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /capture:
    post:
      operationId: captureDocument
      tags: [capture]
      summary: >
        Stage a photographed supplier document (A1). The bytes go to DELETABLE
        staging — they become immutable evidence only when posted to a bill
        (BillApproveInput.captureId), after which the promotion job archives
        them.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CaptureUpload"
      responses:
        "201":
          description: The staged capture, with the server-side signature verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"

  /capture/{id}:
    get:
      operationId: getCapturedDocument
      tags: [capture]
      summary: Resume a review from a staged capture (survives a page refresh).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The staged capture's metadata and extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturedDocument"

  /capture/{id}/discard:
    post:
      operationId: discardCapturedDocument
      tags: [capture]
      summary: Discard a staged capture and delete its image
      description: >
        Deletes the stored image IMMEDIATELY rather than leaving it for the
        purge window. Discard is an explicit instruction — most often "I
        photographed the wrong thing", sometimes "my ID card was in frame" — and
        waiting up to 30 days to act on it is not what the word means.

        `imageDeleted` is false when the storage backend could not remove the
        bytes. The discard itself still stands (the instruction is recorded and
        the capture can no longer be attached to a bill), and the image is
        retried by the purge job — but the caller is told, because reporting a
        deletion that did not happen is the defect this endpoint was part of.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscardResult"

  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      summary: >
        List quotations (M21.1). A quotation is an OFFER - it affects no
        ledger, statement or return at any status.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [draft, submitted, approved] }
        - in: query
          name: customer_id
          schema: { type: integer }
        - in: query
          name: outcome
          description: >
            live hides quotations the tenant has declined or closed.
          schema: { type: string, enum: [live, declined, closed] }
      responses:
        "200":
          description: The tenant's quotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quotation"
    post:
      operationId: createQuotation
      tags: [quotations]
      summary: >
        Create a quotation as a DRAFT. The number is allocated server-side and
        a caller-supplied status is ignored. A caller holding quotations:approve
        has it issued in the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotationInput"
      responses:
        "201":
          description: The created quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getQuotation
      tags: [quotations]
      summary: One quotation, with its lines
      responses:
        "200":
          description: The quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    patch:
      operationId: updateQuotation
      tags: [quotations]
      summary: >
        Edit a quotation. Allowed while draft AND while approved - unlike an
        invoice, because a quotation is an offer rather than a legal document
        and renegotiating an unaccepted price is ordinary business. Locked while
        submitted, and after the tenant has declined or closed it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotationInput"
      responses:
        "200":
          description: The updated quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    delete:
      operationId: deleteQuotation
      tags: [quotations]
      summary: Delete a quotation (admin only)
      responses:
        "204": { description: Deleted }

  /quotations/{id}/submit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: submitQuotation
      tags: [quotations]
      summary: draft to submitted - enters the approver's queue
      responses:
        "200":
          description: The submitted quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: approveQuotation
      tags: [quotations]
      summary: >
        Approve - the quotation may now go to the customer. NOTE: this posts
        nothing. Unlike every other approvable entity, approval here fires no
        accounting activation, because a quotation is not a supply.
      responses:
        "200":
          description: The approved quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/send-back:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: sendBackQuotation
      tags: [quotations]
      summary: submitted to draft, with a correction note
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The returned quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: rejectQuotation
      tags: [quotations]
      summary: Reject a non-approved quotation (hard delete, no archive)
      responses:
        "204": { description: Rejected }

  /quotations/{id}/decline:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: declineQuotation
      tags: [quotations]
      summary: >
        Record that the CUSTOMER said no. A terminal act only the tenant can
        know - the platform never infers it from age or expiry.
      responses:
        "200":
          description: The declined quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/close:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: closeQuotation
      tags: [quotations]
      summary: >
        Abandon what is left of a quotation. The tenant decides a remainder is
        dead; nothing else does.
      responses:
        "200":
          description: The closed quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/reopen:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: reopenQuotation
      tags: [quotations]
      summary: Undo a decline or close recorded in error
      responses:
        "200":
          description: The reopened quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/convert:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: convertQuotation
      tags: [quotations]
      summary: >
        Convert part or all of a quotation into an invoice (M21.2). Omit lines
        to take everything still outstanding. Prices are FROZEN at the quoted
        values. Over-converting a line is refused with 409.

        The invoice is created through the ordinary invoice path and is ALWAYS
        a DRAFT, for every role: issuance consumes an ICV irreversibly and a
        conversion cannot be undone, so an approver looks at the invoice before
        it becomes a legal document. There is no option to change this.

        The conversion record is append-only - there is no undo. A mistake is
        corrected by a credit note against the invoice it produced.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertQuotationInput"
      responses:
        "201":
          description: The conversion and the invoice it produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationConversionResult"
        "409":
          description: >
            Not convertible - not approved, already declined/closed, fully
            converted already, or the requested quantity exceeds what remains.

  /quotations/{id}/conversions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listQuotationConversions
      tags: [quotations]
      summary: >
        The DATED conversion history - one entry per event, each naming the
        invoice it produced. Stored as events rather than a running total so
        the date of every partial acceptance survives.
      responses:
        "200":
          description: The conversion history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuotationConversion"

  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      tags: [purchase-orders]
      summary: >
        List purchase orders (M21.3). A PO is an INTENTION TO BUY - it affects
        no ledger, statement or return at any status.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [draft, submitted, approved] }
        - in: query
          name: vendor_id
          schema: { type: integer }
        - in: query
          name: outcome
          schema: { type: string, enum: [live, cancelled, closed] }
      responses:
        "200":
          description: The tenant's purchase orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
    post:
      operationId: createPurchaseOrder
      tags: [purchase-orders]
      summary: >
        Create a purchase order as a DRAFT. The number is allocated
        server-side; a caller-supplied status is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderInput"
      responses:
        "201":
          description: The created purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getPurchaseOrder
      tags: [purchase-orders]
      summary: One purchase order, with its lines, billed quantities and price variances
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
    patch:
      operationId: updatePurchaseOrder
      tags: [purchase-orders]
      summary: >
        Edit. Allowed while draft AND approved; locked while submitted and
        after a terminal outcome. A line the supplier has already billed cannot
        have its ordered quantity or price changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderInput"
      responses:
        "200":
          description: The updated purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
    delete:
      operationId: deletePurchaseOrder
      tags: [purchase-orders]
      summary: Delete a purchase order (admin only; refused once billed)
      responses:
        "204": { description: Deleted }

  /purchase-orders/{id}/submit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: submitPurchaseOrder
      tags: [purchase-orders]
      summary: >
        draft to submitted - enters the approver queue
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: approvePurchaseOrder
      tags: [purchase-orders]
      summary: >
        Approve - the order may now go to the supplier. Posts nothing: a purchase order is not a purchase.
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/send-back:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: sendBackPurchaseOrder
      tags: [purchase-orders]
      summary: >
        submitted to draft, with a correction note
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: rejectPurchaseOrder
      tags: [purchase-orders]
      summary: Reject a non-approved order (hard delete, no archive)
      responses:
        "204": { description: Rejected }

  /purchase-orders/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: cancelPurchaseOrder
      tags: [purchase-orders]
      summary: >
        Withdraw the order. NOTE the vocabulary: an order is CANCELLED by us. It is never "declined" - the platform has no way to know whether a supplier refused it.
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/close:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: closePurchaseOrder
      tags: [purchase-orders]
      summary: >
        Abandon whatever the supplier has not billed. The tenant decides a remainder is dead; nothing else does.
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/reopen:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: reopenPurchaseOrder
      tags: [purchase-orders]
      summary: >
        Undo a cancel or close recorded in error
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/convert:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: convertPurchaseOrder
      tags: [purchase-orders]
      summary: >
        Record the supplier's bill against this order (M21.3).

        THE BILL IS THE TRUTH; THE PURCHASE ORDER IS THE EXPECTATION. The bill
        carries the price the supplier actually charged, the order keeps what
        was ordered, and the difference is recorded as a variance rather than
        silently reconciled.

        The bill is created through the ordinary bill path and is ALWAYS a
        DRAFT, for every role. The record is append-only - there is no undo.

        Over-billing is refused with 409 unless allowOverBilling is set,
        because refusing outright would mean refusing to record a real
        liability.

        NOTE: this tracks BILLING, not delivery. There is no goods-receipt
        concept, so a part-billed order may or may not have been part-delivered
        and nothing here may claim to know which.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertPurchaseOrderInput"
      responses:
        "201":
          description: The conversion and the bill it produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderConversionResult"
        "409":
          description: >
            Not billable - not approved, cancelled/closed, fully billed, or the
            quantity exceeds what remains un-billed without allowOverBilling.

  /purchase-orders/{id}/conversions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listPurchaseOrderConversions
      tags: [purchase-orders]
      summary: >
        The DATED billing history - one entry per supplier bill recorded
        against this order.
      responses:
        "200":
          description: The billing history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrderConversion"

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: >
        The organization's audit trail (admin-only): who did what, when, from
        where, and the before/after states. Append-only at the storage layer -
        there is no write surface here or anywhere. This route predates the
        OpenAPI-first rule and gained its spec entry with its first UI (M23),
        when the response also gained actorName.
      parameters:
        - in: query
          name: entity_type
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: One page of the trail, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: >
        The organization's findings (AI-3a) - deterministic
        internal-consistency observations as rows with state, never a report
        file. Nothing here asserts a tax or compliance position (owner
        decision 2026-08-24: internal-consistency only until C10 closes).
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, acknowledged, resolved] }
        - in: query
          name: kind
          schema: { type: string }
      responses:
        "200":
          description: Findings, most recently seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsPage"

  /ask:
    get:
      operationId: listGroundedAnswers
      tags: [ask]
      summary: >
        The stored, auditable record of what the AI told the tenant (AI-6a,
        register A - facts and projections only). Refusals are rows too; a
        rejected model output is stored as a refusal WITHOUT the rejected
        text.
      responses:
        "200":
          description: Recent exchanges, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundedAnswersPage"
    post:
      operationId: askGroundedQuestion
      tags: [ask]
      summary: >
        Ask the books a question. The model selects ONE deterministic
        computation from a fixed menu and renders its output - it never
        authors a number, never advises (no opinion register exists), and a
        projection must carry its assumption IN the answer or it is
        rejected. 503 when no provider is configured - there is no
        deterministic floor for an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: The verified answer, or an honest refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /ask/status:
    get:
      operationId: getAskStatus
      tags: [ask]
      summary: Whether the assistant is enabled on this deployment (dark until the Enterprise agreement).
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }

  /findings/status:
    get:
      operationId: getFindingsStatus
      tags: [findings]
      summary: >
        Cadence, the last scheduled run, and the derived escalation flag
        (AI-5). Escalation is never stored - it is "unviewed and older than
        the interval", so it cannot drift from the facts that define it.
      responses:
        "200":
          description: The delivery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsStatus"

  /findings/schedule:
    put:
      operationId: setFindingsSchedule
      tags: [findings]
      summary: >
        Set the scheduled-review cadence - calendar quarterly (default) or
        monthly opt-in. Approver authority: the review rhythm is a review
        decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingsScheduleInput"
      responses:
        "200":
          description: The stored cadence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsScheduleInput"

  /findings/run:
    post:
      operationId: runFindings
      tags: [findings]
      summary: >
        Run every check now. Re-detection UPSERTS by (kind, refKey) - an
        acknowledged finding stays acknowledged while still detected; a
        finding no longer detected is machine-resolved and KEPT as the record
        that it was found. Moves nothing in any report.
      responses:
        "200":
          description: What the run changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsRunResult"

  /findings/{id}/acknowledge:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: acknowledgeFinding
      tags: [findings]
      summary: >
        Record that a human reviewed this finding and accepts the state it
        describes ("this duplicate is intentional"). Approver authority - a
        dismissal is a review decision. Survives re-detection; the machine
        never un-acknowledges.
      responses:
        "200":
          description: The acknowledged finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"

  /recurring:
    get:
      operationId: listRecurringRules
      tags: [recurring]
      summary: List recurring document rules (A3)
      responses:
        "200":
          description: The tenant's recurring rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringRule"
    post:
      operationId: createRecurringRule
      tags: [recurring]
      summary: >
        Create a recurring rule (A3). v1 generates DRAFTS ONLY — a rule never
        issues; the draft it produces needs an approver exactly as if typed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringRuleInput"
      responses:
        "201":
          description: The created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}/runs:
    get:
      operationId: getRecurringRuleRuns
      tags: [recurring]
      summary: >
        The rule's run history — "did my rent invoice go out?". Failed runs
        (period_locked, generation_failed) are first-class rows here: silence
        is not a neutral outcome.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringRun"

  /recurring/{id}/pause:
    post:
      operationId: pauseRecurringRule
      tags: [recurring]
      summary: Pause a rule (audited — silently stopping a customer's billing is a real question later)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The paused rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}/resume:
    post:
      operationId: resumeRecurringRule
      tags: [recurring]
      summary: Resume a paused rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The resumed rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}:
    delete:
      operationId: deleteRecurringRule
      tags: [recurring]
      summary: Delete a rule (its run history cascades; generated documents are untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /transactions/upload:
    post:
      operationId: uploadTransactions
      tags: [transactions]
      summary: Upload transactions from CSV or JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpload"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction (manual override)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categorize:
    post:
      operationId: runCategorization
      tags: [categorize]
      summary: Run the categorization engine on uncategorized transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategorizationRequest"
      responses:
        "200":
          description: Categorization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizationResult"

  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: >
        Budget vs actual for one ANNUAL period (M19.5). `period` is a YYYY
        string — budgets are annual by decision, not by omission: see
        design-analytics.md §7. Actuals are signed by account type (M19.0), so a
        refund reduces spend rather than adding to it.
      parameters:
        - { name: period, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: One row per budgeted category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLine"

  /analytics/trend:
    get:
      operationId: getTrend
      tags: [analytics]
      summary: >
        Liquidity and solvency per month end (M19.1). Each point carries its own
        `claimable` — the Finance Hub withholding propagates PER POINT, since a
        blocker is a fact about a moment and an earlier month may be clean.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: One point per month, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  /analytics/receivables-bridge:
    get:
      operationId: getReceivablesBridge
      tags: [analytics]
      summary: >
        The receivables bridge per month (M19.6): opening + invoiced − collected
        − credited − other = closing.
      description: >
        Answers what the "receivables outstanding" stock cannot: a rising AR
        balance does not say whether you invoiced more or collected less, and
        those call for opposite responses.

        Every term is a debit or a credit on the SAME GL account, so the
        identity holds by construction rather than by agreement — and `closing`
        is the balance-sheet AR figure for the same date, for the same reason.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: "YYYY-MM" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "YYYY-MM" }
      responses:
        "200":
          description: One point per month, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BridgePoint"

  /analytics/cash:
    get:
      operationId: getCashReconciliation
      tags: [analytics]
      summary: >
        Bank movement and ledger cash side by side, with the gap itemised
        (M19.7).
      description: >
        🔴 TWO FIGURES, DELIBERATELY. The transaction store and the general
        ledger disagree about cash, and each is right about the question it
        answers: "Bank movement" is what the bank statement shows (every
        accepted transaction, including transfers and settlements); "Ledger
        cash" is what the double-entry books say (excluding transfers and
        settlements, which never post, and including payments recorded on a
        document, which create no transaction).

        Following the M16 Q0 precedent — documents FILE, transactions RECONCILE
        — two figures are tolerable only when each says which question it
        answers and the gap between them is accounted for line by line.
        `unexplained` must be zero; anything else means a cause nobody has
        named.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: "YYYY-MM" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "YYYY-MM" }
      responses:
        "200":
          description: Both series per month, plus the itemised reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashReconciliation"

  /analytics/decomposition:
    get:
      operationId: getDecomposition
      tags: [analytics]
      summary: >
        WHERE a change came from (M19.2) — ranked contributors between a window
        and the equal-length window before it. Never why.
      parameters:
        - { name: dimension, in: query, required: true, schema: { type: string, enum: [category, customer, vendor] } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ranked contributors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decomposition"

  /finance-hub/liquidity:
    get:
      operationId: getLiquidity
      tags: [finance_hub]
      summary: >
        "Can I pay what I owe?" (M18.3) — current/quick assets, current
        liabilities, working capital and the two ratios, from the GL.
      parameters:
        - name: as_of
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: The liquidity position, and whether it may be claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liquidity"

  /finance-hub/tax-compliance:
    get:
      operationId: getTaxCompliance
      tags: [finance_hub]
      summary: >
        Tax & Compliance state (M18.5) — the VAT position for the CURRENT
        CALENDAR QUARTER and ZATCA connection state. The quarter is ours, not
        theirs: KSA filing frequency is not modelled, so this must never be
        presented as "your VAT return".
      responses:
        "200":
          description: VAT position and ZATCA state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxCompliance"

  /finance-hub/books-status:
    get:
      operationId: getBooksStatus
      tags: [finance_hub]
      summary: >
        "Are my books current?" — the unreviewed-transaction signal, mirrored
        from the Banking review surface rather than duplicated (design Q7).
      responses:
        "200":
          description: Counts only; the work happens on /review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksStatus"

  /period-locks:
    get:
      operationId: listPeriodLocks
      tags: [period_locks]
      summary: >
        Accounting periods this company has closed (M18.4). Readable by every
        role; only an organization admin may close or reopen one.
      responses:
        "200":
          description: Closed periods, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeriodLock"
    post:
      operationId: lockPeriod
      tags: [period_locks]
      summary: >
        Close an accounting period. Nothing may afterwards be posted into it —
        a correction posts in the current open period instead, never re-dated
        backwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodLockInput"
      responses:
        "201":
          description: The period is now closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodLock"

  /period-locks/{period}:
    delete:
      operationId: unlockPeriod
      tags: [period_locks]
      summary: >
        Reopen a closed period (admin only). Company-scoped — reopening one
        company's period leaves every other company's locks untouched.
      parameters:
        - name: period
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reopened

  /companies/current/fiscal-years:
    get:
      operationId: listFiscalYears
      tags: [companies]
      summary: >
        The active company's fiscal years, resolved to real date ranges (M17.2).
        The production consumer `companies.fiscal_year_start` never had — it was
        stored from M11.6 and applied by nothing until now.
      responses:
        "200":
          description: The current fiscal period plus a window either side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalYears"

  /companies/current:
    get:
      operationId: getCurrentCompany
      tags: [companies]
      summary: Get the active company's profile (legal identity + address)
      responses:
        "200":
          description: The active company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCurrentCompany
      tags: [companies]
      summary: Update the active company's profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyInput"
      responses:
        "200":
          description: The updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /zatca/onboarding:
    get:
      operationId: getZatcaOnboardingStatus
      tags: [zatca]
      summary: ZATCA onboarding prerequisites and current certificate status
      responses:
        "200":
          description: Prerequisite checklist plus the active certificate, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZatcaOnboardingStatus"
    post:
      operationId: onboardZatca
      tags: [zatca]
      summary: >-
        Run ZATCA onboarding (CSR -> compliance CSID -> six compliance documents
        -> production CSID). The OTP is generated by the tenant in their own
        Fatoora portal and is never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZatcaOnboardInput"
      responses:
        "200":
          description: >-
            The compliance results. `activated` is false when any document was
            rejected — the certificate is NOT stored in that case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZatcaOnboardResult"

  /summary:
    get:
      operationId: getSummary
      tags: [summary]
      summary: Get full financial summary
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  /summary/vat:
    get:
      operationId: getVatSummary
      tags: [summary]
      summary: Get VAT summary
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: VAT summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VatSummary"

  # `/summary/zakat` was REMOVED in M17.0. It summed transactions flagged
  # `is_zakat_relevant` — a flag only one categorization rule ever wrote — so it
  # returned a computed-looking SAR 0.00 for almost every tenant, against a
  # nisab threshold hardcoded from a 2024 gold price. Zakat returns in M17.4 as
  # a GL-derived working paper, not a summary endpoint.
  # See docs/product/design-zakat-module.md.

  /summary/by-category:
    get:
      operationId: getSummaryByCategory
      tags: [summary]
      summary: Get spending and income totals grouped by category
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Per-category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

  /reports/vat-return:
    get:
      operationId: getVatReturn
      tags: [reports]
      summary: Get the VAT return (filing view, from invoices and bills)
      description: |
        The FILING source (M16.1 / design Q0): computed from invoices and
        bills — the legal documents — with per-line tax treatment (M12.1a) and
        credit-note direction (M12.1b) applied. The transaction-derived
        `/summary/vat` figure is the RECONCILIATION view beside this, never the
        filing source.
      parameters:
        - name: period_from
          in: query
          description: "Filing period start, YYYY-MM"
          schema:
            type: ["string", "null"]
            pattern: "^\\d{4}-\\d{2}$"
        - name: period_to
          in: query
          description: "Filing period end, YYYY-MM"
          schema:
            type: ["string", "null"]
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Box-structured VAT return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VatReturn"

  /journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [journal_entries]
      summary: Approve a draft journal entry (posts it to the general ledger)
      description: >
        Draft/approval workflow (M10.2). Approving a draft (pending) journal
        entry fires its activation path — the period-lock check and the
        post-to-GL transition — so it becomes active in the ledger. Only an
        approver (admin/accountant) may call this; a bookkeeper is denied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (posted) journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The journal entry is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /journal-entries/{id}/reject:
    post:
      operationId: rejectJournalEntry
      tags: [journal_entries]
      summary: Reject a pending draft journal entry (hard-deletes it)
      description: >
        Draft/approval workflow (M10.2). Rejecting a pending draft hard-deletes
        it — there is no archive of rejected drafts. Only a pending draft can be
        rejected; a posted/reversed entry must be reversed instead. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The draft was rejected and removed
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a pending draft can be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/submit:
    post:
      operationId: submitBill
      tags: [bills]
      summary: Submit a draft bill into the approval queue
      description: >
        Draft/approval workflow (M10.3). Moves an editable draft bill to
        `submitted` (awaiting approval); the bill is locked to the enterer until
        approved or sent back. This is the bookkeeper's own action (create-level
        authorization), not an approver action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft bill can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/send-back:
    post:
      operationId: sendBackBill
      tags: [bills]
      summary: Send a submitted bill back to the enterer for correction
      description: >
        Draft/approval workflow (M10.3). Returns a `submitted` bill to `draft`
        with an optional reviewer note (shown to the enterer while editing). The
        enterer corrects and resubmits. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The bill, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted bill can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [bills]
      summary: Approve a bill (posts it to the general ledger)
      description: >
        Draft/approval workflow (M10.3). Approving a bill fires its activation:
        totals reconciliation, ZATCA vendor-VAT validation (both overridable with
        `force`), the period-lock check, and the Dr Purchases/Input VAT / Cr
        Accounts Payable posting. Only then does the bill affect AP/expense/VAT.
        May be approved straight from draft (self-approve) or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillApproveInput"
      responses:
        "200":
          description: The approved (posted) bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Business-rule rejection (zero total, totals mismatch, invalid VAT number)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The bill is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/reject:
    post:
      operationId: rejectBill
      tags: [bills]
      summary: Reject a non-approved bill (hard-deletes it)
      description: >
        Draft/approval workflow (M10.3). Hard-deletes a draft or submitted bill —
        no archive of rejected records. An approved bill cannot be rejected (it
        must be reversed). Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The bill was rejected and removed
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An approved bill cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/submit:
    post:
      operationId: submitInvoice
      tags: [invoices]
      summary: Submit a draft invoice into the approval queue
      description: >
        Draft/approval workflow (M10.4). Moves an editable draft invoice to
        `submitted` (awaiting approval); locked to the enterer until approved or
        sent back. Bookkeeper (create-level) action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft invoice can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/send-back:
    post:
      operationId: sendBackInvoice
      tags: [invoices]
      summary: Send a submitted invoice back to the enterer for correction
      description: >
        Draft/approval workflow (M10.4). Returns a `submitted` invoice to `draft`
        with an optional reviewer note. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The invoice, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted invoice can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/approve:
    post:
      operationId: approveInvoice
      tags: [invoices]
      summary: Approve (issue) an invoice — builds the ZATCA hash chain and posts AR
      description: >
        Draft/approval workflow (M10.4). Approving an invoice issues it: it is
        recognized in AR/revenue/VAT, and its ZATCA hash-chain link + QR are
        minted HERE (not at create), so a rejected/deleted draft never consumes a
        sequence number. May be approved straight from draft (self-approve on
        create, done automatically for approvers) or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (issued) invoice, with ZATCA hash + QR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The invoice is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/reject:
    post:
      operationId: rejectInvoice
      tags: [invoices]
      summary: Reject a non-approved invoice (hard-deletes it)
      description: >
        Draft/approval workflow (M10.4). Hard-deletes a draft or submitted invoice
        — no archive. Because a draft carries no hash-chain link, deleting it
        leaves no gap in the sequence. An issued invoice cannot be rejected (it
        must be reversed with a credit note). Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The invoice was rejected and removed
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An issued invoice cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/submit:
    post:
      operationId: submitPayrollRun
      tags: [payroll]
      summary: Submit a draft payroll run into the approval queue
      description: >
        Draft/approval workflow (M10.5). Moves a draft run to `submitted`
        (awaiting approval). Bookkeeper (create-level) action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft run can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/send-back:
    post:
      operationId: sendBackPayrollRun
      tags: [payroll]
      summary: Send a submitted payroll run back to the enterer for correction
      description: >
        Draft/approval workflow (M10.5). Returns a `submitted` run to `draft` with
        an optional reviewer note. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The payroll run, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted run can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/approve:
    post:
      operationId: approvePayrollRun
      tags: [payroll]
      summary: Approve a payroll run (posts the payroll GL entry)
      description: >
        Draft/approval workflow (M10.5). Approving a run posts its GL entry (Dr
        Salaries + Employer GOSI / Cr Net Pay + GOSI Payable) — the only ledger
        effect a run has. May be approved from draft or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (posted) payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The payroll run is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/reject:
    post:
      operationId: rejectPayrollRun
      tags: [payroll]
      summary: Reject a non-approved payroll run (hard-deletes it)
      description: >
        Draft/approval workflow (M10.5). Hard-deletes a draft or submitted run —
        no archive. An approved run cannot be rejected. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The payroll run was rejected and removed
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An approved run cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DiscardResult:
      type: object
      properties:
        status:
          type: string
        imageDeleted:
          type: boolean
          description: >
            False means the bytes are still in storage and the capture's row is
            retained so they remain findable and retryable. Never reported as
            true unless the backend confirmed the deletion.
      required:
        - status
        - imageDeleted

    DeploymentBanner:
      type: object
      description: >
        `demoMode: false` on a normal deployment, and the frontend renders
        nothing. Both languages are returned together because the banner is a
        claim about the DEPLOYMENT, not a UI string — it must read identically
        whichever language the viewer has selected.
      properties:
        demoMode:
          type: boolean
        messageEn:
          type: ["string", "null"]
        messageAr:
          type: ["string", "null"]
        lastResetAt:
          type: ["string", "null"]
          format: date-time
          description: >
            When the weekly wipe last SUCCEEDED. Null means it has not run since
            this deployment started. The banner shows it because "data is wiped
            weekly" is a promise, and an unverifiable promise about data
            deletion is the kind of claim that should not be made at all.
        nextResetAt:
          type: ["string", "null"]
          format: date-time
      required:
        - demoMode

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ZatcaPrerequisite:
      type: object
      required: [key, label, satisfied, hint]
      properties:
        key: { type: string }
        label: { type: string }
        satisfied: { type: boolean }
        hint: { type: string }

    ZatcaOnboardingStatus:
      type: object
      required: [environment, prerequisites, ready, certificate]
      properties:
        environment: { type: string, enum: [sandbox, simulation, production] }
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/ZatcaPrerequisite"
        ready: { type: boolean }
        certificate:
          type: ["object", "null"]
          required: [status, notAfter, daysUntilExpiry, egsSerialNumber]
          properties:
            status: { type: string }
            notAfter: { type: ["string", "null"] }
            daysUntilExpiry: { type: ["integer", "null"] }
            egsSerialNumber: { type: ["string", "null"] }

    ZatcaOnboardInput:
      type: object
      required: [otp]
      properties:
        otp:
          type: string
          description: >-
            One-time password generated by the tenant in the Fatoora portal.
            Used once and never stored. NOTE: the ZATCA sandbox accepts ANY
            value, so a successful sandbox run proves nothing about this path.

    ZatcaComplianceDocumentResult:
      type: object
      required: [label, passed, errors, warnings]
      properties:
        label: { type: string }
        passed: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }

    ZatcaOnboardResult:
      type: object
      required: [complianceDocuments, activated]
      properties:
        complianceDocuments:
          type: array
          items:
            $ref: "#/components/schemas/ZatcaComplianceDocumentResult"
        activated: { type: boolean }

    Company:
      type: object
      description: >
        A company's legal identity. `vatNumber` and `name` are the SELLER identity
        stamped onto every issued e-invoice (ZATCA QR tags 1-2 and the invoice
        hash), so they are not cosmetic settings.
      required:
        [
          id,
          name,
          nameAr,
          crNumber,
          vatNumber,
          fiscalYearStart,
          fiscalCalendar,
          ownershipType,
          buildingNumber,
          street,
          district,
          city,
          postalCode,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        crNumber:
          type: ["string", "null"]
        vatNumber:
          type: ["string", "null"]
        fiscalYearStart:
          type: ["integer", "null"]
          description: >
            Month the fiscal year starts, 1-12 IN `fiscalCalendar` (gregorian
            1 = January; hijri 1 = Muharram — read the two together). 🔴 NULL
            means NOT DECLARED, a first-class state (M20.0): there is no
            default, because the old NOT NULL DEFAULT 1 recorded every
            untouched company as having chosen January. Reports fall back to a
            rolling last-12-months while null, and say so.
          minimum: 1
          maximum: 12
        fiscalCalendar:
          type: string
          enum: [gregorian, hijri]
          description: >
            Which calendar the fiscal year is expressed in (M17.2). `hijri`
            means the Umm al-Qura (Saudi civil) calendar specifically.
        ownershipType:
          type: ["string", "null"]
          enum: [SAUDI_GCC, FOREIGN, MIXED, null]
          description: >
            Ownership structure (M17.1). NULL means NOT DECLARED and is a
            first-class state — there is no default, because defaulting would
            have the platform assert the tenant ownership nobody supplied, and
            that assertion decides whether a Zakat surface is shown. Zakat v1
            covers SAUDI_GCC only; FOREIGN/MIXED are directed to a tax advisor.
        buildingNumber:
          type: ["string", "null"]
        street:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]

    UpdateCompanyInput:
      type: object
      description: >
        Partial update. Any omitted field is left unchanged; send an empty string
        to clear an optional field.
      properties:
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        crNumber:
          type: ["string", "null"]
        vatNumber:
          type: ["string", "null"]
        fiscalYearStart:
          type: ["integer", "null"]
          description: null withdraws the declaration (M20.0).
          minimum: 1
          maximum: 12
        fiscalCalendar:
          type: string
          enum: [gregorian, hijri]
        ownershipType:
          type: ["string", "null"]
          enum: [SAUDI_GCC, FOREIGN, MIXED, null]
        buildingNumber:
          type: ["string", "null"]
        street:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]

    FiscalPeriod:
      type: object
      description: >
        One fiscal year resolved to concrete dates (M17.2). `label` is the year
        the period STARTS in, in the company's own calendar — a display
        convention, not a fact, which is why `startDate`, `endDate` and
        `endYear` are all returned and the UI shows the range beside the label.
      required: [label, endYear, calendar, startDate, endDate, days]
      properties:
        label:
          type: integer
          description: Year the period starts in, in the company's own calendar (AH for hijri).
        endYear:
          type: integer
          description: Year the period ends in — so a consumer may label by either end.
        calendar:
          type: string
          enum: [gregorian, hijri]
        startDate:
          type: string
          description: Inclusive, YYYY-MM-DD (Gregorian, the platform's storage format).
        endDate:
          type: string
          description: Inclusive — the day before the next fiscal year begins.
        days:
          type: integer
          description: >
            Inclusive day count: 365/366 Gregorian, 354/355 Hijri. Computed from
            the real boundaries, never assumed. It is the input to the Gregorian
            Zakat rate adjustment — but the RATE is not computed here, because
            its divisor is unverified (advisor Block C, question C3).

    FiscalYears:
      type: object
      required: [declared, calendar, fiscalYearStart, current, periods]
      properties:
        declared:
          type: boolean
          description: >
            M20.0 — false means the tenant has never said when their fiscal
            year starts. `current` is null and `periods` is empty, so a
            consumer cannot receive a resolved January year that looks like an
            answer nobody gave. Reports use a rolling last-12-months in this
            state, and say so (F11/F13).
        calendar:
          type: string
          enum: [gregorian, hijri]
        fiscalYearStart:
          type: ["integer", "null"]
          minimum: 1
          maximum: 12
        current:
          oneOf:
            - $ref: "#/components/schemas/FiscalPeriod"
            - type: "null"
        periods:
          type: array
          description: A window around the current period, newest first.
          items:
            $ref: "#/components/schemas/FiscalPeriod"

    BudgetLine:
      type: object
      required: [id, period, budgetedAmount, actualAmount, variance, variancePct]
      properties:
        id: { type: integer }
        name: { type: ["string", "null"] }
        period: { type: string, description: "YYYY — annual only." }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        categoryNameAr: { type: ["string", "null"] }
        categoryType: { type: ["string", "null"] }
        budgetedAmount: { type: number }
        actualAmount:
          type: number
          description: >
            Signed by account type (M19.0). May be NEGATIVE when refunds exceed
            spend — a real state, reported rather than clamped to zero.
        variance: { type: number }
        variancePct: { type: number }

    TrendPoint:
      type: object
      required: [period, currentAssets, quickAssets, currentLiabilities, workingCapital,
                 currentRatio, quickRatio, debtToEquity, netWorth, claimable, blockers]
      properties:
        period: { type: string }
        currentAssets: { type: number }
        quickAssets: { type: number }
        currentLiabilities: { type: number }
        workingCapital: { type: number }
        currentRatio: { type: ["number", "null"] }
        quickRatio: { type: ["number", "null"] }
        debtToEquity: { type: ["number", "null"] }
        netWorth: { type: number }
        claimable:
          type: boolean
          description: >
            False means this point must NOT be drawn as an ordinary segment. The
            line breaks, visibly, rather than running through a month we cannot
            stand behind.
        blockers:
          type: array
          items:
            type: object
            required: [code, amount]
            properties:
              code: { type: string, enum: [suspense_balance, unclassified_accounts, undeclared_transfers] }
              amount: { type: number }
              count: { type: ["integer", "null"] }

    BridgePoint:
      type: object
      required: [period, opening, invoiced, collected, credited, other, closing]
      properties:
        period: { type: string }
        opening: { type: number }
        invoiced:
          type: number
          description: >
            Debits to AR — invoices AND debit notes. A debit note posts like an
            invoice; it does not reverse.
        collected:
          type: number
          description: Credits to AR settled in cash.
        credited:
          type: number
          description: Credits to AR that reversed revenue — credit notes.
        other:
          type: number
          description: >
            Credits to AR that were neither. A write-off or an offset is not a
            payment and not a credit note; reporting it separately is the
            difference between a bridge that understands the movement and one
            that mislabels it. Normally zero.
        closing:
          type: number
          description: Equals the balance-sheet AR figure for the same date.

    CashReconciliation:
      type: object
      required: [from, to, bankMovement, ledgerCash, gap, items, unexplained, undeclaredTransfers, points]
      properties:
        from: { type: string }
        to: { type: string }
        bankMovement:
          type: number
          description: Every accepted transaction, all kinds — what the bank shows.
        ledgerCash:
          type: number
          description: Movement on cash-classified GL accounts — what the books say.
        gap:
          type: number
          description: bankMovement − ledgerCash. Zero when the two stores agree.
        items:
          type: array
          description: >
            Each entry is a NAMED reason the two differ, and they sum to the gap
            exactly. A gap merely displayed is a discrepancy; a gap itemised is
            a reconciliation.
          items:
            type: object
            required: [code, amount]
            properties:
              code:
                type: string
                description: >
                  A — GL owns cash (2026-08-17): transfers now POST, so the
                  three transfer codes are gone. What remains is deliberate
                  (settlements post via the pay path), historical
                  (unposted_legacy — locked-period skips, should stay zero),
                  or ledger-side (document payments with no bank row).
                enum:
                  - settlements
                  - unposted_legacy
                  - ledger_only
              amount: { type: number }
        unexplained:
          type: number
          description: >
            🔴 Must be 0. Non-zero means a difference exists that no named cause
            accounts for — returned rather than asserted so the page can say so
            instead of presenting a reconciliation that does not reconcile.
        undeclaredTransfers:
          type: number
          description: >
            Transfer movement nobody has classified (B5). No longer a GAP
            component — an undeclared transfer posts, into Transfer suspense —
            but still a question only the tenant can answer, surfaced so the
            page can ask for the declaration. The same money the Finance Hub's
            liquidity claim is withheld over.
        points:
          type: array
          items:
            $ref: "#/components/schemas/CashPoint"

    CashPoint:
      type: object
      required: [period, bankMovement, ledgerCash, gap]
      properties:
        period: { type: string }
        bankMovement: { type: number }
        ledgerCash: { type: number }
        gap: { type: number }

    Decomposition:
      type: object
      required: [dimension, current, prior, change, contributors, concentration]
      properties:
        dimension: { type: string, enum: [category, customer, vendor] }
        current:
          type: object
          required: [from, to, total]
          properties:
            from: { type: string }
            to: { type: string }
            total: { type: number }
        prior:
          type: object
          required: [from, to, total]
          properties:
            from: { type: string }
            to: { type: string }
            total: { type: number }
        change: { type: number }
        contributors:
          type: array
          items:
            type: object
            required: [id, name, nameAr, current, prior, change, shareOfChange]
            properties:
              id: { type: string }
              name: { type: string }
              nameAr: { type: string }
              current: { type: number }
              prior: { type: number }
              change: { type: number }
              shareOfChange:
                type: ["number", "null"]
                description: >
                  NULL when the NET change is about zero. Offsetting movements
                  are real, and a share of "nothing changed" is undefined rather
                  than infinite. The movers stay ranked.
        concentration:
          type: ["object", "null"]
          required: [count, share]
          properties:
            count: { type: integer }
            share: { type: number }

    Liquidity:
      type: object
      description: >
        🔴 `claimable` is the field that matters. When false the UI must NOT
        state the plain-language claim ("you can cover your short-term debts
        1.8x over") — the figures are still returned so the breakdown and the
        blocker can be shown, but the CLAIM is withheld. `observations` are
        RULES OF THUMB, never compliance: no severity above "watch" exists.
      required:
        [asOf, currentAssets, quickAssets, currentLiabilities, workingCapital,
         currentRatio, quickRatio, claimable, blockers, observations]
      properties:
        asOf:
          type: string
        currentAssets:
          type: number
        quickAssets:
          type: number
          description: Cash + quick — the acid-test numerator.
        currentLiabilities:
          type: number
        workingCapital:
          type: number
        currentRatio:
          type: ["number", "null"]
          description: NULL when there are no current liabilities — undefined, not zero.
        quickRatio:
          type: ["number", "null"]
        claimable:
          type: boolean
        blockers:
          type: array
          items:
            type: object
            required: [code, amount]
            properties:
              code:
                type: string
                description: >
                  undeclared_transfers (A, 2026-08-17) — money in Transfer
                  suspense: cash whose destination nobody has declared, which
                  is exactly the case the withholding exists for.
                enum: [suspense_balance, unclassified_accounts, undeclared_transfers]
              amount:
                type: number
              count:
                type: ["integer", "null"]
        observations:
          type: array
          items:
            type: object
            required: [code, severity, ratio]
            properties:
              code:
                type: string
              severity:
                type: string
                enum: [watch]
              ratio:
                type: number

    TaxCompliance:
      type: object
      required: [vat, zatca]
      properties:
        vat:
          type: object
          required: [periodFrom, periodTo, periodBasis, filingFrequencyKnown, netVatDue, payable, refund]
          properties:
            periodFrom: { type: string }
            periodTo: { type: string }
            periodBasis:
              type: string
              enum: [calendar_quarter]
            filingFrequencyKnown:
              type: boolean
              description: >
                Always false today. KSA VAT is filed monthly or quarterly by
                turnover and nothing records which applies, so the UI must state
                the period it used rather than imply a filing obligation.
            netVatDue: { type: number }
            payable: { type: number }
            refund: { type: number }
        zatca:
          type: ["object", "null"]
          required: [environment, connected, certificateStatus, daysUntilExpiry]
          properties:
            environment: { type: string }
            connected: { type: boolean }
            certificateStatus: { type: ["string", "null"] }
            daysUntilExpiry: { type: ["integer", "null"] }

    BooksStatus:
      type: object
      required: [unreviewedCount, needsAttentionCount]
      properties:
        unreviewedCount:
          type: integer
        needsAttentionCount:
          type: integer

    PeriodLock:
      type: object
      required: [id, period, lockedAt, lockedBy, notes]
      properties:
        id:
          type: integer
        period:
          type: string
          description: The closed month, `YYYY-MM`.
        lockedAt:
          type: string
        lockedBy:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    PeriodLockInput:
      type: object
      required: [period]
      properties:
        period:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: The month to close, `YYYY-MM` (e.g. 2026-06).
        notes:
          type: ["string", "null"]

    Category:
      type: object
      required: [id, name, nameAr, type, vatApplicable]
      properties:
        id:
          type: integer
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, asset, liability, equity]
        vatApplicable:
          type: boolean
        liquidityClass:
          type: ["string", "null"]
          enum: [cash, quick, current, non_current, null]
          description: >
            M18.1 — where a BALANCE-SHEET account sits on the liquidity scale,
            for the Finance Hub. Current assets are everything but
            `non_current`; quick assets are `cash` + `quick`. NULL on an asset
            or liability means UNCLASSIFIED and is surfaced as such, never
            silently treated as current. Always NULL on income/expense/equity
            accounts, where the distinction is meaningless.
        description:
          type: ["string", "null"]

    CategoryInput:
      type: object
      required: [name, nameAr, type, vatApplicable]
      properties:
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, asset, liability, equity]
        vatApplicable:
          type: boolean
        liquidityClass:
          type: ["string", "null"]
          enum: [cash, quick, current, non_current, null]
          description: >
            Only meaningful when `type` is `asset` or `liability`; the server
            rejects it on any other account type (and a DB CHECK backs that up).
        description:
          type: ["string", "null"]

    Transaction:
      type: object
      required:
        - id
        - date
        - description
        - amount
        - currency
        - type
        - isManuallyOverridden
        - createdAt
      properties:
        id:
          type: integer
        date:
          type: string
        description:
          type: string
        descriptionAr:
          type: ["string", "null"]
        amount:
          type: number
        currency:
          type: string
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        categoryNameAr:
          type: ["string", "null"]
        vatAmount:
          type: ["number", "null"]
        vatRate:
          type: ["number", "null"]
        confidenceScore:
          type: ["number", "null"]
        isManuallyOverridden:
          type: boolean
        source:
          type: ["string", "null"]
        reviewStatus:
          type: string
          enum: [pending_review, accepted]
        kind:
          description: |
            M16.2 — operating (real income/expense; the only kind tax figures
            read), transfer (money between the business's own pockets), or
            settlement (M16.3: settles an existing invoice/bill).
          type: string
          enum: [operating, transfer, settlement]
        taxTreatment:
          description: "VAT treatment: S/Z/E/O; null = unknown (and only unknown)."
          type: ["string", "null"]
          enum: [S, Z, E, O, null]
        vatBasis:
          description: |
            Flaw #6 — whether VAT was actually CHARGED on this payment, which
            is a different fact from what the supply IS (taxTreatment).
            `reverse_charge`: a foreign supplier charges no KSA VAT and the
            buyer self-accounts. `supplier_unregistered`: a supplier below the
            VAT threshold charges none. VAT is extracted only when
            taxTreatment='S' AND vatBasis='charged'.
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        bankAccountId:
          type: ["integer", "null"]
        transferDirection:
          description: |
            B5 — where a transfer went: `own_account`, `external`, or `null` for
            NOT DECLARED. Null is a real state, not a default: only the person
            who entered the row knows, and the cash reconciliation reports
            undeclared transfers as unknown rather than assuming either way.
          type: ["string", "null"]
          enum: [own_account, external, null]
        counterpartyBankAccountId:
          type: ["integer", "null"]
        settlesInvoiceId:
          description: "M16.3: the invoice this credit settled (kind=settlement)."
          type: ["integer", "null"]
        settlesBillId:
          description: "M16.3: the bill this debit paid (kind=settlement)."
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PendingReviewCounts:
      type: object
      required: [total, needsAttention, ready]
      properties:
        total:
          type: integer
          description: Every row awaiting review, counted in SQL over the whole set.
        needsAttention:
          type: integer
          description: Rows a human must look at (uncategorised non-transfer, or low confidence and not manually overridden).
        ready:
          type: integer
          description: |
            `total - needsAttention` — exactly the set bulk accept will act on
            and POST to the ledger. Computed server-side so no client can derive
            it from a page.

    PendingReviewTransaction:
      type: object
      required: [id, date, description, amount, type, needsAttention, kind]
      properties:
        id: { type: integer }
        date: { type: string }
        description: { type: string }
        descriptionAr: { type: ["string", "null"] }
        amount: { type: number }
        type: { type: string, enum: [debit, credit] }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        confidenceScore: { type: ["number", "null"] }
        vatAmount: { type: ["number", "null"] }
        kind: { type: string, enum: [operating, transfer, settlement] }
        taxTreatment: { type: ["string", "null"], enum: [S, Z, E, O, null] }
        vatBasis:
          description: "Flaw #6 — whether VAT was actually charged (see Transaction.vatBasis)."
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        treatmentAssumed:
          description: |
            M16.3.1 — true when the row's treatment came from a category
            default that has NOT been verified against KSA VAT rules (only
            BANK_CHARGES and INSURANCE have been — queue C9 tracks the rest).
            The UI shows these as "assumed" with an override; a user must
            never read a confident 'S' off a guess.
          type: boolean
        needsAttention:
          description: |
            True for rows a human MUST look at (uncategorized non-transfer, or
            low-confidence). The server enforces this: bulk accept never takes
            a needsAttention row — accepting one requires naming its id.
          type: boolean
        suggestion:
          description: |
            M16.3 — an exact-match settlement SUGGESTION, never an action. The
            UI pre-selects it; only POST /transactions/{id}/settle applies it,
            and only when a human clicks. Null when no unambiguous match
            exists (unmatched rows stay plain transactions).
          oneOf:
            - $ref: "#/components/schemas/SettlementSuggestion"
            - type: "null"

    SettlementSuggestion:
      type: object
      required: [documentKind, documentId, documentNumber, outstanding, matchedBy, partial]
      properties:
        documentKind:
          type: string
          enum: [invoice, bill]
        documentId: { type: integer }
        documentNumber: { type: string }
        counterpartyName: { type: ["string", "null"] }
        outstanding:
          description: The document's outstanding balance (total - paid).
          type: number
        matchedBy:
          description: |
            "number" — the document number appears in the bank-line description;
            "amount" — the amount equals exactly ONE open document's outstanding
            balance. v1 is exact-match only (design Q3a).
          type: string
          enum: [number, amount]
        partial:
          description: |
            True when the amount is LESS than the outstanding balance and the
            description references the document number (Q3b: description-
            referenced partials suggested; amount-only partials never).
          type: boolean

    SettleTransactionInput:
      type: object
      description: Exactly one of invoiceId / billId must be set.
      properties:
        invoiceId:
          type: ["integer", "null"]
        billId:
          type: ["integer", "null"]

    AcceptPendingInput:
      type: object
      properties:
        ids:
          type: ["array", "null"]
          items: { type: integer }

    AcceptPendingResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }

    TransactionList:
      type: object
      required: [transactions, total, offset, limit]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    # M15: real constraints. `date: string` / `amount: number` accepted
    # date="banana" and amount=-431.25, leaving Postgres as the only guard —
    # the client-side parser was the sole real validation, which a direct API
    # call bypasses entirely.
    TransactionInput:
      type: object
      required: [date, description, amount, currency, type]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        description:
          type: string
          minLength: 1
          maxLength: 500
        descriptionAr:
          type: ["string", "null"]
          maxLength: 500
        amount:
          # Positive by contract: direction lives in `type`, not in the sign.
          # Signed bank exports are normalised CLIENT-side (statementParser)
          # before they reach this schema.
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999
        currency:
          type: string
          minLength: 3
          maxLength: 3
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: ["integer", "null"]
        vatAmount:
          type: ["number", "null"]
          minimum: 0
        vatRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        notes:
          type: ["string", "null"]
          maxLength: 1000
        source:
          type: ["string", "null"]

    TransactionUpdate:
      type: object
      properties:
        categoryId:
          type: ["integer", "null"]
        # Same bounds as TransactionCreate — the two paths must not disagree
        # about the invariant (audit 2026-08-20, MED). The invariant itself
        # lives in a DB CHECK (migration 0056); these bounds are the contract
        # stating it to clients.
        vatAmount:
          type: ["number", "null"]
          minimum: 0
        vatRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        taxTreatment:
          description: |
            M16.3.1 — per-row VAT-treatment override (the export-sale case, or
            correcting an assumed default). Setting a non-'S' value clears the
            row's VAT (Z/E/O rows carry zero VAT and say why); setting 'S' on a
            row with no VAT extracts it from the gross amount at 15%. null
            returns the row to honest-unknown.
          type: ["string", "null"]
          enum: [S, Z, E, O, null]
        vatBasis:
          description: |
            Flaw #6 — the human's answer to "did this payment actually carry
            VAT?". Anything other than `charged` clears the row's VAT; setting
            `charged` on a standard-rated row re-extracts it from the gross.
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        transferDirection:
          description: |
            B5 — where a transfer went. `own_account` = between accounts of this
            business (business cash unchanged, so the ledger is right to be
            silent); `external` = it left the business (cash fell, and the
            ledger is understating it). `null` means NOT DECLARED — never
            "external". Only a transfer may carry it.
          type: ["string", "null"]
          enum: [own_account, external, null]
        counterpartyBankAccountId:
          description: |
            The destination account, when it is one this product tracks.
            Optional even for `own_account` — the other account may not be in
            the system, and requiring it would block the tenant from declaring
            the fact that matters.
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]

    TransactionUpload:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TransactionInput"
        autoCategrize:
          type: ["boolean", "null"]
        bankAccountId:
          description: |
            M16.2 — which bank account this statement belongs to. Scopes
            duplicate detection to the account and is the foundation for
            transfer-leg pairing. Validated against the tenant's own accounts.
          type: ["integer", "null"]

    UploadResult:
      type: object
      required: [inserted, categorized, errors]
      properties:
        inserted:
          type: integer
        categorized:
          type: integer
        # M15: rows skipped because an IDENTICAL row (date+description+amount+
        # type) already exists — re-uploading a statement must not double every
        # tax figure. Reported, never silent.
        duplicatesSkipped:
          type: integer
        # 🔴 Audit finding #10: the COUNT alone conflated two different events —
        # "you re-uploaded a statement" (housekeeping) and "your business
        # genuinely paid the same amount twice today" (lost money, invisible).
        # The skipped rows are returned so the second case can be seen and
        # re-entered.
        duplicates:
          type: array
          items:
            type: object
            required: [date, description, amount]
            properties:
              date: { type: string }
              description: { type: string }
              amount: { type: number }
        errors:
          type: array
          items:
            type: string

    CategorizationRequest:
      type: object
      properties:
        transactionIds:
          type: ["array", "null"]
          items:
            type: integer
        overrideExisting:
          type: ["boolean", "null"]

    CategorizationResult:
      type: object
      required: [processed, categorized, skipped]
      properties:
        processed:
          type: integer
        categorized:
          type: integer
        skipped:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/CategorizationResultItem"

    CategorizationResultItem:
      type: object
      required: [transactionId, categoryId, categoryName, confidence]
      properties:
        transactionId:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
        confidence:
          type: number
        matchedRule:
          type: ["string", "null"]

    FinancialSummary:
      type: object
      required:
        - totalIncome
        - totalExpenses
        - netPosition
        - totalVatCollected
        - totalVatPaid
        - netVat
        - transactionCount
        - uncategorizedCount
      properties:
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netPosition:
          type: number
        totalVatCollected:
          type: number
        totalVatPaid:
          type: number
        netVat:
          type: number
        transactionCount:
          type: integer
        uncategorizedCount:
          type: integer

    VatReturn:
      type: object
      required:
        [period, salesSection, purchasesSection, netVatDue, vatPayable, vatRefund, invoiceCount, billCount]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string }
            to: { type: string }
        salesSection:
          $ref: "#/components/schemas/VatReturnSalesSection"
        purchasesSection:
          $ref: "#/components/schemas/VatReturnPurchasesSection"
        netVatDue:
          type: number
        vatPayable:
          type: number
        vatRefund:
          type: number
        invoiceCount:
          type: integer
        billCount:
          type: integer

    VatReturnSalesSection:
      type: object
      required:
        [
          box1_standardRatedDomesticSales,
          box2_zeroRatedDomesticSales,
          box3_exemptSales,
          box4_exportSales,
          box5_totalSales,
          box6_vatOnStandardRatedSales,
          box7_vatAdjustments,
          box8_totalOutputVat,
        ]
      properties:
        box1_standardRatedDomesticSales: { type: number }
        box2_zeroRatedDomesticSales: { type: number }
        box3_exemptSales: { type: number }
        box4_exportSales: { type: number }
        box5_totalSales: { type: number }
        box6_vatOnStandardRatedSales: { type: number }
        box7_vatAdjustments: { type: number }
        box8_totalOutputVat: { type: number }

    VatReturnPurchasesSection:
      type: object
      required:
        [
          box9_standardRatedPurchases,
          box10_zeroRatedPurchases,
          box11_exemptPurchases,
          box12_totalPurchases,
          box13_recoverableInputVat,
          box14_inputVatAdjustments,
          box15_totalInputVat,
        ]
      properties:
        box9_standardRatedPurchases: { type: number }
        box10_zeroRatedPurchases: { type: number }
        box11_exemptPurchases: { type: number }
        box12_totalPurchases: { type: number }
        box13_recoverableInputVat: { type: number }
        box14_inputVatAdjustments: { type: number }
        box15_totalInputVat: { type: number }

    VatSummary:
      type: object
      required: [vatCollected, vatPaid, vatBlocked, netVatPosition, vatRate, transactions]
      properties:
        vatCollected:
          type: number
        vatPaid:
          type: number
          description: >
            The recoverable-input-VAT ESTIMATE. Excludes VAT paid on Art.
            50-blocked expenditure classes (entertainment, catering) — that
            amount is `vatBlocked`, not silently dropped (C9).
        vatBlocked:
          type: number
          description: >
            VAT actually paid on expenditure whose input VAT is not
            deductible (VAT Implementing Regulations Art. 50 — e.g. catering,
            entertainment). A real cost, never a recoverable amount.
        netVatPosition:
          type: number
        vatRate:
          type: number
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/VatTransaction"

    VatTransaction:
      type: object
      required: [id, date, description, amount, vatAmount, type]
      properties:
        id:
          type: integer
        date:
          type: string
        description:
          type: string
        amount:
          type: number
        vatAmount:
          type: number
        type:
          type: string

    CategoryBreakdown:
      type: object
      required: [categoryId, categoryName, categoryNameAr, type, total, count, vatTotal]
      properties:
        categoryId:
          type: integer
        categoryName:
          type: string
        categoryNameAr:
          type: string
        type:
          type: string
        total:
          type: number
        count:
          type: integer
        vatTotal:
          type: number

    JournalEntryLine:
      type: object
      required: [id, journalEntryId, accountName, debitAmount, creditAmount]
      properties:
        id:
          type: integer
        journalEntryId:
          type: integer
        accountId:
          type: ["integer", "null"]
        accountName:
          type: string
        description:
          type: ["string", "null"]
        debitAmount:
          type: number
        creditAmount:
          type: number

    JournalEntry:
      type: object
      required:
        - id
        - entryNumber
        - date
        - description
        - status
        - createdAt
        - totalDebit
        - totalCredit
        - lines
      properties:
        id:
          type: integer
        entryNumber:
          type: string
        date:
          type: string
        description:
          type: string
        reference:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, posted, reversed]
        reversalOf:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        postedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        totalDebit:
          type: number
        totalCredit:
          type: number
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntryLine"

    BillItem:
      type: object
      required: [id, billId, description, quantity, unitPrice, vatAmount, total]
      properties:
        id:
          type: integer
        billId:
          type: integer
        productId:
          type: ["integer", "null"]
        description:
          type: string
        descriptionAr:
          type: ["string", "null"]
        quantity:
          type: number
        unitPrice:
          type: number
        vatRate:
          type: number
        vatAmount:
          type: number
        total:
          type: number

    Bill:
      type: object
      required:
        - id
        - billNumber
        - date
        - status
        - subtotal
        - vatAmount
        - total
        - paidAmount
        - createdAt
        - items
      properties:
        id:
          type: integer
        billNumber:
          type: string
        vendorReference:
          type: ["string", "null"]
        date:
          type: string
        dueDate:
          type: ["string", "null"]
        vendorId:
          type: ["integer", "null"]
        vendorName:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, submitted, received, approved, paid, overdue]
        subtotal:
          type: number
        vatAmount:
          type: number
        total:
          type: number
        currency:
          type: ["string", "null"]
        paidAmount:
          type: number
        paidAt:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BillItem"

    BillApproveInput:
      type: object
      description: Optional post options when approving a bill.
      properties:
        debitAccount:
          type: ["string", "null"]
          description: Expense/debit account name for the GL entry.
        force:
          type: ["boolean", "null"]
          description: Override totals-mismatch and invalid-VAT-number rejections.
        captureId:
          type: ["string", "null"]
          description: >
            A1 — the staged captured document this bill was posted from. Links
            the bill to its source photograph atomically with the posting; the
            promotion job then moves the bytes into the immutable archive.

    QuotationItem:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        id: { type: integer }
        productId: { type: integer, nullable: true }
        description: { type: string }
        descriptionAr: { type: string }
        quantity: { type: number }
        unitPrice:
          type: number
          description: >
            The QUOTED price. Conversion copies this value and never re-reads
            the product's current price.
        vatRate: { type: number }
        vatAmount: { type: number }
        discount: { type: number }
        total: { type: number }
        taxCategoryCode:
          type: string
          nullable: true
          description: >
            S/Z/E/O. NULL for a 0% line - zero-rated, exempt and out-of-scope
            are different tax facts an amount cannot distinguish. A quotation
            never fails closed on this; the tax gate is at invoice creation.
        unitCode: { type: string }
        convertedQuantity:
          type: number
          description: How much of this line has become an invoice (M21.2).
        remainingQuantity: { type: number }

    Quotation:
      type: object
      properties:
        id: { type: integer }
        quotationNumber: { type: string }
        date: { type: string }
        validUntil: { type: string, nullable: true }
        customerId: { type: integer, nullable: true }
        customerName: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, submitted, approved]
          description: The APPROVAL axis only.
        outcome:
          type: string
          nullable: true
          enum: [declined, closed]
          description: >
            A terminal act by the TENANT. NULL means live, and NULL is a
            first-class state - the platform never decides a remainder is dead.
        conversionState:
          type: string
          enum: [open, partially_converted, converted]
          description: >
            DERIVED from line quantities, never stored. Kept separate from
            status because a quotation can be approved AND partly converted at
            the same time.
        expired:
          type: boolean
          description: >
            validUntil has passed. A fact to warn on, NOT a block - a customer
            accepting a lapsed quotation is a commercial decision.
        subtotal: { type: number }
        vatAmount: { type: number }
        discount: { type: number }
        total: { type: number }
        currency: { type: string }
        notes: { type: string, nullable: true }
        termsAndConditions: { type: string, nullable: true }
        reviewNote: { type: string, nullable: true }
        createdAt: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotationItem"

    CreateQuotationInput:
      type: object
      required: [items]
      properties:
        date: { type: string }
        validUntil: { type: string }
        customerId: { type: integer }
        currency: { type: string }
        discount: { type: number }
        notes: { type: string }
        termsAndConditions: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuotationItem"

    UpdateQuotationInput:
      type: object
      properties:
        date: { type: string }
        validUntil: { type: string }
        customerId: { type: integer }
        currency: { type: string }
        discount: { type: number }
        notes: { type: string }
        termsAndConditions: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotationItem"

    ConvertQuotationLine:
      type: object
      required: [quotationItemId, quantity]
      properties:
        quotationItemId: { type: integer }
        quantity:
          type: number
          description: Must be greater than zero and at most what remains.

    ConvertQuotationInput:
      type: object
      properties:
        lines:
          type: array
          description: >
            Omit entirely to convert everything still outstanding. Supplying an
            empty array is an error rather than a no-op.
          items:
            $ref: "#/components/schemas/ConvertQuotationLine"
        date:
          type: string
          description: The invoice's accounting date. Defaults to today.
        dueDate: { type: string }
        convertedOn:
          type: string
          description: >
            The date the customer ACCEPTED, which may precede the invoice date.
            Defaults to the invoice date.
        invoiceNumber:
          type: string
          description: Optional override; otherwise allocated server-side.
        notes: { type: string }

    QuotationConversion:
      type: object
      properties:
        id: { type: integer }
        convertedOn: { type: string }
        invoiceId: { type: integer }
        invoiceNumber: { type: string, nullable: true }
        invoiceStatus: { type: string, nullable: true }
        invoiceTotal: { type: number, nullable: true }

    QuotationConversionResult:
      type: object
      properties:
        conversion:
          type: object
          properties:
            id: { type: integer }
            convertedOn: { type: string }
        invoice:
          $ref: "#/components/schemas/Invoice"

    PurchaseOrderPriceVariance:
      type: object
      description: >
        One event where the supplier's price differed from the ordered price.
        Reported as a neutral fact with BOTH figures - never as a status
        colour, because whether a variance is acceptable is a judgment.
      properties:
        orderedUnitPrice: { type: number }
        billedUnitPrice: { type: number }
        quantity: { type: number }
        billedOn: { type: string }
        difference:
          type: number
          description: billed minus ordered, per unit. Positive = charged more.

    PurchaseOrderItem:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        id: { type: integer }
        productId: { type: integer, nullable: true }
        description: { type: string }
        descriptionAr: { type: string }
        quantity: { type: number }
        unitPrice:
          type: number
          description: >
            The price we ORDERED at. Unlike a quotation, this does not bind the
            supplier - their bill may say something else, and that difference
            is recorded rather than refused.
        vatRate: { type: number }
        vatAmount: { type: number }
        total: { type: number }
        unitCode: { type: string }
        billedQuantity:
          type: number
          description: >
            How much of this line the supplier has BILLED. NOT how much
            arrived - there is no goods-receipt concept.
        unbilledQuantity:
          type: number
          description: quantity minus billedQuantity. Un-billed, not "outstanding".
        priceVariances:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderPriceVariance"

    PurchaseOrder:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        date: { type: string }
        validUntil: { type: string, nullable: true }
        vendorId: { type: integer, nullable: true }
        vendorName: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, submitted, approved]
          description: The APPROVAL axis only.
        outcome:
          type: string
          nullable: true
          enum: [cancelled, closed]
          description: >
            A terminal act by the TENANT. `cancelled` (we withdrew it), never
            "declined" - we cannot know whether a supplier refused. NULL means
            live, and NULL is a first-class state.
        billingState:
          type: string
          enum: [open, partially_billed, fully_billed]
          description: >
            DERIVED from line quantities, never stored. BILLING, not delivery.
        expired: { type: boolean }
        subtotal: { type: number }
        vatAmount: { type: number }
        total: { type: number }
        currency: { type: string }
        notes: { type: string, nullable: true }
        reviewNote: { type: string, nullable: true }
        createdAt: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"

    CreatePurchaseOrderInput:
      type: object
      required: [items]
      properties:
        date: { type: string }
        validUntil: { type: string }
        vendorId: { type: integer }
        currency: { type: string }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"

    ConvertPurchaseOrderLine:
      type: object
      required: [purchaseOrderItemId, quantity]
      properties:
        purchaseOrderItemId: { type: integer }
        quantity: { type: number }
        unitPrice:
          type: number
          description: >
            What the supplier ACTUALLY charged. Omit to accept the ordered
            price. A different figure is not an error.

    UnorderedBillLine:
      type: object
      required: [description, quantity, unitPrice]
      description: >
        A line on the supplier's bill that was never on the order - freight, a
        surcharge, a substituted part. Allowed, and identifiable afterwards
        because it has no conversion row against any order line.
      properties:
        description: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        vatRate: { type: number }

    ConvertPurchaseOrderInput:
      type: object
      properties:
        lines:
          type: array
          description: Omit entirely to bill everything not yet billed.
          items:
            $ref: "#/components/schemas/ConvertPurchaseOrderLine"
        unorderedLines:
          type: array
          items:
            $ref: "#/components/schemas/UnorderedBillLine"
        date: { type: string }
        dueDate: { type: string }
        vendorReference:
          type: string
          description: The supplier's own bill number. Wins over an allocated one.
        billNumber: { type: string }
        notes: { type: string }
        allowOverBilling:
          type: boolean
          description: >
            Record a bill for MORE than the order allows. Refused by default -
            that is the case where the supplier may be wrong and a human should
            look - but possible, because refusing outright would mean refusing
            to record a real liability.

    PurchaseOrderConversion:
      type: object
      properties:
        id: { type: integer }
        billedOn: { type: string }
        billId: { type: integer }
        billNumber: { type: string, nullable: true }
        billStatus: { type: string, nullable: true }
        billTotal: { type: number, nullable: true }

    PurchaseOrderConversionResult:
      type: object
      properties:
        conversion:
          type: object
          properties:
            id: { type: integer }
            billedOn: { type: string }
        bill:
          $ref: "#/components/schemas/Bill"

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        userId: { type: integer, nullable: true }
        actorName:
          type: string
          nullable: true
          description: >
            Resolved through the identity layer, scoped to THIS org's
            memberships - a userId with no membership here stays null (the UI
            shows "User #id"), never a name from another tenant.
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        beforeState: { nullable: true }
        afterState: { nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string }

    AuditLogPage:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"

    Finding:
      type: object
      required: [id, kind, refKey, facts, status, firstSeenAt, lastSeenAt]
      properties:
        id: { type: integer }
        companyId: { type: ["string", "null"] }
        kind:
          type: string
          description: >
            duplicate_bill | duplicate_transaction | invoice_number_gap |
            overdue_receivable | overdue_payable | stale_draft |
            undeclared_transfer | unposted_transaction. Free-form by design -
            the vocabulary is service-owned and grows with the checks.
        refKey: { type: string }
        facts:
          type: object
          additionalProperties: true
          description: Per-kind numbers and names the UI renders. No severity anywhere - a finding is a kind plus facts, rendered in words.
        status: { type: string, enum: [open, acknowledged, resolved] }
        firstSeenAt: { type: string }
        lastSeenAt: { type: string }
        acknowledgedAt: { type: ["string", "null"] }
        acknowledgedBy: { type: ["integer", "null"] }
        acknowledgedByName: { type: ["string", "null"] }
        resolvedAt: { type: ["string", "null"] }
        explanation:
          type: ["object", "null"]
          description: >
            AI-3b - model phrasing OF the facts, verified to introduce
            nothing the facts do not carry, returned only while current
            against the facts. NULL is the deterministic floor (model
            unavailable, output rejected, low-context refusal, or facts
            refreshed since generation).
          properties:
            en: { type: string }
            ar: { type: string }
            generatedAt: { type: string }

    FindingsPage:
      type: object
      required: [findings, counts]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        counts:
          type: object
          required: [open, acknowledged, resolved]
          properties:
            open: { type: integer }
            acknowledged: { type: integer }
            resolved: { type: integer }

    AskInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }

    AskResult:
      type: object
      required: [refused, refusalReason, toolUsed, answer]
      properties:
        refused: { type: boolean }
        refusalReason: { type: ["string", "null"] }
        toolUsed: { type: ["string", "null"] }
        answer:
          type: ["object", "null"]
          properties:
            en: { type: string }
            ar: { type: string }

    GroundedAnswersPage:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [id, question, refused, createdAt]
            properties:
              id: { type: integer }
              question: { type: string }
              toolUsed: { type: ["string", "null"] }
              answer:
                type: ["object", "null"]
                properties:
                  en: { type: string }
                  ar: { type: string }
              refused: { type: boolean }
              refusalReason: { type: ["string", "null"] }
              createdAt: { type: string }

    FindingsScheduleInput:
      type: object
      required: [cadence]
      properties:
        cadence: { type: string, enum: [quarterly, monthly] }

    FindingsStatus:
      type: object
      required: [cadence, lastScheduledRun, escalated]
      properties:
        cadence: { type: string, enum: [quarterly, monthly] }
        lastScheduledRun:
          type: ["object", "null"]
          properties:
            periodKey: { type: ["string", "null"] }
            ranAt: { type: string }
            openAfter: { type: integer }
            emailedAt: { type: ["string", "null"] }
            emailedCount: { type: ["integer", "null"] }
            viewedAt: { type: ["string", "null"] }
        escalated:
          type: boolean
          description: >
            True when the last scheduled run has open findings nobody viewed
            for longer than the escalation interval. Renders as the
            persistent Dashboard marker; opening the Findings page is the
            dismissal.

    FindingsRunResult:
      type: object
      required: [created, reopened, refreshed, resolved, open]
      properties:
        created: { type: integer }
        reopened: { type: integer }
        refreshed: { type: integer }
        resolved: { type: integer }
        open: { type: integer, description: Total open after the run. }

    RecurringRule:
      type: object
      required: [id, entity, frequency, dayOfMonth, startsOn, nextRunOn, status]
      properties:
        id: { type: string }
        entity: { type: string, enum: [invoice, bill] }
        template:
          type: ["object", "null"]
          additionalProperties: true
        frequency: { type: string, enum: [monthly, quarterly, yearly] }
        dayOfMonth: { type: integer }
        startsOn: { type: string }
        endsOn: { type: ["string", "null"] }
        nextRunOn: { type: string }
        autoIssue: { type: boolean }
        status: { type: string, enum: [active, paused] }
        createdAt: { type: ["string", "null"] }
        # ── Rule health (A3 follow-up, 2026-08-23) ──────────────────────────
        # One failure and a streak are different signals: one failed run is a
        # blip; N consecutive means a customer has not been billed for N
        # periods and nobody noticed. The list carries both so the UI can say
        # which — "last run: failed" alone hides the answer.
        lastOutcome: { type: ["string", "null"], description: "generated | failed | null (never run)" }
        lastScheduledFor: { type: ["string", "null"] }
        lastErrorCode: { type: ["string", "null"] }
        lastErrorDetail: { type: ["string", "null"] }
        consecutiveFailures: { type: integer }
        lastSuccessOn: { type: ["string", "null"] }

    CreateRecurringRuleInput:
      type: object
      required: [entity, template, frequency, dayOfMonth, startsOn]
      properties:
        entity: { type: string, enum: [invoice, bill] }
        template:
          type: object
          additionalProperties: true
          description: The document body this rule repeats (an invoice/bill create payload).
        frequency: { type: string, enum: [monthly, quarterly, yearly] }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        startsOn: { type: string }
        endsOn: { type: ["string", "null"] }
        autoIssue:
          type: ["boolean", "null"]
          description: v1 refuses true — a rule creates drafts only.

    RecurringRun:
      type: object
      required: [id, scheduledFor, outcome]
      properties:
        id: { type: string }
        scheduledFor: { type: string }
        outcome:
          description: "generated (a draft exists) | failed. Failure detail in errorCode."
          type: string
        documentId: { type: ["integer", "null"] }
        errorCode: { type: ["string", "null"] }
        errorDetail: { type: ["string", "null"] }
        ranAt: { type: ["string", "null"] }

    CaptureUpload:
      # `format: binary` deliberately omitted: the generated zod package is
      # Node-side (no File/Blob types). Fields: document (the image file,
      # required), source (qr|ocr|manual), qrPayload (base64 TLV), extraction +
      # fieldSources (JSON-encoded strings). The UI sends FormData via
      # apiFetch, not a generated hook.
      type: object
      additionalProperties: true

    CaptureResult:
      type: object
      required: [captureId, signatureStatus]
      properties:
        captureId: { type: string }
        signatureStatus:
          description: "ZATCA QR signature verdict: verified | failed | unsigned | not_applicable."
          type: string
        signatureDetail: { type: ["string", "null"] }
        signatureFailed: { type: boolean }

    CapturedDocument:
      type: object
      required: [id, status, source]
      properties:
        id: { type: string }
        status: { type: string }
        source: { type: string, enum: [qr, ocr, manual] }
        extraction:
          description: The parsed fields as uploaded — the review page resumes from this.
          type: ["object", "null"]
          additionalProperties: true
        fieldSources:
          type: ["object", "null"]
          additionalProperties: true
        signatureStatus: { type: ["string", "null"] }

    SendBackInput:
      type: object
      description: Optional reviewer note when sending a submitted record back.
      properties:
        note:
          type: ["string", "null"]

    InvoiceItem:
      type: object
      required: [id, invoiceId, description, quantity, unitPrice, vatAmount, total]
      properties:
        id:
          type: integer
        invoiceId:
          type: integer
        productId:
          type: ["integer", "null"]
        description:
          type: string
        descriptionAr:
          type: ["string", "null"]
        quantity:
          type: number
        unitPrice:
          type: number
        vatRate:
          type: number
        vatAmount:
          type: number
        discount:
          type: number
        total:
          type: number

    Invoice:
      type: object
      required:
        - id
        - invoiceNumber
        - date
        - status
        - subtotal
        - vatAmount
        - total
        - paidAmount
        - createdAt
        - items
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        date:
          type: string
        dueDate:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, submitted, sent, paid, overdue, cancelled]
        subtotal:
          type: number
        vatAmount:
          type: number
        discount:
          type: number
        total:
          type: number
        currency:
          type: ["string", "null"]
        paidAmount:
          type: number
        paidAt:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        invoiceHash:
          type: ["string", "null"]
          description: ZATCA hash-chain link; null until the invoice is approved.
        previousHash:
          type: ["string", "null"]
        qrCode:
          type: ["string", "null"]
          description: ZATCA Phase-1 QR (base64 TLV); null until approved.
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"

    PayrollRun:
      type: object
      required:
        - id
        - period
        - status
        - totalNetPay
        - createdAt
      properties:
        id:
          type: integer
        period:
          type: string
        status:
          type: string
          enum: [draft, submitted, approved, paid]
        totalBasicSalary:
          type: number
        totalAllowances:
          type: number
        totalGosiEmployee:
          type: number
        totalGosiEmployer:
          type: number
        totalDeductions:
          type: number
        totalNetPay:
          type: number
        processedAt:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
