openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Saudi Bookkeeping Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Transaction management
  - name: categories
    description: Category management
  - name: categorize
    description: Categorization engine
  - name: summary
    description: Financial summaries and reports
  - name: journal_entries
    description: Journal entries and the draft/approval workflow
  - name: bills
    description: Vendor bills (AP) and the draft/approval workflow
  - name: invoices
    description: Customer invoices (AR, ZATCA) and the draft/approval workflow
  - name: payroll
    description: Payroll runs and the draft/approval workflow
  - name: period_locks
    description: Closing and reopening accounting periods
  - name: finance_hub
    description: The Finance Hub control surface
  - name: analytics
    description: Trends and decomposition
  - name: budgets
    description: Annual budget vs actual

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /deployment:
    get:
      operationId: getDeploymentBanner
      tags: [health]
      summary: What kind of deployment is this
      description: >
        PUBLIC and unauthenticated on purpose: the demo banner has to appear on
        the LOGIN page, before anyone has a session. Server-driven so the claim
        cannot drift from the deployment that makes it — a banner compiled into
        the frontend would keep saying "demo" on a build promoted elsewhere.
      responses:
        "200":
          description: Deployment descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBanner"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      parameters:
        - name: category_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: is_manually_overridden
          in: query
          schema:
            type: ["boolean", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: [debit, credit, null]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"

    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a single transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/review:
    get:
      operationId: getPendingReviewTransactions
      tags: [transactions]
      summary: Pending imported transactions — the holding-area review surface (M15)
      responses:
        "200":
          description: Pending rows, flagged where a human must look
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingReviewTransaction"

  /transactions/review/accept:
    post:
      operationId: acceptPendingTransactions
      tags: [transactions]
      summary: Accept pending transactions (bulk-safe subset, or named ids)
      description: |
        With `ids`: deliberate, named acceptance of any pending rows. Without:
        bulk mode — the server restricts it to rows safe to accept unread
        (categorized or confidently-classified transfers at/above the
        confidence threshold, or manually categorized). needsAttention rows are
        NEVER swept in by bulk mode.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptPendingInput"
      responses:
        "200":
          description: How many rows were accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptPendingResult"

  /transactions/{id}/settle:
    post:
      operationId: settleTransaction
      tags: [transactions]
      summary: >
        Accept a pending transaction as the SETTLEMENT of an existing invoice or
        bill (M16.3). One act — accepting the match IS the review: the row
        leaves the holding area AND the payment is recorded through the
        existing pay path (Dr Cash / Cr AR, or Dr AP / Cr Cash). Never
        automatic — a human names the document, however exact the match.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleTransactionInput"
      responses:
        "200":
          description: The settled transaction (kind=settlement, linked, accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /capture:
    post:
      operationId: captureDocument
      tags: [capture]
      summary: >
        Stage a photographed supplier document (A1). The bytes go to DELETABLE
        staging — they become immutable evidence only when posted to a bill
        (BillApproveInput.captureId), after which the promotion job archives
        them.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CaptureUpload"
      responses:
        "201":
          description: The staged capture, with the server-side signature verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"

  /capture/{id}:
    get:
      operationId: getCapturedDocument
      tags: [capture]
      summary: Resume a review from a staged capture (survives a page refresh).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The staged capture's metadata and extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturedDocument"

  /capture/{id}/discard:
    post:
      operationId: discardCapturedDocument
      tags: [capture]
      summary: Abandon a staged capture; the purge job removes its bytes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Discarded

  /recurring:
    get:
      operationId: listRecurringRules
      tags: [recurring]
      summary: List recurring document rules (A3)
      responses:
        "200":
          description: The tenant's recurring rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringRule"
    post:
      operationId: createRecurringRule
      tags: [recurring]
      summary: >
        Create a recurring rule (A3). v1 generates DRAFTS ONLY — a rule never
        issues; the draft it produces needs an approver exactly as if typed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringRuleInput"
      responses:
        "201":
          description: The created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}/runs:
    get:
      operationId: getRecurringRuleRuns
      tags: [recurring]
      summary: >
        The rule's run history — "did my rent invoice go out?". Failed runs
        (period_locked, generation_failed) are first-class rows here: silence
        is not a neutral outcome.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringRun"

  /recurring/{id}/pause:
    post:
      operationId: pauseRecurringRule
      tags: [recurring]
      summary: Pause a rule (audited — silently stopping a customer's billing is a real question later)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The paused rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}/resume:
    post:
      operationId: resumeRecurringRule
      tags: [recurring]
      summary: Resume a paused rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The resumed rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}:
    delete:
      operationId: deleteRecurringRule
      tags: [recurring]
      summary: Delete a rule (its run history cascades; generated documents are untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /transactions/upload:
    post:
      operationId: uploadTransactions
      tags: [transactions]
      summary: Upload transactions from CSV or JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpload"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction (manual override)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categorize:
    post:
      operationId: runCategorization
      tags: [categorize]
      summary: Run the categorization engine on uncategorized transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategorizationRequest"
      responses:
        "200":
          description: Categorization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizationResult"

  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: >
        Budget vs actual for one ANNUAL period (M19.5). `period` is a YYYY
        string — budgets are annual by decision, not by omission: see
        design-analytics.md §7. Actuals are signed by account type (M19.0), so a
        refund reduces spend rather than adding to it.
      parameters:
        - { name: period, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: One row per budgeted category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLine"

  /analytics/trend:
    get:
      operationId: getTrend
      tags: [analytics]
      summary: >
        Liquidity and solvency per month end (M19.1). Each point carries its own
        `claimable` — the Finance Hub withholding propagates PER POINT, since a
        blocker is a fact about a moment and an earlier month may be clean.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: One point per month, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  /analytics/decomposition:
    get:
      operationId: getDecomposition
      tags: [analytics]
      summary: >
        WHERE a change came from (M19.2) — ranked contributors between a window
        and the equal-length window before it. Never why.
      parameters:
        - { name: dimension, in: query, required: true, schema: { type: string, enum: [category, customer, vendor] } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ranked contributors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decomposition"

  /finance-hub/liquidity:
    get:
      operationId: getLiquidity
      tags: [finance_hub]
      summary: >
        "Can I pay what I owe?" (M18.3) — current/quick assets, current
        liabilities, working capital and the two ratios, from the GL.
      parameters:
        - name: as_of
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: The liquidity position, and whether it may be claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liquidity"

  /finance-hub/tax-compliance:
    get:
      operationId: getTaxCompliance
      tags: [finance_hub]
      summary: >
        Tax & Compliance state (M18.5) — the VAT position for the CURRENT
        CALENDAR QUARTER and ZATCA connection state. The quarter is ours, not
        theirs: KSA filing frequency is not modelled, so this must never be
        presented as "your VAT return".
      responses:
        "200":
          description: VAT position and ZATCA state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxCompliance"

  /finance-hub/books-status:
    get:
      operationId: getBooksStatus
      tags: [finance_hub]
      summary: >
        "Are my books current?" — the unreviewed-transaction signal, mirrored
        from the Banking review surface rather than duplicated (design Q7).
      responses:
        "200":
          description: Counts only; the work happens on /review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksStatus"

  /period-locks:
    get:
      operationId: listPeriodLocks
      tags: [period_locks]
      summary: >
        Accounting periods this company has closed (M18.4). Readable by every
        role; only an organization admin may close or reopen one.
      responses:
        "200":
          description: Closed periods, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeriodLock"
    post:
      operationId: lockPeriod
      tags: [period_locks]
      summary: >
        Close an accounting period. Nothing may afterwards be posted into it —
        a correction posts in the current open period instead, never re-dated
        backwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodLockInput"
      responses:
        "201":
          description: The period is now closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodLock"

  /period-locks/{period}:
    delete:
      operationId: unlockPeriod
      tags: [period_locks]
      summary: >
        Reopen a closed period (admin only). Company-scoped — reopening one
        company's period leaves every other company's locks untouched.
      parameters:
        - name: period
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reopened

  /companies/current/fiscal-years:
    get:
      operationId: listFiscalYears
      tags: [companies]
      summary: >
        The active company's fiscal years, resolved to real date ranges (M17.2).
        The production consumer `companies.fiscal_year_start` never had — it was
        stored from M11.6 and applied by nothing until now.
      responses:
        "200":
          description: The current fiscal period plus a window either side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalYears"

  /companies/current:
    get:
      operationId: getCurrentCompany
      tags: [companies]
      summary: Get the active company's profile (legal identity + address)
      responses:
        "200":
          description: The active company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCurrentCompany
      tags: [companies]
      summary: Update the active company's profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyInput"
      responses:
        "200":
          description: The updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /zatca/onboarding:
    get:
      operationId: getZatcaOnboardingStatus
      tags: [zatca]
      summary: ZATCA onboarding prerequisites and current certificate status
      responses:
        "200":
          description: Prerequisite checklist plus the active certificate, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZatcaOnboardingStatus"
    post:
      operationId: onboardZatca
      tags: [zatca]
      summary: >-
        Run ZATCA onboarding (CSR -> compliance CSID -> six compliance documents
        -> production CSID). The OTP is generated by the tenant in their own
        Fatoora portal and is never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZatcaOnboardInput"
      responses:
        "200":
          description: >-
            The compliance results. `activated` is false when any document was
            rejected — the certificate is NOT stored in that case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZatcaOnboardResult"

  /summary:
    get:
      operationId: getSummary
      tags: [summary]
      summary: Get full financial summary
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  /summary/vat:
    get:
      operationId: getVatSummary
      tags: [summary]
      summary: Get VAT summary
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: VAT summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VatSummary"

  # `/summary/zakat` was REMOVED in M17.0. It summed transactions flagged
  # `is_zakat_relevant` — a flag only one categorization rule ever wrote — so it
  # returned a computed-looking SAR 0.00 for almost every tenant, against a
  # nisab threshold hardcoded from a 2024 gold price. Zakat returns in M17.4 as
  # a GL-derived working paper, not a summary endpoint.
  # See docs/product/design-zakat-module.md.

  /summary/by-category:
    get:
      operationId: getSummaryByCategory
      tags: [summary]
      summary: Get spending and income totals grouped by category
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Per-category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

  /reports/vat-return:
    get:
      operationId: getVatReturn
      tags: [reports]
      summary: Get the VAT return (filing view, from invoices and bills)
      description: |
        The FILING source (M16.1 / design Q0): computed from invoices and
        bills — the legal documents — with per-line tax treatment (M12.1a) and
        credit-note direction (M12.1b) applied. The transaction-derived
        `/summary/vat` figure is the RECONCILIATION view beside this, never the
        filing source.
      parameters:
        - name: period_from
          in: query
          description: "Filing period start, YYYY-MM"
          schema:
            type: ["string", "null"]
            pattern: "^\\d{4}-\\d{2}$"
        - name: period_to
          in: query
          description: "Filing period end, YYYY-MM"
          schema:
            type: ["string", "null"]
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Box-structured VAT return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VatReturn"

  /journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [journal_entries]
      summary: Approve a draft journal entry (posts it to the general ledger)
      description: >
        Draft/approval workflow (M10.2). Approving a draft (pending) journal
        entry fires its activation path — the period-lock check and the
        post-to-GL transition — so it becomes active in the ledger. Only an
        approver (admin/accountant) may call this; a bookkeeper is denied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (posted) journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The journal entry is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /journal-entries/{id}/reject:
    post:
      operationId: rejectJournalEntry
      tags: [journal_entries]
      summary: Reject a pending draft journal entry (hard-deletes it)
      description: >
        Draft/approval workflow (M10.2). Rejecting a pending draft hard-deletes
        it — there is no archive of rejected drafts. Only a pending draft can be
        rejected; a posted/reversed entry must be reversed instead. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The draft was rejected and removed
        "404":
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a pending draft can be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/submit:
    post:
      operationId: submitBill
      tags: [bills]
      summary: Submit a draft bill into the approval queue
      description: >
        Draft/approval workflow (M10.3). Moves an editable draft bill to
        `submitted` (awaiting approval); the bill is locked to the enterer until
        approved or sent back. This is the bookkeeper's own action (create-level
        authorization), not an approver action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft bill can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/send-back:
    post:
      operationId: sendBackBill
      tags: [bills]
      summary: Send a submitted bill back to the enterer for correction
      description: >
        Draft/approval workflow (M10.3). Returns a `submitted` bill to `draft`
        with an optional reviewer note (shown to the enterer while editing). The
        enterer corrects and resubmits. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The bill, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted bill can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [bills]
      summary: Approve a bill (posts it to the general ledger)
      description: >
        Draft/approval workflow (M10.3). Approving a bill fires its activation:
        totals reconciliation, ZATCA vendor-VAT validation (both overridable with
        `force`), the period-lock check, and the Dr Purchases/Input VAT / Cr
        Accounts Payable posting. Only then does the bill affect AP/expense/VAT.
        May be approved straight from draft (self-approve) or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillApproveInput"
      responses:
        "200":
          description: The approved (posted) bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Business-rule rejection (zero total, totals mismatch, invalid VAT number)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The bill is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/reject:
    post:
      operationId: rejectBill
      tags: [bills]
      summary: Reject a non-approved bill (hard-deletes it)
      description: >
        Draft/approval workflow (M10.3). Hard-deletes a draft or submitted bill —
        no archive of rejected records. An approved bill cannot be rejected (it
        must be reversed). Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The bill was rejected and removed
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An approved bill cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/submit:
    post:
      operationId: submitInvoice
      tags: [invoices]
      summary: Submit a draft invoice into the approval queue
      description: >
        Draft/approval workflow (M10.4). Moves an editable draft invoice to
        `submitted` (awaiting approval); locked to the enterer until approved or
        sent back. Bookkeeper (create-level) action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft invoice can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/send-back:
    post:
      operationId: sendBackInvoice
      tags: [invoices]
      summary: Send a submitted invoice back to the enterer for correction
      description: >
        Draft/approval workflow (M10.4). Returns a `submitted` invoice to `draft`
        with an optional reviewer note. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The invoice, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted invoice can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/approve:
    post:
      operationId: approveInvoice
      tags: [invoices]
      summary: Approve (issue) an invoice — builds the ZATCA hash chain and posts AR
      description: >
        Draft/approval workflow (M10.4). Approving an invoice issues it: it is
        recognized in AR/revenue/VAT, and its ZATCA hash-chain link + QR are
        minted HERE (not at create), so a rejected/deleted draft never consumes a
        sequence number. May be approved straight from draft (self-approve on
        create, done automatically for approvers) or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (issued) invoice, with ZATCA hash + QR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The invoice is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/reject:
    post:
      operationId: rejectInvoice
      tags: [invoices]
      summary: Reject a non-approved invoice (hard-deletes it)
      description: >
        Draft/approval workflow (M10.4). Hard-deletes a draft or submitted invoice
        — no archive. Because a draft carries no hash-chain link, deleting it
        leaves no gap in the sequence. An issued invoice cannot be rejected (it
        must be reversed with a credit note). Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The invoice was rejected and removed
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An issued invoice cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/submit:
    post:
      operationId: submitPayrollRun
      tags: [payroll]
      summary: Submit a draft payroll run into the approval queue
      description: >
        Draft/approval workflow (M10.5). Moves a draft run to `submitted`
        (awaiting approval). Bookkeeper (create-level) action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submitted payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a draft run can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/send-back:
    post:
      operationId: sendBackPayrollRun
      tags: [payroll]
      summary: Send a submitted payroll run back to the enterer for correction
      description: >
        Draft/approval workflow (M10.5). Returns a `submitted` run to `draft` with
        an optional reviewer note. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The payroll run, returned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a submitted run can be sent back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/approve:
    post:
      operationId: approvePayrollRun
      tags: [payroll]
      summary: Approve a payroll run (posts the payroll GL entry)
      description: >
        Draft/approval workflow (M10.5). Approving a run posts its GL entry (Dr
        Salaries + Employer GOSI / Cr Net Pay + GOSI Payable) — the only ledger
        effect a run has. May be approved from draft or from the queue.
        Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved (posted) payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The payroll run is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: The accounting period is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payroll/{id}/reject:
    post:
      operationId: rejectPayrollRun
      tags: [payroll]
      summary: Reject a non-approved payroll run (hard-deletes it)
      description: >
        Draft/approval workflow (M10.5). Hard-deletes a draft or submitted run —
        no archive. An approved run cannot be rejected. Approver-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: The payroll run was rejected and removed
        "404":
          description: Payroll run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An approved run cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DeploymentBanner:
      type: object
      description: >
        `demoMode: false` on a normal deployment, and the frontend renders
        nothing. Both languages are returned together because the banner is a
        claim about the DEPLOYMENT, not a UI string — it must read identically
        whichever language the viewer has selected.
      properties:
        demoMode:
          type: boolean
        messageEn:
          type: ["string", "null"]
        messageAr:
          type: ["string", "null"]
        lastResetAt:
          type: ["string", "null"]
          format: date-time
          description: >
            When the weekly wipe last SUCCEEDED. Null means it has not run since
            this deployment started. The banner shows it because "data is wiped
            weekly" is a promise, and an unverifiable promise about data
            deletion is the kind of claim that should not be made at all.
        nextResetAt:
          type: ["string", "null"]
          format: date-time
      required:
        - demoMode

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ZatcaPrerequisite:
      type: object
      required: [key, label, satisfied, hint]
      properties:
        key: { type: string }
        label: { type: string }
        satisfied: { type: boolean }
        hint: { type: string }

    ZatcaOnboardingStatus:
      type: object
      required: [environment, prerequisites, ready, certificate]
      properties:
        environment: { type: string, enum: [sandbox, simulation, production] }
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/ZatcaPrerequisite"
        ready: { type: boolean }
        certificate:
          type: ["object", "null"]
          required: [status, notAfter, daysUntilExpiry, egsSerialNumber]
          properties:
            status: { type: string }
            notAfter: { type: ["string", "null"] }
            daysUntilExpiry: { type: ["integer", "null"] }
            egsSerialNumber: { type: ["string", "null"] }

    ZatcaOnboardInput:
      type: object
      required: [otp]
      properties:
        otp:
          type: string
          description: >-
            One-time password generated by the tenant in the Fatoora portal.
            Used once and never stored. NOTE: the ZATCA sandbox accepts ANY
            value, so a successful sandbox run proves nothing about this path.

    ZatcaComplianceDocumentResult:
      type: object
      required: [label, passed, errors, warnings]
      properties:
        label: { type: string }
        passed: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }

    ZatcaOnboardResult:
      type: object
      required: [complianceDocuments, activated]
      properties:
        complianceDocuments:
          type: array
          items:
            $ref: "#/components/schemas/ZatcaComplianceDocumentResult"
        activated: { type: boolean }

    Company:
      type: object
      description: >
        A company's legal identity. `vatNumber` and `name` are the SELLER identity
        stamped onto every issued e-invoice (ZATCA QR tags 1-2 and the invoice
        hash), so they are not cosmetic settings.
      required:
        [
          id,
          name,
          nameAr,
          crNumber,
          vatNumber,
          fiscalYearStart,
          fiscalCalendar,
          ownershipType,
          buildingNumber,
          street,
          district,
          city,
          postalCode,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        crNumber:
          type: ["string", "null"]
        vatNumber:
          type: ["string", "null"]
        fiscalYearStart:
          type: integer
          description: >
            Month the fiscal year starts, 1-12 IN `fiscalCalendar`. Under
            `gregorian` 1 = January; under `hijri` 1 = Muharram. Read the two
            fields together — the calendar changes what this number means.
          minimum: 1
          maximum: 12
        fiscalCalendar:
          type: string
          enum: [gregorian, hijri]
          description: >
            Which calendar the fiscal year is expressed in (M17.2). `hijri`
            means the Umm al-Qura (Saudi civil) calendar specifically.
        ownershipType:
          type: ["string", "null"]
          enum: [SAUDI_GCC, FOREIGN, MIXED, null]
          description: >
            Ownership structure (M17.1). NULL means NOT DECLARED and is a
            first-class state — there is no default, because defaulting would
            have the platform assert the tenant ownership nobody supplied, and
            that assertion decides whether a Zakat surface is shown. Zakat v1
            covers SAUDI_GCC only; FOREIGN/MIXED are directed to a tax advisor.
        buildingNumber:
          type: ["string", "null"]
        street:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]

    UpdateCompanyInput:
      type: object
      description: >
        Partial update. Any omitted field is left unchanged; send an empty string
        to clear an optional field.
      properties:
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        crNumber:
          type: ["string", "null"]
        vatNumber:
          type: ["string", "null"]
        fiscalYearStart:
          type: integer
          minimum: 1
          maximum: 12
        fiscalCalendar:
          type: string
          enum: [gregorian, hijri]
        ownershipType:
          type: ["string", "null"]
          enum: [SAUDI_GCC, FOREIGN, MIXED, null]
        buildingNumber:
          type: ["string", "null"]
        street:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]

    FiscalPeriod:
      type: object
      description: >
        One fiscal year resolved to concrete dates (M17.2). `label` is the year
        the period STARTS in, in the company's own calendar — a display
        convention, not a fact, which is why `startDate`, `endDate` and
        `endYear` are all returned and the UI shows the range beside the label.
      required: [label, endYear, calendar, startDate, endDate, days]
      properties:
        label:
          type: integer
          description: Year the period starts in, in the company's own calendar (AH for hijri).
        endYear:
          type: integer
          description: Year the period ends in — so a consumer may label by either end.
        calendar:
          type: string
          enum: [gregorian, hijri]
        startDate:
          type: string
          description: Inclusive, YYYY-MM-DD (Gregorian, the platform's storage format).
        endDate:
          type: string
          description: Inclusive — the day before the next fiscal year begins.
        days:
          type: integer
          description: >
            Inclusive day count: 365/366 Gregorian, 354/355 Hijri. Computed from
            the real boundaries, never assumed. It is the input to the Gregorian
            Zakat rate adjustment — but the RATE is not computed here, because
            its divisor is unverified (advisor Block C, question C3).

    FiscalYears:
      type: object
      required: [calendar, fiscalYearStart, current, periods]
      properties:
        calendar:
          type: string
          enum: [gregorian, hijri]
        fiscalYearStart:
          type: integer
          minimum: 1
          maximum: 12
        current:
          $ref: "#/components/schemas/FiscalPeriod"
        periods:
          type: array
          description: A window around the current period, newest first.
          items:
            $ref: "#/components/schemas/FiscalPeriod"

    BudgetLine:
      type: object
      required: [id, period, budgetedAmount, actualAmount, variance, variancePct]
      properties:
        id: { type: integer }
        name: { type: ["string", "null"] }
        period: { type: string, description: "YYYY — annual only." }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        categoryNameAr: { type: ["string", "null"] }
        categoryType: { type: ["string", "null"] }
        budgetedAmount: { type: number }
        actualAmount:
          type: number
          description: >
            Signed by account type (M19.0). May be NEGATIVE when refunds exceed
            spend — a real state, reported rather than clamped to zero.
        variance: { type: number }
        variancePct: { type: number }

    TrendPoint:
      type: object
      required: [period, currentAssets, quickAssets, currentLiabilities, workingCapital,
                 currentRatio, quickRatio, debtToEquity, netWorth, claimable, blockers]
      properties:
        period: { type: string }
        currentAssets: { type: number }
        quickAssets: { type: number }
        currentLiabilities: { type: number }
        workingCapital: { type: number }
        currentRatio: { type: ["number", "null"] }
        quickRatio: { type: ["number", "null"] }
        debtToEquity: { type: ["number", "null"] }
        netWorth: { type: number }
        claimable:
          type: boolean
          description: >
            False means this point must NOT be drawn as an ordinary segment. The
            line breaks, visibly, rather than running through a month we cannot
            stand behind.
        blockers:
          type: array
          items:
            type: object
            required: [code, amount]
            properties:
              code: { type: string, enum: [suspense_balance, unclassified_accounts] }
              amount: { type: number }
              count: { type: ["integer", "null"] }

    Decomposition:
      type: object
      required: [dimension, current, prior, change, contributors, concentration]
      properties:
        dimension: { type: string, enum: [category, customer, vendor] }
        current:
          type: object
          required: [from, to, total]
          properties:
            from: { type: string }
            to: { type: string }
            total: { type: number }
        prior:
          type: object
          required: [from, to, total]
          properties:
            from: { type: string }
            to: { type: string }
            total: { type: number }
        change: { type: number }
        contributors:
          type: array
          items:
            type: object
            required: [id, name, nameAr, current, prior, change, shareOfChange]
            properties:
              id: { type: string }
              name: { type: string }
              nameAr: { type: string }
              current: { type: number }
              prior: { type: number }
              change: { type: number }
              shareOfChange:
                type: ["number", "null"]
                description: >
                  NULL when the NET change is about zero. Offsetting movements
                  are real, and a share of "nothing changed" is undefined rather
                  than infinite. The movers stay ranked.
        concentration:
          type: ["object", "null"]
          required: [count, share]
          properties:
            count: { type: integer }
            share: { type: number }

    Liquidity:
      type: object
      description: >
        🔴 `claimable` is the field that matters. When false the UI must NOT
        state the plain-language claim ("you can cover your short-term debts
        1.8x over") — the figures are still returned so the breakdown and the
        blocker can be shown, but the CLAIM is withheld. `observations` are
        RULES OF THUMB, never compliance: no severity above "watch" exists.
      required:
        [asOf, currentAssets, quickAssets, currentLiabilities, workingCapital,
         currentRatio, quickRatio, claimable, blockers, observations]
      properties:
        asOf:
          type: string
        currentAssets:
          type: number
        quickAssets:
          type: number
          description: Cash + quick — the acid-test numerator.
        currentLiabilities:
          type: number
        workingCapital:
          type: number
        currentRatio:
          type: ["number", "null"]
          description: NULL when there are no current liabilities — undefined, not zero.
        quickRatio:
          type: ["number", "null"]
        claimable:
          type: boolean
        blockers:
          type: array
          items:
            type: object
            required: [code, amount]
            properties:
              code:
                type: string
                enum: [suspense_balance, unclassified_accounts]
              amount:
                type: number
              count:
                type: ["integer", "null"]
        observations:
          type: array
          items:
            type: object
            required: [code, severity, ratio]
            properties:
              code:
                type: string
              severity:
                type: string
                enum: [watch]
              ratio:
                type: number

    TaxCompliance:
      type: object
      required: [vat, zatca]
      properties:
        vat:
          type: object
          required: [periodFrom, periodTo, periodBasis, filingFrequencyKnown, netVatDue, payable, refund]
          properties:
            periodFrom: { type: string }
            periodTo: { type: string }
            periodBasis:
              type: string
              enum: [calendar_quarter]
            filingFrequencyKnown:
              type: boolean
              description: >
                Always false today. KSA VAT is filed monthly or quarterly by
                turnover and nothing records which applies, so the UI must state
                the period it used rather than imply a filing obligation.
            netVatDue: { type: number }
            payable: { type: number }
            refund: { type: number }
        zatca:
          type: ["object", "null"]
          required: [environment, connected, certificateStatus, daysUntilExpiry]
          properties:
            environment: { type: string }
            connected: { type: boolean }
            certificateStatus: { type: ["string", "null"] }
            daysUntilExpiry: { type: ["integer", "null"] }

    BooksStatus:
      type: object
      required: [unreviewedCount, needsAttentionCount]
      properties:
        unreviewedCount:
          type: integer
        needsAttentionCount:
          type: integer

    PeriodLock:
      type: object
      required: [id, period, lockedAt, lockedBy, notes]
      properties:
        id:
          type: integer
        period:
          type: string
          description: The closed month, `YYYY-MM`.
        lockedAt:
          type: string
        lockedBy:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    PeriodLockInput:
      type: object
      required: [period]
      properties:
        period:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: The month to close, `YYYY-MM` (e.g. 2026-06).
        notes:
          type: ["string", "null"]

    Category:
      type: object
      required: [id, name, nameAr, type, vatApplicable]
      properties:
        id:
          type: integer
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, asset, liability, equity]
        vatApplicable:
          type: boolean
        liquidityClass:
          type: ["string", "null"]
          enum: [cash, quick, current, non_current, null]
          description: >
            M18.1 — where a BALANCE-SHEET account sits on the liquidity scale,
            for the Finance Hub. Current assets are everything but
            `non_current`; quick assets are `cash` + `quick`. NULL on an asset
            or liability means UNCLASSIFIED and is surfaced as such, never
            silently treated as current. Always NULL on income/expense/equity
            accounts, where the distinction is meaningless.
        description:
          type: ["string", "null"]

    CategoryInput:
      type: object
      required: [name, nameAr, type, vatApplicable]
      properties:
        name:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [income, expense, asset, liability, equity]
        vatApplicable:
          type: boolean
        liquidityClass:
          type: ["string", "null"]
          enum: [cash, quick, current, non_current, null]
          description: >
            Only meaningful when `type` is `asset` or `liability`; the server
            rejects it on any other account type (and a DB CHECK backs that up).
        description:
          type: ["string", "null"]

    Transaction:
      type: object
      required:
        - id
        - date
        - description
        - amount
        - currency
        - type
        - isManuallyOverridden
        - createdAt
      properties:
        id:
          type: integer
        date:
          type: string
        description:
          type: string
        descriptionAr:
          type: ["string", "null"]
        amount:
          type: number
        currency:
          type: string
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        categoryNameAr:
          type: ["string", "null"]
        vatAmount:
          type: ["number", "null"]
        vatRate:
          type: ["number", "null"]
        confidenceScore:
          type: ["number", "null"]
        isManuallyOverridden:
          type: boolean
        source:
          type: ["string", "null"]
        reviewStatus:
          type: string
          enum: [pending_review, accepted]
        kind:
          description: |
            M16.2 — operating (real income/expense; the only kind tax figures
            read), transfer (money between the business's own pockets), or
            settlement (M16.3: settles an existing invoice/bill).
          type: string
          enum: [operating, transfer, settlement]
        taxTreatment:
          description: "VAT treatment: S/Z/E/O; null = unknown (and only unknown)."
          type: ["string", "null"]
          enum: [S, Z, E, O, null]
        vatBasis:
          description: |
            Flaw #6 — whether VAT was actually CHARGED on this payment, which
            is a different fact from what the supply IS (taxTreatment).
            `reverse_charge`: a foreign supplier charges no KSA VAT and the
            buyer self-accounts. `supplier_unregistered`: a supplier below the
            VAT threshold charges none. VAT is extracted only when
            taxTreatment='S' AND vatBasis='charged'.
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        bankAccountId:
          type: ["integer", "null"]
        settlesInvoiceId:
          description: "M16.3: the invoice this credit settled (kind=settlement)."
          type: ["integer", "null"]
        settlesBillId:
          description: "M16.3: the bill this debit paid (kind=settlement)."
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PendingReviewTransaction:
      type: object
      required: [id, date, description, amount, type, needsAttention, kind]
      properties:
        id: { type: integer }
        date: { type: string }
        description: { type: string }
        descriptionAr: { type: ["string", "null"] }
        amount: { type: number }
        type: { type: string, enum: [debit, credit] }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        confidenceScore: { type: ["number", "null"] }
        vatAmount: { type: ["number", "null"] }
        kind: { type: string, enum: [operating, transfer, settlement] }
        taxTreatment: { type: ["string", "null"], enum: [S, Z, E, O, null] }
        vatBasis:
          description: "Flaw #6 — whether VAT was actually charged (see Transaction.vatBasis)."
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        treatmentAssumed:
          description: |
            M16.3.1 — true when the row's treatment came from a category
            default that has NOT been verified against KSA VAT rules (only
            BANK_CHARGES and INSURANCE have been — queue C9 tracks the rest).
            The UI shows these as "assumed" with an override; a user must
            never read a confident 'S' off a guess.
          type: boolean
        needsAttention:
          description: |
            True for rows a human MUST look at (uncategorized non-transfer, or
            low-confidence). The server enforces this: bulk accept never takes
            a needsAttention row — accepting one requires naming its id.
          type: boolean
        suggestion:
          description: |
            M16.3 — an exact-match settlement SUGGESTION, never an action. The
            UI pre-selects it; only POST /transactions/{id}/settle applies it,
            and only when a human clicks. Null when no unambiguous match
            exists (unmatched rows stay plain transactions).
          oneOf:
            - $ref: "#/components/schemas/SettlementSuggestion"
            - type: "null"

    SettlementSuggestion:
      type: object
      required: [documentKind, documentId, documentNumber, outstanding, matchedBy, partial]
      properties:
        documentKind:
          type: string
          enum: [invoice, bill]
        documentId: { type: integer }
        documentNumber: { type: string }
        counterpartyName: { type: ["string", "null"] }
        outstanding:
          description: The document's outstanding balance (total - paid).
          type: number
        matchedBy:
          description: |
            "number" — the document number appears in the bank-line description;
            "amount" — the amount equals exactly ONE open document's outstanding
            balance. v1 is exact-match only (design Q3a).
          type: string
          enum: [number, amount]
        partial:
          description: |
            True when the amount is LESS than the outstanding balance and the
            description references the document number (Q3b: description-
            referenced partials suggested; amount-only partials never).
          type: boolean

    SettleTransactionInput:
      type: object
      description: Exactly one of invoiceId / billId must be set.
      properties:
        invoiceId:
          type: ["integer", "null"]
        billId:
          type: ["integer", "null"]

    AcceptPendingInput:
      type: object
      properties:
        ids:
          type: ["array", "null"]
          items: { type: integer }

    AcceptPendingResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }

    TransactionList:
      type: object
      required: [transactions, total, offset, limit]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    # M15: real constraints. `date: string` / `amount: number` accepted
    # date="banana" and amount=-431.25, leaving Postgres as the only guard —
    # the client-side parser was the sole real validation, which a direct API
    # call bypasses entirely.
    TransactionInput:
      type: object
      required: [date, description, amount, currency, type]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        description:
          type: string
          minLength: 1
          maxLength: 500
        descriptionAr:
          type: ["string", "null"]
          maxLength: 500
        amount:
          # Positive by contract: direction lives in `type`, not in the sign.
          # Signed bank exports are normalised CLIENT-side (statementParser)
          # before they reach this schema.
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999
        currency:
          type: string
          minLength: 3
          maxLength: 3
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: ["integer", "null"]
        vatAmount:
          type: ["number", "null"]
          minimum: 0
        vatRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        notes:
          type: ["string", "null"]
          maxLength: 1000
        source:
          type: ["string", "null"]

    TransactionUpdate:
      type: object
      properties:
        categoryId:
          type: ["integer", "null"]
        vatAmount:
          type: ["number", "null"]
        vatRate:
          type: ["number", "null"]
        taxTreatment:
          description: |
            M16.3.1 — per-row VAT-treatment override (the export-sale case, or
            correcting an assumed default). Setting a non-'S' value clears the
            row's VAT (Z/E/O rows carry zero VAT and say why); setting 'S' on a
            row with no VAT extracts it from the gross amount at 15%. null
            returns the row to honest-unknown.
          type: ["string", "null"]
          enum: [S, Z, E, O, null]
        vatBasis:
          description: |
            Flaw #6 — the human's answer to "did this payment actually carry
            VAT?". Anything other than `charged` clears the row's VAT; setting
            `charged` on a standard-rated row re-extracts it from the gross.
          type: ["string", "null"]
          enum: [charged, reverse_charge, supplier_unregistered, null]
        notes:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]

    TransactionUpload:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TransactionInput"
        autoCategrize:
          type: ["boolean", "null"]
        bankAccountId:
          description: |
            M16.2 — which bank account this statement belongs to. Scopes
            duplicate detection to the account and is the foundation for
            transfer-leg pairing. Validated against the tenant's own accounts.
          type: ["integer", "null"]

    UploadResult:
      type: object
      required: [inserted, categorized, errors]
      properties:
        inserted:
          type: integer
        categorized:
          type: integer
        # M15: rows skipped because an IDENTICAL row (date+description+amount+
        # type) already exists — re-uploading a statement must not double every
        # tax figure. Reported, never silent.
        duplicatesSkipped:
          type: integer
        # 🔴 Audit finding #10: the COUNT alone conflated two different events —
        # "you re-uploaded a statement" (housekeeping) and "your business
        # genuinely paid the same amount twice today" (lost money, invisible).
        # The skipped rows are returned so the second case can be seen and
        # re-entered.
        duplicates:
          type: array
          items:
            type: object
            required: [date, description, amount]
            properties:
              date: { type: string }
              description: { type: string }
              amount: { type: number }
        errors:
          type: array
          items:
            type: string

    CategorizationRequest:
      type: object
      properties:
        transactionIds:
          type: ["array", "null"]
          items:
            type: integer
        overrideExisting:
          type: ["boolean", "null"]

    CategorizationResult:
      type: object
      required: [processed, categorized, skipped]
      properties:
        processed:
          type: integer
        categorized:
          type: integer
        skipped:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/CategorizationResultItem"

