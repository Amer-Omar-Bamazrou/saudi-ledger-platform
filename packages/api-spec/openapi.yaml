        taxNumber: { type: ["string", "null"] }
        invoices:
          type: array
          items: { $ref: "#/components/schemas/CustomerLedgerInvoice" }
        totalInvoiced: { type: number }
        totalPaid: { type: number }
        balance: { type: number, minimum: 0, description: Σ outstanding over the LISTED documents — the receivable within the window. }
        position:
          allOf:
            - { $ref: "#/components/schemas/CustomerPosition" }
          description: The customer's CURRENT position (whole history, not the window).

