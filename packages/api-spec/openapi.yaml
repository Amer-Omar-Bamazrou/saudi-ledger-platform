        name: { type: string, minLength: 1 }
        nameAr: { type: ["string", "null"] }
        nationalId: { type: ["string", "null"] }
        nationality: { type: ["string", "null"] }
        jobTitle: { type: ["string", "null"] }
        jobTitleAr: { type: ["string", "null"] }
        department: { type: ["string", "null"] }
        basicSalary: { type: number, minimum: 0 }
        housingAllowance: { type: number, minimum: 0 }
        transportAllowance: { type: number, minimum: 0 }
        otherAllowances: { type: number, minimum: 0 }
        gosiNumber: { type: ["string", "null"] }
        iban: { type: ["string", "null"] }
        bank: { type: ["string", "null"] }
        joiningDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        status: { type: string }
        notes: { type: ["string", "null"] }

    CreateEmployeeInput:
      type: object
      required: [employeeNumber, name, basicSalary]
      properties:
        employeeNumber: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        nameAr: { type: string }
        nationalId: { type: ["string", "null"] }
        nationality: { type: ["string", "null"] }
        jobTitle: { type: ["string", "null"] }
        jobTitleAr: { type: string }
        department: { type: ["string", "null"] }
        basicSalary: { type: number, minimum: 0 }
        housingAllowance: { type: number, minimum: 0 }
        transportAllowance: { type: number, minimum: 0 }
        otherAllowances: { type: number, minimum: 0 }
        gosiNumber: { type: ["string", "null"] }
        iban: { type: ["string", "null"] }
        bank: { type: ["string", "null"] }
        joiningDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        status: { type: string }
        notes: { type: ["string", "null"] }

    UpdateEmployeeInput:
      $ref: "#/components/schemas/EmployeeInputFields"

    Asset:
      type: object
      required: [id, assetNumber, name, nameAr, categoryId, purchaseDate, purchaseCost, salvageValue, usefulLifeYears,
                 depreciationMethod, accumulatedDepreciation, currentBookValue, location, serialNumber, status,
                 disposalDate, disposalValue, notes, createdAt, annualDepreciation, monthlyDepreciation]
      properties:
        id: { type: integer }
        assetNumber: { type: string }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        purchaseDate: { type: string }
        purchaseCost: { type: number }
        salvageValue: { type: number }
        usefulLifeYears: { type: number }
        depreciationMethod: { type: string }
        accumulatedDepreciation: { type: number }
        currentBookValue: { type: number }
        location: { type: ["string", "null"] }
        serialNumber: { type: ["string", "null"] }
        status: { type: string }
        disposalDate: { type: ["string", "null"] }
        disposalValue: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
