        amount: { type: number }
        bookValueAfter: { type: number }
        createdAt: { type: string }

    AssetDetail:
      allOf:
        - { $ref: "#/components/schemas/Asset" }
        - type: object
          required: [depreciationHistory]
          properties:
            depreciationHistory:
              type: array
              items: { $ref: "#/components/schemas/DepreciationEntry" }

    AssetTotals:
      type: object
      required: [activeCount, purchaseCost, accumulatedDepreciation, currentBookValue]
      properties:
        activeCount: { type: integer }
        purchaseCost: { type: number }
        accumulatedDepreciation: { type: number }
        currentBookValue: { type: number }

    CreateAssetInput:
      type: object
      required: [assetNumber, name, purchaseDate, purchaseCost, usefulLifeYears]
      properties:
        assetNumber: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        nameAr: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        purchaseDate: { type: string }
        purchaseCost: { type: number, minimum: 0 }
        salvageValue: { type: number, minimum: 0 }
        usefulLifeYears: { type: number, exclusiveMinimum: 0 }
        depreciationMethod: { type: string }
        location: { type: ["string", "null"] }
        serialNumber: { type: ["string", "null"] }
        status: { type: string }
        disposalDate: { type: ["string", "null"] }
        disposalValue: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }

    DepreciateInput:
      type: object
      required: [period]
      properties:
        period:
          type: string
          description: YYYY-MM

    # ── Approvals queue + budget writes (2026-09-02, batch 5);
    #    proven on real rows by tests/workflow-contract-conformance.test.ts ─────

    ApprovalPendingRow:
      type: object
      required: [entity, id, label, status, amount]
      properties:
        entity:
          type: string
          enum: [invoices, bills, journal-entries, payroll]
          description: Matches the URL segment its actions post to (`/{entity}/{id}/approve` …).
        id: { type: integer }
        label:
          type: string
          description: The human identifier — document number or payroll period.
        status:
          type: string
          enum: [draft, submitted]
        amount:
          type: number
          description: The document's own total; a journal entry's is the sum of its debit lines, from the same aggregate the ledger list uses.

    Budget:
      type: object
      required: [id, name, period, categoryId, budgetedAmount, notes]
      properties:
        id: { type: integer }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        period: { type: string, description: "YYYY — annual only." }
        categoryId: { type: ["integer", "null"] }
        budgetedAmount: { type: number }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }

    BudgetInput:
      type: object
      required: [name, period, budgetedAmount]
      properties:
        name: { type: string, minLength: 1 }
        nameAr: { type: ["string", "null"] }
        period: { type: string }
        categoryId: { type: ["integer", "null"] }
        budgetedAmount: { type: number, minimum: 0 }
        notes: { type: ["string", "null"] }

    QuotationLineInput:
      description: A line as a CLIENT sends it — the server computes vatAmount/total and assigns ids; `id` is passed only on update, to keep the identity a conversion points at.
      type: object
      required: [description, quantity, unitPrice]
      properties:
        id: { type: integer }
        productId: { type: ["integer", "null"] }
        description: { type: string, minLength: 1 }
        descriptionAr: { type: ["string", "null"] }
        quantity: { type: number, minimum: 0 }
        unitPrice: { type: number, minimum: 0 }
        vatRate: { type: number, minimum: 0, maximum: 100 }
        discount: { type: number, minimum: 0 }

    PurchaseOrderLineInput:
      description: A line as a CLIENT sends it; `id` only on update.
      type: object
      required: [description, quantity, unitPrice]
      properties:
        id: { type: integer }
        productId: { type: ["integer", "null"] }
        description: { type: string, minLength: 1 }
        descriptionAr: { type: ["string", "null"] }
        quantity: { type: number, minimum: 0 }
        unitPrice: { type: number, minimum: 0 }
        vatRate: { type: number, minimum: 0, maximum: 100 }

    RecurringRuleWithHealth:
      description: The LIST projection — the rule plus its run health, which only the list computes.
      allOf:
        - { $ref: "#/components/schemas/RecurringRule" }
        - type: object
          required: [lastOutcome, lastScheduledFor, lastErrorCode, lastErrorDetail, consecutiveFailures, lastSuccessOn]
          properties:
            lastOutcome: { type: ["string", "null"] }
            lastScheduledFor: { type: ["string", "null"] }
            lastErrorCode: { type: ["string", "null"] }
            lastErrorDetail: { type: ["string", "null"] }
            consecutiveFailures: { type: integer }
            lastSuccessOn: { type: ["string", "null"] }
    UpdateBudgetInput:
      description: A PARTIAL update — every field optional; the CREATE input requires name, period and amount.
      type: object
      properties:
        name: { type: string, minLength: 1 }
        nameAr: { type: ["string", "null"] }
        period: { type: string }
        categoryId: { type: ["integer", "null"] }
        budgetedAmount: { type: number, minimum: 0 }
        notes: { type: ["string", "null"] }

    # ── Batch 1C — migration ─────────────────────────────────────────────────
    CreateMigrationBatchInput:
      type: object
      required: [sourceSystem, cutoverDate]
      properties:
        sourceSystem: { type: string, minLength: 1, maxLength: 80, description: "The previous system, as named by the operator (\"PreviousERP\", \"Excel\", \"Qoyod export\")." }
        sourceVersion: { type: ["string", "null"], maxLength: 80 }
        cutoverDate: { type: string, description: "YYYY-MM-DD — the first business day in Saudi Ledger. The opening date is cutover − 1 and is not chosen." }
        notes: { type: ["string", "null"], maxLength: 2000 }
        idempotencyKey: { type: ["string", "null"], maxLength: 120 }

    MigrationBatch:
      type: object
      required: [id, status, sourceSystem, sourceVersion, cutoverDate, openingDate, notes, vatPosition, replacesBatchId, periodLockId, contentHash, openingJournalEntryId, reversalJournalEntryId, createdBy, validatedAt, committedBy, committedAt, reversedAt, reversalReason, createdAt, updatedAt]
      properties:
        id: { type: integer }
        replacesBatchId: { type: ["integer", "null"], description: "Policy C: the REVERSED batch this one replaces — set automatically at creation when the company's most recent batch is reversed. Its opening items are numbered OPEN-<batch>-<seq> and point back at the rows they replace. NULL on a first migration." }
        status: { type: string, enum: [draft, validated, committed, reversed, discarded] }
        sourceSystem: { type: string }
        sourceVersion: { type: ["string", "null"] }
        cutoverDate: { type: string }
        openingDate: { type: string, description: "cutover − 1 by definition." }
        notes: { type: ["string", "null"] }
        vatPosition:
          oneOf:
            - { $ref: "#/components/schemas/MigrationVatPosition" }
            - { type: "null" }
        periodLockId: { type: ["integer", "null"], description: "The lock the commit placed on the opening month; lifted by the reversal." }
        contentHash: { type: ["string", "null"], description: "SHA-256 over the canonical staged content at the last validation; commit refuses if the content moved." }
        openingJournalEntryId: { type: ["integer", "null"] }
        reversalJournalEntryId: { type: ["integer", "null"] }
        createdBy: { type: ["integer", "null"] }
        validatedAt: { type: ["string", "null"] }
        committedBy: { type: ["integer", "null"] }
        committedAt: { type: ["string", "null"] }
        reversedAt: { type: ["string", "null"] }
        reversalReason: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    MigrationBatchDetail:
      allOf:
        - { $ref: "#/components/schemas/MigrationBatch" }
        - type: object
          required: [counts, validation, reconciliation]
          properties:
            counts:
              type: object
              required: [chartRows, chartRowsUnmapped, parties, openItems, advances]
              properties:
                chartRows: { type: integer }
                chartRowsUnmapped: { type: integer }
                parties: { type: integer }
                openItems: { type: integer }
                advances: { type: integer }
            validation:
              description: "The last validation run, or null."
              oneOf:
                - { $ref: "#/components/schemas/MigrationValidationRecord" }
                - { type: "null" }
            reconciliation:
              description: "R1–R10 as computed at commit, or null."
              oneOf:
                - { $ref: "#/components/schemas/MigrationReconciliationRecord" }
                - { type: "null" }

    MigrationValidationRecord:
      type: object
      description: "The last validation run, as the batch stores it (Batch 1C UI, 2026-09-20: typed so the workspace consumes the generated shape)."
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks: { type: array, items: { $ref: "#/components/schemas/MigrationControlCheck" } }
        totals: { type: object, description: "The opening-position totals at that run (debit, credit, difference, ytd…).", additionalProperties: { type: ["number", "boolean"] } }
        at: { type: string, format: date-time }

    MigrationReconciliationRecord:
      type: object
      description: "R1–R10 as the commit computed them on the posted ledger, stored on the batch."
      required: [checks]
      properties:
        at: { type: string, format: date-time }
        journalEntryId: { type: integer }
        checks: { type: array, items: { $ref: "#/components/schemas/MigrationControlCheck" } }
        figures: { type: object, additionalProperties: { type: number } }

    MigrationChartRowInput:
      type: object
      required: [sourceCode, sourceName, sourceType]
      properties:
        sourceCode: { type: string, minLength: 1, maxLength: 64 }
        sourceName: { type: string, minLength: 1, maxLength: 200 }
        sourceNameAr: { type: ["string", "null"], maxLength: 200 }
        sourceParentCode: { type: ["string", "null"], maxLength: 64 }
        sourceType: { type: string, enum: [asset, liability, equity, income, expense], description: "As the file states it. Nothing is inferred from a name." }
        sourceIsGroup: { type: boolean, default: false }
        openingDebit: { type: number, minimum: 0, default: 0 }
        openingCredit: { type: number, minimum: 0, default: 0 }
        sourceRole:
          type: ["string", "null"]
          enum: [receivable, payable, bank, cash, vat_output, vat_input, retained_earnings, customer_deposits, null]
          description: "A ROLE HINT the file carries (the old system's account type). Drives the deterministic suggestion; never a name match."
        evidenceNote: { type: ["string", "null"], maxLength: 500 }

    ImportMigrationChartInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/MigrationChartRowInput" }

    MigrationChartRow:
      type: object
      required: [id, sourceCode, sourceName, sourceNameAr, sourceParentCode, sourceType, sourceIsGroup, openingDebit, openingCredit, sourceRole, evidenceNote, decision, targetSystemCode, targetBankAccountId, targetCategoryId, skipReason, resolvedCategoryId, suggestion, problems]
      properties:
        id: { type: integer }
        sourceCode: { type: string }
        sourceName: { type: string }
        sourceNameAr: { type: ["string", "null"] }
        sourceParentCode: { type: ["string", "null"] }
        sourceType: { type: string }
        sourceIsGroup: { type: boolean }
        openingDebit: { type: number }
        openingCredit: { type: number }
        sourceRole: { type: ["string", "null"] }
        evidenceNote: { type: ["string", "null"] }
        decision: { type: ["string", "null"], enum: [map_to_system, map_to_bank, create, merge_into, skip, null] }
        targetSystemCode: { type: ["string", "null"] }
        targetBankAccountId: { type: ["integer", "null"] }
        targetCategoryId: { type: ["integer", "null"] }
        skipReason: { type: ["string", "null"] }
        resolvedCategoryId: { type: ["integer", "null"], description: "After commit: the category the balance was posted to." }
        suggestion:
          description: "The deterministic suggestion from the role hint (e.g. receivable → map_to_system AR), or null when the file gave none. The operator still decides."
          oneOf:
            - type: object
              required: [decision, targetSystemCode]
              properties:
                decision: { type: string }
                targetSystemCode: { type: ["string", "null"] }
            - { type: "null" }
        problems:
          type: array
          items: { type: string }
          description: "What blocks this row today (unmapped, group with a balance, control role mapped elsewhere…)."

    MigrationChartDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [map_to_system, map_to_bank, create, merge_into, skip] }
        targetSystemCode: { type: ["string", "null"], description: "map_to_system: a system account code. CASH (a header) is refused." }
        targetBankAccountId: { type: ["integer", "null"], description: "map_to_bank: this company's bank account; the balance lands on its D-3 leaf." }
        targetCategoryId: { type: ["integer", "null"], description: "merge_into: an existing non-system posting category of the right type; create: the PARENT header to create under (optional)." }
        skipReason: { type: ["string", "null"], maxLength: 500, description: "skip: required; only a zero-balance row may be skipped." }

    MigrationChart:
      type: object
      required: [batchId, rows, summary]
      properties:
        batchId: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/MigrationChartRow" }
        summary:
          type: object
          required: [rows, mapped, unmapped, blocked, totalDebit, totalCredit, balanced, byDecision]
          properties:
            rows: { type: integer }
            mapped: { type: integer }
            unmapped: { type: integer }
            blocked: { type: integer, description: "Rows with at least one problem." }
            totalDebit: { type: number }
            totalCredit: { type: number }
            balanced: { type: boolean, description: "Σ debits = Σ credits over the staged rows (to the halala). The commit refuses otherwise — no balancing amount is ever invented." }
            byDecision:
              type: object
              additionalProperties: { type: integer }

    # ── Batch 1C Phase 2 — parties, open items, advances, opening position, validation ──
    MigrationVatPosition:
      type: object
      description: "The last VAT return filed from the previous system — its closing position, as supplied, with the return's reference (pack §15.6 R9)."
      required: [returnReference, periodStart, periodEnd, outputVatPayable, inputVatReceivable]
      properties:
        returnReference: { type: string, minLength: 1, maxLength: 120, description: "The ZATCA return reference / acknowledgement number." }
        periodStart: { type: string, description: "YYYY-MM-DD" }
        periodEnd: { type: string, description: "YYYY-MM-DD — must not be after the opening date." }
        outputVatPayable: { type: number, minimum: 0, description: "Output VAT still payable at cut-off (the VAT_OUTPUT balance)." }
        inputVatReceivable: { type: number, minimum: 0, description: "Input VAT still recoverable at cut-off (the VAT_INPUT balance)." }
        note: { type: ["string", "null"], maxLength: 500 }

    UpdateMigrationBatchInput:
      type: object
      properties:
        notes: { type: ["string", "null"], maxLength: 2000 }
        sourceVersion: { type: ["string", "null"], maxLength: 80 }
        vatPosition:
          oneOf:
            - { $ref: "#/components/schemas/MigrationVatPosition" }
            - { type: "null" }

    MigrationPartyInput:
      type: object
      required: [partyType, sourceId, name]
      properties:
        partyType: { type: string, enum: [customer, vendor] }
        sourceId: { type: string, minLength: 1, maxLength: 120, description: "The old system's id for this party — the identity open items and advances refer to." }
        name: { type: string, minLength: 1, maxLength: 200 }
        nameAr: { type: ["string", "null"], maxLength: 200 }
        taxNumber: { type: ["string", "null"], maxLength: 40 }
        crNumber: { type: ["string", "null"], maxLength: 40 }
        phone: { type: ["string", "null"], maxLength: 40 }
        email: { type: ["string", "null"], maxLength: 200 }
        address: { type: ["string", "null"], maxLength: 500 }
        city: { type: ["string", "null"], maxLength: 100 }

    ImportMigrationPartiesInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 20000
          items: { $ref: "#/components/schemas/MigrationPartyInput" }

    MigrationPartyCandidate:
      type: object
      required: [id, name, taxNumber, reason]
      properties:
        id: { type: integer }
        name: { type: string }
        taxNumber: { type: ["string", "null"] }
        reason: { type: string, enum: [tax_number, name], description: "What matched — the operator decides; the platform never merges by itself." }

    MigrationParty:
      type: object
      required: [id, partyType, sourceId, name, nameAr, taxNumber, crNumber, phone, email, address, city, decision, existingId, resolvedId, candidates, openItems, openTotal, advances, advanceTotal, problems]
      properties:
        id: { type: integer }
        partyType: { type: string, enum: [customer, vendor] }
        sourceId: { type: string }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        taxNumber: { type: ["string", "null"] }
        crNumber: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        decision: { type: ["string", "null"], enum: [create, use_existing, null] }
        existingId: { type: ["integer", "null"], description: "use_existing: the existing customer / vendor id." }
        resolvedId: { type: ["integer", "null"], description: "After commit: the customer / vendor the party became." }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/MigrationPartyCandidate" }
        openItems: { type: integer, description: "Staged open items naming this party." }
        openTotal: { type: number, description: "Σ outstanding of those items." }
        advances: { type: integer }
        advanceTotal: { type: number }
        problems:
          type: array
          items: { type: string }

    MigrationPartyDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [create, use_existing] }
        existingId: { type: ["integer", "null"], description: "use_existing: an existing customer (for a customer party) or vendor (for a vendor party) of this organisation." }

    MigrationParties:
      type: object
      required: [batchId, rows, summary]
      properties:
        batchId: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/MigrationParty" }
        summary:
          type: object
          required: [rows, customers, vendors, undecided, useExisting, blocked]
          properties:
            rows: { type: integer }
            customers: { type: integer }
            vendors: { type: integer }
            undecided: { type: integer }
            useExisting: { type: integer }
            blocked: { type: integer }

    MigrationHistoricalVat:
      type: object
      description: "The VAT facts of the historical document, as data. Never posted; never a VAT event here."
      properties:
        category: { type: ["string", "null"], maxLength: 8, description: "S / Z / E / O as the old system recorded it." }
        rate: { type: ["number", "null"], minimum: 0, maximum: 100 }
        taxableAmount: { type: ["number", "null"], minimum: 0 }
        amount: { type: ["number", "null"], minimum: 0 }
        reportedPeriod: { type: ["string", "null"], maxLength: 40, description: "The return period the document's VAT was reported in by the old system." }
        badDebtReliefClaimed: { type: ["boolean", "null"], description: "VAT Implementing Regulations Art. 40(7): whether the previous system CLAIMED bad-debt relief on this document (true), is known not to have (false), or it is not known (null / absent). 2026-09-22: a STRUCTURED fact — at commit it lands on the opening receivable (badDebtRelief.source = migrated) and an Art. 40(9) recovery document is declared from it when money arrives. It never restricts a payment or an allocation." }
        badDebtReliefClaimedOn: { type: ["string", "null"], description: "YYYY-MM-DD: the period the previous system claimed the relief in, when known. Only with badDebtReliefClaimed = true." }
        badDebtReliefVatAmount: { type: ["number", "null"], minimum: 0, description: "The Output Tax the previous system relieved, when known. Only with badDebtReliefClaimed = true." }

    MigrationOpenItemInput:
      type: object
      required: [itemType, sourceId, partySourceId, documentNumber, issueDate, dueDate, originalAmount, outstandingAmount]
      properties:
        itemType: { type: string, enum: [ar, ap] }
        sourceId: { type: string, minLength: 1, maxLength: 120 }
        partySourceId: { type: string, minLength: 1, maxLength: 120, description: "A staged customer (ar) or vendor (ap) of this batch." }
        documentNumber: { type: string, minLength: 1, maxLength: 80, description: "The original document number — kept verbatim; it becomes the opening item's number." }
        issueDate: { type: string, description: "YYYY-MM-DD, on or before the opening date." }
        dueDate: { type: string, description: "YYYY-MM-DD — drives ageing exactly as it did in the old system." }
        originalAmount: { type: number, exclusiveMinimum: 0 }
        outstandingAmount: { type: number, exclusiveMinimum: 0, description: "Still open at cut-off; ≤ originalAmount. This is what the opening journal posts, with the party." }
        compositionUnknown: { type: boolean, default: false, description: "The one-row representation of a party whose old system tracked only a balance. At most one per party." }
        historicalVat:
          oneOf:
            - { $ref: "#/components/schemas/MigrationHistoricalVat" }
            - { type: "null" }
        einvoicingStatus: { type: ["string", "null"], enum: [cleared, reported, pre_einvoicing, null], description: "2026-09-22 (AR only): what the previous solution did with this tax invoice — cleared (standard), reported (simplified), or pre_einvoicing (issued before the obligation applied). Empty = NOT STATED, which is not a guess: a credit note against the item is refused until it is stated. Never invented." }
        sourceUuid: { type: ["string", "null"], maxLength: 64, description: "2026-09-22 (AR only): the previous solution's document UUID, verbatim — required for cleared/reported; the identity a credit note through Fatoora keeps. Never invented." }
        description: { type: ["string", "null"], maxLength: 500 }

    ImportMigrationOpenItemsInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 50000
          items: { $ref: "#/components/schemas/MigrationOpenItemInput" }

    MigrationOpenItem:
      type: object
      required: [id, itemType, sourceId, partySourceId, partyName, documentNumber, ledgerDocumentNumber, issueDate, dueDate, originalAmount, outstandingAmount, compositionUnknown, historicalVat, description, resolvedId, problems, einvoicingStatus, sourceUuid, liveDocumentId, liveDocumentNumber, liveOutstanding, corrections, liveIdentityRecorded]
      properties:
        id: { type: integer }
        itemType: { type: string, enum: [ar, ap] }
        einvoicingStatus: { type: ["string", "null"], enum: [cleared, reported, pre_einvoicing, null], description: "Before commit: as staged. After commit: the LIVE ledger row's identity (staged, or recorded once afterwards)." }
        sourceUuid: { type: ["string", "null"] }
        liveDocumentId: { type: ["integer", "null"], description: "2026-09-22: after commit, the LIVE ledger row (the last replacement in the item's correction chain); null before commit or when the migration was reversed." }
        liveDocumentNumber: { type: ["string", "null"] }
        liveOutstanding: { type: ["number", "null"], description: "The live row's total (an opening item's outstanding at cut-off, as corrected)." }
        corrections: { type: integer, description: "How many item-level corrections the item has had (each a reversed original + a replacement + a retained-earnings entry)." }
        liveIdentityRecorded: { type: boolean, description: "Whether the live ledger row carries its e-invoicing identity (from staging or recorded afterwards)." }
        sourceId: { type: string }
        partySourceId: { type: string }
        partyName: { type: ["string", "null"], description: "From the staged party, when it exists." }
        documentNumber: { type: string, description: "The previous system's number, verbatim — provenance (Policy C). It is also the ledger number in a first migration." }
        ledgerDocumentNumber: { type: ["string", "null"], description: "What the ledger row was actually called, written at commit: the source number for a first migration, OPEN-<batch>-<seq> for a replacement. NULL before commit." }
        issueDate: { type: string }
        dueDate: { type: string }
        originalAmount: { type: number }
        outstandingAmount: { type: number }
        compositionUnknown: { type: boolean }
        historicalVat:
          oneOf:
            - { $ref: "#/components/schemas/MigrationHistoricalVat" }
            - { type: "null" }
        description: { type: ["string", "null"] }
        resolvedId: { type: ["integer", "null"], description: "After commit: the opening invoice (ar) or bill (ap) row." }
        problems:
          type: array
          items: { type: string }

    MigrationSubledgerTotals:
      type: object
      required: [items, parties, total, compositionUnknown]
      properties:
        items: { type: integer }
        parties: { type: integer }
        total: { type: number }
        compositionUnknown: { type: integer }

    MigrationOpenItems:
      type: object
      required: [batchId, rows, summary]
      properties:
        batchId: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/MigrationOpenItem" }
        summary:
          type: object
          required: [rows, blocked, ar, ap]
          properties:
            rows: { type: integer }
            blocked: { type: integer }
            ar: { $ref: "#/components/schemas/MigrationSubledgerTotals" }
            ap: { $ref: "#/components/schemas/MigrationSubledgerTotals" }

    MigrationAdvanceInput:
      type: object
      required: [sourceId, partySourceId, bankSourceCode, amount, receivedAt, vatPosition]
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 120 }
        partySourceId: { type: string, minLength: 1, maxLength: 120, description: "A staged CUSTOMER of this batch." }
        bankSourceCode: { type: string, minLength: 1, maxLength: 64, description: "The old chart's code of the bank the money arrived in — a chart row mapped to a bank." }
        amount: { type: number, exclusiveMinimum: 0 }
        receivedAt: { type: string, description: "YYYY-MM-DD, on or before the opening date." }
        reference: { type: ["string", "null"], maxLength: 120 }
        vatPosition: { type: string, enum: [invoiced, unknown] }
        advanceInvoiceNumber: { type: ["string", "null"], maxLength: 80 }
        advanceInvoiceDate: { type: ["string", "null"] }
        advanceInvoiceTime: { type: ["string", "null"], maxLength: 16, description: "HH:MM:SS as the old invoice states it (KSA-25), when known." }
        vatCategory: { type: ["string", "null"], maxLength: 8 }
        vatRate: { type: ["number", "null"], minimum: 0, maximum: 100 }
        vatAmount: { type: ["number", "null"], minimum: 0 }

    ImportMigrationAdvancesInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 20000
          items: { $ref: "#/components/schemas/MigrationAdvanceInput" }

    MigrationAdvance:
      type: object
      required: [id, sourceId, partySourceId, partyName, bankSourceCode, amount, receivedAt, reference, vatPosition, advanceInvoiceNumber, advanceInvoiceDate, advanceInvoiceTime, vatCategory, vatRate, vatAmount, resolvedPaymentId, problems]
      properties:
        id: { type: integer }
        sourceId: { type: string }
        partySourceId: { type: string }
        partyName: { type: ["string", "null"] }
        bankSourceCode: { type: string }
        amount: { type: number }
        receivedAt: { type: string }
        reference: { type: ["string", "null"] }
        vatPosition: { type: string, enum: [invoiced, unknown] }
        advanceInvoiceNumber: { type: ["string", "null"] }
        advanceInvoiceDate: { type: ["string", "null"] }
        advanceInvoiceTime: { type: ["string", "null"] }
        vatCategory: { type: ["string", "null"] }
        vatRate: { type: ["number", "null"] }
        vatAmount: { type: ["number", "null"] }
        resolvedPaymentId: { type: ["integer", "null"] }
        problems:
          type: array
          items: { type: string }

    MigrationAdvances:
      type: object
      required: [batchId, rows, summary]
      properties:
        batchId: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/MigrationAdvance" }
        summary:
          type: object
          required: [rows, blocked, total, customers, invoiced, unknown]
          properties:
            rows: { type: integer }
            blocked: { type: integer }
            total: { type: number }
            customers: { type: integer }
            invoiced: { type: integer }
            unknown: { type: integer, description: "Advances whose VAT position is unknown — recorded at cash, fail closed downstream." }

    MigrationOpeningLine:
      type: object
      description: "One target account of the opening position, with the source rows that land on it."
      required: [target, targetKind, systemCode, categoryId, bankAccountId, accountName, type, debit, credit, balance, sourceCodes]
      properties:
        target: { type: string, description: "A stable key: system:AR, bank:12, category:345, create:<sourceCode>." }
        targetKind: { type: string, enum: [system, bank, category, create] }
        systemCode: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        bankAccountId: { type: ["integer", "null"] }
        accountName: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number, description: "debit − credit." }
        sourceCodes:
          type: array
          items: { type: string }

    MigrationPartyBalance:
      type: object
      required: [partySourceId, partyName, items, total]
      properties:
        partySourceId: { type: string }
        partyName: { type: ["string", "null"] }
        items: { type: integer }
        total: { type: number }

    MigrationBankOpening:
      type: object
      required: [bankAccountId, bankName, sourceCode, balance, typedOpeningBalance, leafCategoryId, evidenceNote, advancesInside]
      properties:
        bankAccountId: { type: integer }
        bankName: { type: string }
        sourceCode: { type: string }
        balance: { type: number, description: "The old chart's closing balance for this bank (Dr − Cr)." }
        typedOpeningBalance: { type: ["number", "null"], description: "bank_accounts.opening_balance as typed on the bank record — display-only; it never posts. Must agree when non-zero (G2)." }
        leafCategoryId: { type: ["integer", "null"] }
        evidenceNote: { type: ["string", "null"] }
        advancesInside: { type: number, description: "Σ staged advances naming this bank — inside the balance, no cash line of their own." }

    MigrationControlCheck:
      type: object
      required: [id, title, status, expected, actual, detail]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [pass, fail, warn, skip] }
        expected: { type: ["number", "string", "null"] }
        actual: { type: ["number", "string", "null"] }
        detail: { type: string }

    MigrationOpeningPosition:
      type: object
      required: [batchId, openingDate, lines, totals, arByCustomer, apByVendor, depositsByCustomer, banks, controls]
      properties:
        batchId: { type: integer }
        openingDate: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/MigrationOpeningLine" }
        totals:
          type: object
          required: [debit, credit, balanced, difference, ytdIncome, ytdExpense, ytdResult]
          properties:
            debit: { type: number }
            credit: { type: number }
            balanced: { type: boolean }
            difference: { type: number, description: "credit − debit over the mapped rows — what remains UNCLASSIFIED. Non-zero blocks the migration (CHART_BALANCED fails); it is never posted anywhere. A balanced, fully mapped chart gives 0." }
            ytdIncome: { type: number }
            ytdExpense: { type: number }
            ytdResult: { type: number, description: "Income − expense of the imported YTD balances (A2)." }
        arByCustomer:
          type: array
          items: { $ref: "#/components/schemas/MigrationPartyBalance" }
        apByVendor:
          type: array
          items: { $ref: "#/components/schemas/MigrationPartyBalance" }
        depositsByCustomer:
          type: array
          items: { $ref: "#/components/schemas/MigrationPartyBalance" }
        banks:
          type: array
          items: { $ref: "#/components/schemas/MigrationBankOpening" }
        controls:
          type: array
          items: { $ref: "#/components/schemas/MigrationControlCheck" }

    MigrationValidation:
      type: object
      required: [batchId, ok, status, checks, contentHash, validatedAt]
      properties:
        batchId: { type: integer }
        ok: { type: boolean }
        status: { type: string, enum: [draft, validated, committed, reversed, discarded] }
        checks:
          type: array
          items: { $ref: "#/components/schemas/MigrationControlCheck" }
        contentHash: { type: ["string", "null"] }
        validatedAt: { type: ["string", "null"] }

    CorrectMigratedOpenItemInput:
      type: object
      required: [correctOutstanding, reason]
      properties:
        correctOutstanding: { type: number, exclusiveMinimum: 0, description: "The corrected outstanding amount of the item (what the previous system's document truly was)." }
        reason: { type: string, minLength: 1, maxLength: 1000, description: "The audit trail's explanation (a transfer error, a wrong figure in the previous system, …)." }
        date: { type: ["string", "null"], description: "YYYY-MM-DD, default today; an open month on or after the opening date." }
        idempotencyKey: { type: ["string", "null"], maxLength: 120 }

    MigratedOpenItemCorrection:
      type: object
      required: [original, replacement, delta, journalEntryId, entryNumber, date]
      properties:
        original: { type: object, required: [id, number, total], properties: { id: { type: integer }, number: { type: string }, total: { type: number } } }
        replacement: { type: object, required: [id, number, total], properties: { id: { type: integer }, number: { type: string }, total: { type: number } } }
        delta: { type: number, description: "correct − previous (negative for a decrease)." }
        journalEntryId: { type: integer }
        entryNumber: { type: string }
        date: { type: string }

    RecordMigratedOpenItemIdentityInput:
      type: object
      required: [einvoicingStatus]
      properties:
        einvoicingStatus: { type: string, enum: [cleared, reported, pre_einvoicing] }
        sourceUuid: { type: ["string", "null"], maxLength: 64, description: "Required for cleared / reported." }

    MigratedOpenItemIdentity:
      type: object
      required: [invoiceId, invoiceNumber, einvoicingStatus, sourceUuid]
      properties:
        invoiceId: { type: integer }
        invoiceNumber: { type: string }
        einvoicingStatus: { type: string, enum: [cleared, reported, pre_einvoicing] }
        sourceUuid: { type: ["string", "null"] }

    ReverseMigrationBatchInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 1000, description: "Why the opening position is withdrawn — the audit record of the reversal." }

    MigrationReversalPreview:
      type: object
      required: [batchId, blockers, wouldReverse]
      properties:
        batchId: { type: integer }
        blockers:
          type: array
          items: { type: string }
        wouldReverse:
          type: object
          required: [openingJournalEntryId, invoices, bills, deposits, banks, periodLock, keeps]
          properties:
            openingJournalEntryId: { type: ["integer", "null"] }
            invoices:
              type: array
              items:
                type: object
                required: [id, number, customerId, total]
                properties:
                  id: { type: integer }
                  number: { type: string }
                  customerId: { type: ["integer", "null"] }
                  total: { type: number }
            bills:
              type: array
              items:
                type: object
                required: [id, number, vendorId, total]
                properties:
                  id: { type: integer }
                  number: { type: string }
                  vendorId: { type: ["integer", "null"] }
                  total: { type: number }
            deposits:
              type: array
              items:
                type: object
                required: [id, customerId, amount]
                properties:
                  id: { type: integer }
                  customerId: { type: ["integer", "null"] }
                  amount: { type: number }
            banks:
              type: array
              items:
                type: object
                required: [id, name, openingBalance]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  openingBalance: { type: number }
            periodLock:
              oneOf:
                - type: object
                  required: [id, period]
                  properties:
                    id: { type: integer }
                    period: { type: string }
                - { type: "null" }
            keeps:
              type: object
              required: [customers, vendors, accountsCreated]
              properties:
                customers: { type: integer }
                vendors: { type: integer }
                accountsCreated: { type: integer }

    MigrationReversed:
      allOf:
        - { $ref: "#/components/schemas/MigrationBatch" }
        - type: object
          required: [reversalJournalEntryId, reversed]
          properties:
            reversalJournalEntryId: { type: integer }
            reversed:
              type: object
              description: "Policy C: the opening rows MARKED reversed (invoices/bills) or given a superseding reversal record (deposits). Nothing was deleted."
              required: [invoices, bills, deposits]
              properties:
                invoices: { type: integer }
                bills: { type: integer }
                deposits: { type: integer }
