        buildingNumber: { type: ["string", "null"] }
        street: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        additionalNumber: { type: ["string", "null"] }
        province: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        creditLimit:
          type: ["number", "null"]
          minimum: 0
        paymentTermsDays: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        isActive: { type: boolean }


    UpdateCustomerInput:
      $ref: "#/components/schemas/CustomerInputFields"

    Vendor:
      type: object
      required: [id, name, nameAr, taxNumber, crNumber, phone, email, address, city, country, currency,
                 iban, paymentTermsDays, notes, isActive, createdAt]
      properties:
