        over the page. `status=overdue` is DERIVED (unpaid and past due), not a
        stored status.
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: vendor_id, schema: { type: integer } }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page, plus set-wide totals
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Bill" }
                  page: { $ref: "#/components/schemas/PageInfo" }
                  totals:
                    type: object
                    required: [outstanding, paid, overdue]
                    properties:
                      outstanding: { type: number }
                      paid: { type: number }
                      overdue:
                        type: integer
                        description: A COUNT of overdue bills, not an amount.

    post:
      operationId: createBill
      tags: [bills]
      summary: Create a DRAFT bill
      requestBody:
        required: true
        content:
