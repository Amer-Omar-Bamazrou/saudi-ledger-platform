openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Saudi Bookkeeping Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Transaction management
  - name: categories
    description: Category management
  - name: categorize
    description: Categorization engine
  - name: summary
    description: Financial summaries and reports
  - name: journal_entries
    description: Journal entries and the draft/approval workflow
  - name: bills
    description: Vendor bills (AP) and the draft/approval workflow
  - name: invoices
    description: Customer invoices (AR, ZATCA) and the draft/approval workflow
  - name: payments
    description: "D-4 — customer payments, allocations and credit application. A payment names its bank (D-3) and its customer; allocations say which invoices it settles; the unapplied remainder is a customer deposit (a liability, never a credit inside AR)."
  - name: migration
    description: "Batch 1C — migrating an existing business: staged chart mapping, parties, open AR/AP items and advances, validated as a set and committed as ONE opening journal dated cutover − 1. Historical items never enter the e-invoice chain or a VAT return. Admin-only."
  - name: payroll
    description: Payroll runs and the draft/approval workflow
  - name: period_locks
    description: Closing and reopening accounting periods
  - name: finance_hub
    description: The Finance Hub control surface
  - name: analytics
    description: Trends and decomposition
  - name: budgets
    description: Annual budget vs actual

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /deployment:
    get:
      operationId: getDeploymentBanner
      tags: [health]
      summary: What kind of deployment is this
      description: >
        PUBLIC and unauthenticated on purpose: the demo banner has to appear on
        the LOGIN page, before anyone has a session. Server-driven so the claim
        cannot drift from the deployment that makes it — a banner compiled into
        the frontend would keep saying "demo" on a build promoted elsewhere.
      responses:
        "200":
          description: Deployment descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBanner"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      parameters:
        - name: category_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: is_manually_overridden
          in: query
          schema:
            type: ["boolean", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: [debit, credit, null]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"

    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a single transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/review:
    get:
      operationId: getPendingReviewTransactions
      tags: [transactions]
      summary: Pending imported transactions — the holding-area review surface (M15)
      responses:
        "200":
          description: Pending rows, flagged where a human must look
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingReviewTransaction"

  /transactions/review/counts:
    get:
      operationId: getPendingReviewCounts
      tags: [transactions]
      summary: How many rows are pending review, in total — counted in SQL, never off the page
      description: |
        `GET /transactions/review` returns a CAPPED page (200 rows) because it
        feeds a screen. Any count taken from that page saturates at the cap, so
        a tenant with 5,000 pending rows was told 200 — and the bulk-accept
        button, which acts on EVERY safe pending row and posts them to the
        ledger, was labelled with that capped number. This endpoint is the true
        total, so a label can state the real blast radius of the act.
      responses:
        "200":
          description: True totals over every pending row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingReviewCounts"

  /transactions/review/accept:
    post:
      operationId: acceptPendingTransactions
      tags: [transactions]
      summary: Accept pending transactions (bulk-safe subset, or named ids)
      description: |
        With `ids`: deliberate, named acceptance of any pending rows. Without:
        bulk mode — the server restricts it to rows safe to accept unread
        (categorized or confidently-classified transfers at/above the
        confidence threshold, or manually categorized). needsAttention rows are
        NEVER swept in by bulk mode.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptPendingInput"
      responses:
        "200":
          description: >
            What was accepted and posted, and — for a batch that mixed open and
            closed months — which rows were refused by the period lock and put
            back into review. A rejected row has NO journal entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptPendingResult"
        "422":
          description: >
            Nothing was accepted because no row names a bank account (D-3):
            the body is the `bank_account_required` refusal, carrying the
            `rejected` rows; every row stays in review with no entry. Set the
            bank on each row (PATCH bankAccountId) and accept again.
        "423":
          description: >
            Nothing was accepted because every row's month is closed (a single
            row's Accept, or a bulk whose rows are all closed). The body is the
            `period_closed` refusal, carrying the `rejected` rows; every row
            stays in review with no entry.

  /transactions/{id}/settle:
    post:
      operationId: settleTransaction
      tags: [transactions]
      summary: >
        Accept a pending transaction as the SETTLEMENT of an existing invoice or
        bill (M16.3). One act — accepting the match IS the review: the row
        leaves the holding area AND the payment is recorded through the
        existing pay path (Dr Cash / Cr AR, or Dr AP / Cr Cash). Never
        automatic — a human names the document, however exact the match.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleTransactionInput"
      responses:
        "200":
          description: The settled transaction (kind=settlement, linked, accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /capture:
    post:
      operationId: captureDocument
      tags: [capture]
      summary: >
        Stage a photographed supplier document (A1). The bytes go to DELETABLE
        staging — they become immutable evidence only when posted to a bill
        (BillApproveInput.captureId), after which the promotion job archives
        them.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CaptureUpload"
      responses:
        "201":
          description: The staged capture, with the server-side signature verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"

  /capture/{id}:
    get:
      operationId: getCapturedDocument
      tags: [capture]
      summary: Resume a review from a staged capture (survives a page refresh).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The staged capture's metadata and extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturedDocument"

  /capture/{id}/discard:
    post:
      operationId: discardCapturedDocument
      tags: [capture]
      summary: Discard a staged capture and delete its image
      description: >
        Deletes the stored image IMMEDIATELY rather than leaving it for the
        purge window. Discard is an explicit instruction — most often "I
        photographed the wrong thing", sometimes "my ID card was in frame" — and
        waiting up to 30 days to act on it is not what the word means.

        `imageDeleted` is false when the storage backend could not remove the
        bytes. The discard itself still stands (the instruction is recorded and
        the capture can no longer be attached to a bill), and the image is
        retried by the purge job — but the caller is told, because reporting a
        deletion that did not happen is the defect this endpoint was part of.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscardResult"

  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      summary: >
        List quotations (M21.1). A quotation is an OFFER - it affects no
        ledger, statement or return at any status.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: status
          schema: { type: string, enum: [draft, submitted, approved] }
        - in: query
          name: customer_id
          schema: { type: integer }
        - in: query
          name: outcome
          description: >
            live hides quotations the tenant has declined or closed.
          schema: { type: string, enum: [live, declined, closed] }
      responses:
        "200":
          description: One PAGE of quotations — the envelope, not a bare array (corrected 2026-09-01; the spec had said array since M21)
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Quotation" }
                  page: { $ref: "#/components/schemas/PageInfo" }
                  totals:
                    type: object
                    description: Empty today; reserved for set-wide figures.
                    additionalProperties: { type: number }
    post:
      operationId: createQuotation
      tags: [quotations]
      summary: >
        Create a quotation as a DRAFT. The number is allocated server-side and
        a caller-supplied status is ignored. A caller holding quotations:approve
        has it issued in the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotationInput"
      responses:
        "201":
          description: The created quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getQuotation
      tags: [quotations]
      summary: One quotation, with its lines
      responses:
        "200":
          description: The quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    patch:
      operationId: updateQuotation
      tags: [quotations]
      summary: >
        Edit a quotation. Allowed while draft AND while approved - unlike an
        invoice, because a quotation is an offer rather than a legal document
        and renegotiating an unaccepted price is ordinary business. Locked while
        submitted, and after the tenant has declined or closed it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotationInput"
      responses:
        "200":
          description: The updated quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    delete:
      operationId: deleteQuotation
      tags: [quotations]
      summary: Delete a quotation (admin only)
      responses:
        "204": { description: Deleted }

  /quotations/{id}/submit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: submitQuotation
      tags: [quotations]
      summary: draft to submitted - enters the approver's queue
      responses:
        "200":
          description: The submitted quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: approveQuotation
      tags: [quotations]
      summary: >
        Approve - the quotation may now go to the customer. NOTE: this posts
        nothing. Unlike every other approvable entity, approval here fires no
        accounting activation, because a quotation is not a supply.
      responses:
        "200":
          description: The approved quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/send-back:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: sendBackQuotation
      tags: [quotations]
      summary: submitted to draft, with a correction note
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The returned quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: rejectQuotation
      tags: [quotations]
      summary: Reject a non-approved quotation (hard delete, no archive)
      responses:
        "204": { description: Rejected }

  /quotations/{id}/decline:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: declineQuotation
      tags: [quotations]
      summary: >
        Record that the CUSTOMER said no. A terminal act only the tenant can
        know - the platform never infers it from age or expiry.
      responses:
        "200":
          description: The declined quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/close:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: closeQuotation
      tags: [quotations]
      summary: >
        Abandon what is left of a quotation. The tenant decides a remainder is
        dead; nothing else does.
      responses:
        "200":
          description: The closed quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/reopen:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: reopenQuotation
      tags: [quotations]
      summary: Undo a decline or close recorded in error
      responses:
        "200":
          description: The reopened quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/convert:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: convertQuotation
      tags: [quotations]
      summary: >
        Convert part or all of a quotation into an invoice (M21.2). Omit lines
        to take everything still outstanding. Prices are FROZEN at the quoted
        values. Over-converting a line is refused with 409.

        The invoice is created through the ordinary invoice path and is ALWAYS
        a DRAFT, for every role: issuance consumes an ICV irreversibly and a
        conversion cannot be undone, so an approver looks at the invoice before
        it becomes a legal document. There is no option to change this.

        The conversion record is append-only - there is no undo. A mistake is
        corrected by a credit note against the invoice it produced.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertQuotationInput"
      responses:
        "201":
          description: The conversion and the invoice it produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationConversionResult"
        "409":
          description: >
            Not convertible - not approved, already declined/closed, fully
            converted already, or the requested quantity exceeds what remains.

  /quotations/{id}/conversions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listQuotationConversions
      tags: [quotations]
      summary: >
        The DATED conversion history - one entry per event, each naming the
        invoice it produced. Stored as events rather than a running total so
        the date of every partial acceptance survives.
      responses:
        "200":
          description: The conversion history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuotationConversion"

  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      tags: [purchase-orders]
      summary: >
        List purchase orders (M21.3). A PO is an INTENTION TO BUY - it affects
        no ledger, statement or return at any status.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: status
          schema: { type: string, enum: [draft, submitted, approved] }
        - in: query
          name: vendor_id
          schema: { type: integer }
        - in: query
          name: outcome
          schema: { type: string, enum: [live, cancelled, closed] }
      responses:
        "200":
          description: One PAGE of purchase orders — the envelope, not a bare array (corrected 2026-09-01; the spec had said array since M21)
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PurchaseOrder" }
                  page: { $ref: "#/components/schemas/PageInfo" }
                  totals:
                    type: object
                    description: Empty today; reserved for set-wide figures.
                    additionalProperties: { type: number }
    post:
      operationId: createPurchaseOrder
      tags: [purchase-orders]
      summary: >
        Create a purchase order as a DRAFT. The number is allocated
        server-side; a caller-supplied status is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderInput"
      responses:
        "201":
          description: The created purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getPurchaseOrder
      tags: [purchase-orders]
      summary: One purchase order, with its lines, billed quantities and price variances
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
    patch:
      operationId: updatePurchaseOrder
      tags: [purchase-orders]
      summary: >
        Edit. Allowed while draft AND approved; locked while submitted and
        after a terminal outcome. A line the supplier has already billed cannot
        have its ordered quantity or price changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderInput"
      responses:
        "200":
          description: The updated purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
    delete:
      operationId: deletePurchaseOrder
      tags: [purchase-orders]
      summary: Delete a purchase order (admin only; refused once billed)
      responses:
        "204": { description: Deleted }

  /purchase-orders/{id}/submit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: submitPurchaseOrder
      tags: [purchase-orders]
      summary: >
        draft to submitted - enters the approver queue
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: approvePurchaseOrder
      tags: [purchase-orders]
      summary: >
        Approve - the order may now go to the supplier. Posts nothing: a purchase order is not a purchase.
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/send-back:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: sendBackPurchaseOrder
      tags: [purchase-orders]
      summary: >
        submitted to draft, with a correction note
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBackInput"
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: rejectPurchaseOrder
      tags: [purchase-orders]
      summary: Reject a non-approved order (hard delete, no archive)
      responses:
        "204": { description: Rejected }

  /purchase-orders/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: cancelPurchaseOrder
      tags: [purchase-orders]
      summary: >
        Withdraw the order. NOTE the vocabulary: an order is CANCELLED by us. It is never "declined" - the platform has no way to know whether a supplier refused it.
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/close:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: closePurchaseOrder
      tags: [purchase-orders]
      summary: >
        Abandon whatever the supplier has not billed. The tenant decides a remainder is dead; nothing else does.
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/reopen:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: reopenPurchaseOrder
      tags: [purchase-orders]
      summary: >
        Undo a cancel or close recorded in error
      responses:
        "200":
          description: The purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}/convert:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: convertPurchaseOrder
      tags: [purchase-orders]
      summary: >
        Record the supplier's bill against this order (M21.3).

        THE BILL IS THE TRUTH; THE PURCHASE ORDER IS THE EXPECTATION. The bill
        carries the price the supplier actually charged, the order keeps what
        was ordered, and the difference is recorded as a variance rather than
        silently reconciled.

        The bill is created through the ordinary bill path and is ALWAYS a
        DRAFT, for every role. The record is append-only - there is no undo.

        Over-billing is refused with 409 unless allowOverBilling is set,
        because refusing outright would mean refusing to record a real
        liability.

        NOTE: this tracks BILLING, not delivery. There is no goods-receipt
        concept, so a part-billed order may or may not have been part-delivered
        and nothing here may claim to know which.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertPurchaseOrderInput"
      responses:
        "201":
          description: The conversion and the bill it produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderConversionResult"
        "409":
          description: >
            Not billable - not approved, cancelled/closed, fully billed, or the
            quantity exceeds what remains un-billed without allowOverBilling.

  /purchase-orders/{id}/conversions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listPurchaseOrderConversions
      tags: [purchase-orders]
      summary: >
        The DATED billing history - one entry per supplier bill recorded
        against this order.
      responses:
        "200":
          description: The billing history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrderConversion"

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: >
        The organization's audit trail (admin-only): who did what, when, from
        where, and the before/after states. Append-only at the storage layer -
        there is no write surface here or anywhere. This route predates the
        OpenAPI-first rule and gained its spec entry with its first UI (M23),
        when the response also gained actorName.
      parameters:
        - in: query
          name: entity_type
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: One page of the trail, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: >
        The organization's findings (AI-3a) - deterministic
        internal-consistency observations as rows with state, never a report
        file. Nothing here asserts a tax or compliance position (owner
        decision 2026-08-24: internal-consistency only until C10 closes).
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, acknowledged, resolved] }
        - in: query
          name: kind
          schema: { type: string }
      responses:
        "200":
          description: Findings, most recently seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsPage"

  /ask:
    get:
      operationId: listGroundedAnswers
      tags: [ask]
      summary: >
        The stored, auditable record of what the AI told the tenant (AI-6a,
        register A - facts and projections only). Refusals are rows too; a
        rejected model output is stored as a refusal WITHOUT the rejected
        text.
      responses:
        "200":
          description: Recent exchanges, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundedAnswersPage"
    post:
      operationId: askGroundedQuestion
      tags: [ask]
      summary: >
        Ask the books a question. The model selects ONE deterministic
        computation from a fixed menu and renders its output - it never
        authors a number, never advises (no opinion register exists), and a
        projection must carry its assumption IN the answer or it is
        rejected. 503 when no provider is configured - there is no
        deterministic floor for an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: The verified answer, or an honest refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /ask/status:
    get:
      operationId: getAskStatus
      tags: [ask]
      summary: Whether the assistant is enabled on this deployment (dark until the Enterprise agreement).
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }

  /findings/status:
    get:
      operationId: getFindingsStatus
      tags: [findings]
      summary: >
        Cadence, the last scheduled run, and the derived escalation flag
        (AI-5). Escalation is never stored - it is "unviewed and older than
        the interval", so it cannot drift from the facts that define it.
      responses:
        "200":
          description: The delivery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsStatus"

  /findings/schedule:
    put:
      operationId: setFindingsSchedule
      tags: [findings]
      summary: >
        Set the scheduled-review cadence - calendar quarterly (default) or
        monthly opt-in. Approver authority: the review rhythm is a review
        decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingsScheduleInput"
      responses:
        "200":
          description: The stored cadence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsScheduleInput"

  /findings/run:
    post:
      operationId: runFindings
      tags: [findings]
      summary: >
        Run every check now. Re-detection UPSERTS by (kind, refKey) - an
        acknowledged finding stays acknowledged while still detected; a
        finding no longer detected is machine-resolved and KEPT as the record
        that it was found. Moves nothing in any report.
      responses:
        "200":
          description: What the run changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsRunResult"

  /findings/{id}/acknowledge:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: acknowledgeFinding
      tags: [findings]
      summary: >
        Record that a human reviewed this finding and accepts the state it
        describes ("this duplicate is intentional"). Approver authority - a
        dismissal is a review decision. Survives re-detection; the machine
        never un-acknowledges.
      responses:
        "200":
          description: The acknowledged finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"

  /recurring:
    get:
      operationId: listRecurringRules
      tags: [recurring]
      summary: List recurring document rules (A3)
      responses:
        "200":
          description: The tenant's recurring rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringRuleWithHealth"
    post:
      operationId: createRecurringRule
      tags: [recurring]
      summary: >
        Create a recurring rule (A3). v1 generates DRAFTS ONLY — a rule never
        issues; the draft it produces needs an approver exactly as if typed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringRuleInput"
      responses:
        "201":
          description: The created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}/runs:
    get:
      operationId: getRecurringRuleRuns
      tags: [recurring]
      summary: >
        The rule's run history — "did my rent invoice go out?". Failed runs
        (period_locked, generation_failed) are first-class rows here: silence
        is not a neutral outcome.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringRun"

  /recurring/{id}/pause:
    post:
      operationId: pauseRecurringRule
      tags: [recurring]
      summary: Pause a rule (audited — silently stopping a customer's billing is a real question later)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The paused rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}/resume:
    post:
      operationId: resumeRecurringRule
      tags: [recurring]
      summary: Resume a paused rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The resumed rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringRule"

  /recurring/{id}:
    delete:
      operationId: deleteRecurringRule
      tags: [recurring]
      summary: Delete a rule (its run history cascades; generated documents are untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /transactions/upload:
    post:
      operationId: uploadTransactions
      tags: [transactions]
      summary: Upload transactions from CSV or JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpload"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction (manual override)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categorize:
    post:
      operationId: runCategorization
      tags: [categorize]
      summary: Run the categorization engine on uncategorized transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategorizationRequest"
      responses:
        "200":
          description: Categorization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizationResult"

  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: >
        Budget vs actual for one ANNUAL period (M19.5). `period` is a YYYY
        string — budgets are annual by decision, not by omission: see
        design-analytics.md §7. Actuals are signed by account type (M19.0), so a
        refund reduces spend rather than adding to it.
      parameters:
        - { name: period, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: One row per budgeted category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLine"
    post:
      operationId: createBudget
      tags: [budgets]
      summary: Create an annual budget line for a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetInput" }
      responses:
        "201":
          description: The created budget (without the derived actuals — re-list for those)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400":
          description: Body failed validation

  /budgets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: updateBudget
      tags: [budgets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBudgetInput" }
      responses:
        "200":
          description: The updated budget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400":
          description: Body failed validation
        "404":
          description: Not found
    delete:
      operationId: deleteBudget
      tags: [budgets]
      responses:
        "204":
          description: Deleted

  /analytics/trend:
    get:
      operationId: getTrend
      tags: [analytics]
      summary: >
        Liquidity and solvency per month end (M19.1). Each point carries its own
        `claimable` — the Finance Hub withholding propagates PER POINT, since a
        blocker is a fact about a moment and an earlier month may be clean.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: One point per month, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  /analytics/receivables-bridge:
    get:
      operationId: getReceivablesBridge
      tags: [analytics]
      summary: >
        The receivables bridge per month (M19.6): opening + invoiced − collected
        − credited − other = closing.
      description: >
        Answers what the "receivables outstanding" stock cannot: a rising AR
        balance does not say whether you invoiced more or collected less, and
        those call for opposite responses.

        Every term is a debit or a credit on the SAME GL account, so the
        identity holds by construction rather than by agreement — and `closing`
        is the balance-sheet AR figure for the same date, for the same reason.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: "YYYY-MM" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "YYYY-MM" }
      responses:
        "200":
          description: One point per month, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BridgePoint"

  /analytics/cash:
    get:
      operationId: getCashReconciliation
      tags: [analytics]
      summary: >
        Bank movement and ledger cash side by side, with the gap itemised
        (M19.7).
      description: >
        🔴 TWO FIGURES, DELIBERATELY. The transaction store and the general
        ledger disagree about cash, and each is right about the question it
        answers: "Bank movement" is what the bank statement shows (every
        accepted transaction, including transfers and settlements); "Ledger
        cash" is what the double-entry books say (excluding transfers and
        settlements, which never post, and including payments recorded on a
        document, which create no transaction).

        Following the M16 Q0 precedent — documents FILE, transactions RECONCILE
        — two figures are tolerable only when each says which question it
        answers and the gap between them is accounted for line by line.
        `unexplained` must be zero; anything else means a cause nobody has
        named.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: "YYYY-MM" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "YYYY-MM" }
        - name: bankAccountId
          in: query
          required: false
          schema: { type: integer }
          description: >
            D-3: reconcile ONE bank — its accepted rows against its own GL
            cash account. Omitted = every bank and every cash account, as
            before. Pre-cut-over history still on the "Cash and Bank" header
            belongs to no bank and is excluded from a per-bank view.
      responses:
        "200":
          description: Both series per month, plus the itemised reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashReconciliation"

  /analytics/decomposition:
    get:
      operationId: getDecomposition
      tags: [analytics]
      summary: >
        WHERE a change came from (M19.2) — ranked contributors between a window
        and the equal-length window before it. Never why.
      parameters:
        - { name: dimension, in: query, required: true, schema: { type: string, enum: [category, customer, vendor] } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ranked contributors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decomposition"

  /finance-hub/liquidity:
    get:
      operationId: getLiquidity
      tags: [finance_hub]
      summary: >
        "Can I pay what I owe?" (M18.3) — current/quick assets, current
        liabilities, working capital and the two ratios, from the GL.
      parameters:
        - name: as_of
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: The liquidity position, and whether it may be claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liquidity"

  /finance-hub/tax-compliance:
    get:
      operationId: getTaxCompliance
      tags: [finance_hub]
      summary: >
        Tax & Compliance state (M18.5) — the VAT position for the CURRENT
        CALENDAR QUARTER and ZATCA connection state. The quarter is ours, not
        theirs: KSA filing frequency is not modelled, so this must never be
        presented as "your VAT return".
      responses:
        "200":
          description: VAT position and ZATCA state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxCompliance"

  /finance-hub/books-status:
    get:
      operationId: getBooksStatus
      tags: [finance_hub]
      summary: >
        "Are my books current?" — the unreviewed-transaction signal, mirrored
        from the Banking review surface rather than duplicated (design Q7).
      responses:
        "200":
          description: Counts only; the work happens on /review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksStatus"

  /period-locks:
    get:
      operationId: listPeriodLocks
      tags: [period_locks]
      summary: >
        Accounting periods this company has closed (M18.4). Readable by every
        role; only an organization admin may close or reopen one.
      responses:
        "200":
          description: Closed periods, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeriodLock"
    post:
      operationId: lockPeriod
      tags: [period_locks]
      summary: >
        Close an accounting period. Nothing may afterwards be posted into it —
        a correction posts in the current open period instead, never re-dated
        backwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodLockInput"
      responses:
        "201":
          description: The period is now closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodLock"

  /period-locks/{period}:
    delete:
      operationId: unlockPeriod
      tags: [period_locks]
      summary: >
        Reopen a closed period (admin only). Company-scoped — reopening one
        company's period leaves every other company's locks untouched.
      parameters:
        - name: period
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reopened

  /companies/current/fiscal-years:
    get:
      operationId: listFiscalYears
      tags: [companies]
      summary: >
        The active company's fiscal years, resolved to real date ranges (M17.2).
        The production consumer `companies.fiscal_year_start` never had — it was
        stored from M11.6 and applied by nothing until now.
      responses:
        "200":
          description: The current fiscal period plus a window either side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalYears"

  /companies/current:
    get:
      operationId: getCurrentCompany
      tags: [companies]
      summary: Get the active company's profile (legal identity + address)
      responses:
        "200":
          description: The active company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCurrentCompany
      tags: [companies]
      summary: Update the active company's profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyInput"
      responses:
        "200":
          description: The updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/current/logo:
    get:
      operationId: getCompanyLogo
      tags: [companies]
      summary: >
        The stored company logo, served inline (sandboxed, nosniff) for the
        settings preview and the invoice renderer. 404 when none is stored.
      responses:
        "200":
          description: The logo bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "404":
          description: No logo stored
    put:
      operationId: uploadCompanyLogo
      tags: [companies]
      summary: >
        Upload/replace the company logo (admin only). PNG/JPG/SVG, 2 MB cap,
        bytes sniffed (M-5's rule); SVG with active content refused. Body is
        multipart/form-data with a single 'file' field — left schemaless here
        deliberately: a binary multipart schema generates DOM types (File/Blob)
        the node-side Zod package cannot compile, and the client builds
        FormData by hand (the capture pattern).
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyLogoState"
    delete:
      operationId: removeCompanyLogo
      tags: [companies]
      summary: >
        Remove the company logo (admin only). The invoice header returns to
        the registered name alone.
      responses:
        "200":
          description: Removed (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyLogoState"

  /zatca/onboarding:
    get:
      operationId: getZatcaOnboardingStatus
      tags: [zatca]
      summary: ZATCA onboarding prerequisites and current certificate status
      responses:
        "200":
          description: Prerequisite checklist plus the active certificate, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZatcaOnboardingStatus"
    post:
      operationId: onboardZatca
      tags: [zatca]
      summary: >-
        Run ZATCA onboarding (CSR -> compliance CSID -> six compliance documents
        -> production CSID). The OTP is generated by the tenant in their own
