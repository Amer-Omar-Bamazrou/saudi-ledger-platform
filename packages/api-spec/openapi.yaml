        `outstanding` is what THIS document still has receivable — total − paid − credited for an invoice or debit note, 0 for a credit
        note (its unapplied remainder is a liability in the customer's `position.creditBalance`, never a negative receivable).
      type: object
      required: [id, invoiceNumber, date, dueDate, documentType, status, total, paidAmount, creditedAmount, outstanding, vatAmount, subtotal]
      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        date: { type: string }
        dueDate: { type: ["string", "null"] }
        documentType: { type: string }
        status: { type: string }
        total: { type: number }
        paidAmount: { type: number }
        creditedAmount: { type: number }
        outstanding: { type: number, minimum: 0 }
        vatAmount: { type: number }
        subtotal: { type: number }

